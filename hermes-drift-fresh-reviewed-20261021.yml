                  - textbox [ref=f26e1082]: "{ \"schema\": \"kars.execution-plan/v1\", \"roles\": [ { \"name\": \"polling-advocate\", \"objective\": \"Develop and revise the strongest practical case for periodic polling, directly challenging the watch-based position and preserving evidence of replies and remaining disagreement.\", \"depends_on\": [], \"phases\": [ { \"name\": \"polling-case-and-debate\", \"objective\": \"Research official Kubernetes documentation and assess polling intervals, detection gaps, list cost, pagination, retries, and comparison against desired state. While the watch advocate is active, exchange initial recommendations, directly challenge missed-event recovery and operational burden, answer its challenge, and send a revised recommendation with acceptance conditions. Seek justified agreement without forcing consensus. Retain polling-handoff.md with sources, assumptions, load estimates, revisions, and unresolved issues, plus polling-exchange.md containing attributable sent and received text, available timestamps, and missing replies. Discovery locators are not proof of identity or delivery; preserve failures honestly.\", \"capabilities\": [ \"filesystem-read\", \"filesystem-write\", \"network\" ], \"required_tool_calls\": [], \"min_tool_calls\": 0, \"max_tool_calls\": 48, \"fresh_context\": true, \"execution_mode\": \"native\" } ], \"budget_tokens\": null }, { \"name\": \"watch-advocate\", \"objective\": \"Develop and revise the strongest practical case for event-driven watches, directly challenging the polling position and preserving evidence of replies and remaining disagreement.\", \"depends_on\": [], \"phases\": [ { \"name\": \"watch-case-and-debate\", \"objective\": \"Research official Kubernetes documentation and assess initial listing, resource versions, watch interruption, expired history, relisting, backoff, reconciliation, and desired-state changes. Compare steady-state and recovery load with polling, distinguishing notification delivery from eventual state convergence. While the polling advocate is active, exchange initial recommendations, challenge detection gaps and list cost, answer its challenge, and send a revised recommendation with acceptance conditions. Seek justified agreement without forcing consensus. Retain watch-handoff.md with sources, assumptions, revisions, and unresolved issues, plus watch-exchange.md with attributable sent and received text, available timestamps, and missing replies; acknowledgements alone do not prove receipt.\", \"capabilities\": [ \"filesystem-read\", \"filesystem-write\", \"network\" ], \"required_tool_calls\": [], \"min_tool_calls\": 0, \"max_tool_calls\": 48, \"fresh_context\": true, \"execution_mode\": \"native\" } ], \"budget_tokens\": null } ], \"max_parallel\": 2, \"synthesis\": { \"objective\": \"Read both handoffs and exchange records. Produce a concise decision brief recommending polling, watches, or a justified hybrid for a small team, with assumptions, a recovery/complexity/load comparison, and conditions that change the choice. Produce a practical checklist for initialization, disconnects, expired history, relisting, retries, reconciliation, observability, and recovery drills. Preserve initial positions, attributable challenges and replies, revisions, actual agreement, and unresolved disagreements in discussion evidence. Cite retained sources; flag missing reciprocal discussion as an unmet requirement rather than simulating it. Do not claim to have tested a cluster.\", \"capabilities\": [ \"filesystem-read\", \"filesystem-write\" ], \"max_tool_calls\": 18, \"execution_mode\": \"native\" }, \"deliverables\": [ { \"name\": \"decision-brief.md\", \"media_type\": \"text/markdown\" }, { \"name\": \"recovery-checklist.md\", \"media_type\": \"text/markdown\" }, { \"name\": \"discussion-evidence.md\", \"media_type\": \"text/markdown\" } ] }"
