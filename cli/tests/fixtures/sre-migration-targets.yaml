          name: Sandbox
          type: string
        - jsonPath: .spec.storeName
          name: Store
          type: string
        - jsonPath: .spec.scope
          name: Scope
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for KarsMemorySpec via `CustomResource`
          properties:
            spec:
              description: >-
                `KarsMemory.spec` — declares a Foundry Memory Store binding for
                a

                sandbox.


                Resolution rule: a sandbox can have at most one `KarsMemory` per

                scope key; multiple `KarsMemory` CRs targeting the same sandbox

                must declare distinct `scope` values. Conflict detection is

                router-side (S7) — the CRD admission only validates shape.
              properties:
                bundleRef:
                  description: |-
                    Signed OCI artifact carrying the binding content
                    (`storeName`, `scope`, `retentionDays`,
                    `deleteOnSandboxDelete`, `displayName`). When set, the
                    controller pulls the artifact by digest, verifies its
                    cosign signature against the active
                    [`crate::signer_policy::SignerPolicy`], and merges the
                    bundle content onto `sandboxRef` (always owned by the CR)
                    before writing the binding ConfigMap. Slice 1c.4 of the
                    `crd-well-oiled-machine` plan.

                    Mutually exclusive with the inline content fields above.
                    Admission CEL enforces the mutex; the reconciler also checks
                    as defense-in-depth.
                  nullable: true
                  properties:
                    artifactType:
                      description: >-
                        OCI artifactType media-type, e.g.

                        `application/vnd.kars.egress-allowlist.v1+yaml`.
                        Consumers MUST

                        reject artifacts whose pulled `artifactType` doesn't
                        match.
                      type: string
                    digest:
                      description: >-
                        Content-addressed digest, including the algorithm prefix

                        (`sha256:abc…`). The digest covers the canonical
                        artifact bytes —

                        see `docs/internal/policy-canonical-format.md` for the
                        egress-allowlist

                        canonicalization rules.
                      type: string
                    registry:
                      description: Registry hostname (e.g. `myacr.azurecr.io`, `ghcr.io`).
                      type: string
                    repository:
                      description: Repository path (e.g. `kars/policies/sandbox-foo`).
                      type: string
                  required:
                    - artifactType
                    - digest
                    - registry
                    - repository
                  type: object
                deleteOnSandboxDelete:
                  description: >-
                    If true (default), the runtime path must call `delete_scope`

                    on this scope when the sandbox is deleted or this CR is

                    deleted. The controller-side cleanup is finalizer-only on
                    the

                    binding ConfigMap; Foundry-side delete via the router is

                    wired in S7+.


                    When [`Self::bundle_ref`] is set, the bundle supplies this

                    value; the CR's inline value MUST be absent in that case.

                    Default-true is applied at the reconciler layer (after the

                    bundle / inline merge) so `None` here is meaningful (= "use

                    bundle value or default").
                  nullable: true
                  type: boolean
                displayName:
                  description: |-
                    Optional human-readable label. MUST be absent when
                    [`Self::bundle_ref`] is set.
                  nullable: true
                  type: string
                retentionDays:
                  description: |-
                    Optional retention floor in days. Runtime path may apply a
                    `delete_scope` sweep when entries exceed this age. CEL:
                    `> 0` when set.
                  format: uint32
                  minimum: 0
                  nullable: true
                  type: integer
                sandboxRef:
                  description: |-
                    Sandbox this binding applies to. Owned by the CR (never the
                    signed bundle) — one signed bundle can be referenced by
                    multiple `KarsMemory` CRs targeting different sandboxes.
                  properties:
                    name:
                      description: Sandbox name (`KarsSandbox.metadata.name`).
                      type: string
                  required:
                    - name
                  type: object
                scope:
                  description: >-
                    Scope key under which this sandbox writes/reads memories.

                    Foundry Memory Store partitions data per scope and validates
                    the

                    value to letters, digits, and `_ - . % + @ /` — colons are

                    rejected. CEL: non-empty + charset. Default convention (set
                    by

                    the runtime path if absent here): `agent_{sandboxName}`.


                    Required when [`Self::bundle_ref`] is absent (the inline

                    path); MUST be absent when [`Self::bundle_ref`] is set.
                  nullable: true
                  type: string
                storeName:
                  description: |-
                    Foundry Memory Store name. The runtime path
                    (`cli/src/plugin.ts::ensureMemoryStore`) creates the store
                    on first use if absent. CEL: non-empty,
                    DNS-label-style (lowercase alphanumeric + dashes).

                    Required when [`Self::bundle_ref`] is absent (the inline
                    path); MUST be absent when [`Self::bundle_ref`] is set
                    (the bundle supplies the value). Admission CEL enforces
                    the mutex.
                  nullable: true
                  type: string
              required:
                - sandboxRef
              type: object
              x-kubernetes-validations:
                - message: spec.storeName must be a DNS-label (1-63 chars, lowercase alphanumeric
                    + dashes) when spec.bundleRef is not set
                  reason: FieldValueInvalid
                  rule: has(self.bundleRef) || (has(self.storeName) && size(self.storeName) > 0 &&
                    size(self.storeName) <= 63 &&
                    self.storeName.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'))
                - message: spec.sandboxRef.name must be 1-253 characters
                  reason: FieldValueInvalid
                  rule: size(self.sandboxRef.name) > 0 && size(self.sandboxRef.name) <= 253
                - message: spec.scope must be 1-256 characters using only letters, digits, and _ -
                    . % + @ / (colons are rejected by the Foundry Memory Store)
                    when spec.bundleRef is not set
                  reason: FieldValueInvalid
                  rule: has(self.bundleRef) || (has(self.scope) && size(self.scope) > 0 &&
                    size(self.scope) <= 256 &&
                    self.scope.matches('^[A-Za-z0-9_./%+@-]+$'))
                - message: spec.retentionDays must be > 0 when set (use delete_scope for immediate
                    deletion)
                  reason: FieldValueInvalid
                  rule: "!has(self.retentionDays) || self.retentionDays > 0"
                - message: spec.bundleRef is mutually exclusive with spec.storeName, spec.scope,
                    spec.retentionDays, spec.deleteOnSandboxDelete, and
                    spec.displayName
                  reason: FieldValueInvalid
                  rule: "!has(self.bundleRef) || (!has(self.storeName) && !has(self.scope) &&
                    !has(self.retentionDays) && !has(self.deleteOnSandboxDelete)
                    && !has(self.displayName))"
            status:
              description: Status of a `KarsMemory` reconcile.
              nullable: true
              properties:
                bindingConfigMapRef:
                  description: >-
                    Pointer to the binding `ConfigMap` produced by the
                    reconciler.

                    The router-side informer (S7) watches by label selector;
                    this

                    status field is for human / CLI consumption.
                  nullable: true
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                bundleRefDigest:
                  description: |-
                    `sha256:...` of the signed bundle the controller last pulled
                    for `spec.bundleRef`. Stamped when the bundle path produced
                    the effective spec used in the latest reconcile; `None` when
                    the spec used the inline path or no successful fetch has
                    happened yet. Slice 1c.4.
                  nullable: true
                  type: string
                compiledDigest:
                  description: >-
                    `sha256:<hex>` digest of the canonical binding JSON the

                    controller published — the value every referencing sandbox's

                    router must echo via `GET /internal/policy-status` before
                    the

                    CR is promoted to `phase=Ready` (principles.md §3, Slice
                    3a).

                    Stays unset on `phase=Failed`.
                  nullable: true
                  type: string
                conditions:
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another. This should be when the
                          underlying condition changed.  If that is not known,
                          then using the time when the API field changed is
                          acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition. This may be an empty string.
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon. For instance, if
                          .metadata.generation is currently 12, but the
                          .status.conditions[x].observedGeneration is 9, the
                          condition is out of date with respect to the current
                          state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition. Producers of specific
                          condition types may define expected values and
                          meanings for this field, and whether the values are
                          considered a guaranteed API. The value should be a
                          CamelCase string. This field may not be empty.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  nullable: true
                  type: array
                lastReconciledAt:
                  description: Last time the binding was compiled and pushed.
                  nullable: true
                  type: string
                loadedDigest:
                  description: |-
                    `sha256:<hex>` digest the inference-router last echoed for
                    this CR's compiled binding. Populated only in the
                    `RouterEnforcementState::Confirmed` branch — when every
                    referencing sandbox returns the matching digest, this equals
                    [`Self::compiled_digest`]. `None` otherwise (awaiting echo,
                    no sandboxes referencing, or transient poll failure). The
                    CLI / `kubectl describe` operator diffs against
                    `compiledDigest` here.
                  nullable: true
                  type: string
                observedGeneration:
                  description: "`metadata.generation` last successfully reconciled. KEP-1623."
                  format: int64
                  nullable: true
                  type: integer
                phase:
                  nullable: true
                  type: string
                versionHash:
                  description: Hex-encoded sha256 prefix of the compiled binding JSON.
                  nullable: true
                  type: string
              type: object
          required:
            - spec
          title: KarsMemory
          type: object
      served: true
      storage: true
      subresources:
        status: {}

