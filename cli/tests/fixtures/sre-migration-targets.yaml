        openAPIV3Schema:
          description: Auto-generated derived type for KarsSkillSpec via `CustomResource`
          properties:
            spec:
              description: "`KarsSkill.spec` — a governed, versioned capability bundle."
              properties:
                attestationRef:
                  description: >-
                    Optional cosign attestation reference (an OCI ref / digest
                    of the signed

                    skill bundle). When present, surfaced on the status as the
                    attestation

                    the skill was published with (full verification is a V1
                    supply-chain

                    concern; recording the claim is honest provenance now).
                  nullable: true
                  type: string
                boundingPolicy:
                  description: >-
                    The **bounding tool policy** — the name of a same-namespace
                    `ToolPolicy`

                    that is the authority ceiling on every tool the skill calls.
                    **Required**:

                    a skill that calls tools without a bound is rejected at
                    admission.
                  type: string
                displayName:
                  description: Human-readable display name (e.g. "Repo triage", "Hotel
                    itemization").
                  nullable: true
                  type: string
                knowledgePack:
                  description: >-
                    Optional knowledge-pack reference (the name of a team
                    knowledge commons

                    or a packaged knowledge set the skill ships with).
                  nullable: true
                  type: string
                mcpServers:
                  description: The MCP servers (same-namespace `MCPServer` names) this skill
                    connects.
                  items:
                    type: string
                  type: array
                recipe:
                  description: >-
                    The **recipe** — standing instructions for using the
                    capability well,

                    merged into the instructions of a member that acquires this
                    skill.
                  nullable: true
                  type: string
                summary:
                  description: What the skill does, in one or two plain-language sentences.
                  type: string
                version:
                  description: >-
                    Author-declared semantic version (e.g. "1.2.0"). Surfaced
                    verbatim; the

                    controller also computes a content `versionDigest` that pins
                    the bundle.
