                    injection guard)
                  reason: FieldValueInvalid
                  rule: "!has(self.rationale) ||
                    !self.rationale.matches('[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\
                    \\x7F]')"
            status:
              description: "`KarsSREAction.status` — controller-managed phase + observation."
              nullable: true
              properties:
                appliedAt:
                  description: |-
                    Wall-clock timestamp the controller minted the writer token
                    and executed the action (set on transition into Applied).
                  nullable: true
                  type: string
                conditions:
                  description: >-
                    Standard k8s conditions. The reconciler stamps:
                      - `Available` (True iff phase=Applied/Recovered)
                      - `Approved` (True iff spec.approval.state=Approved)
                      - `Executed` (True iff the action ran via the minted token)
                      - `Recovered` (True iff post-apply observation passed)
                      - `Degraded` (True with reason if anything went wrong)
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another. This should be when the
                          underlying condition changed.  If that is not known,
                          then using the time when the API field changed is
                          acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition. This may be an empty string.
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon. For instance, if
                          .metadata.generation is currently 12, but the
                          .status.conditions[x].observedGeneration is 9, the
                          condition is out of date with respect to the current
                          state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition. Producers of specific
                          condition types may define expected values and
                          meanings for this field, and whether the values are
                          considered a guaranteed API. The value should be a
                          CamelCase string. This field may not be empty.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                observedGeneration:
                  description: |-
                    `metadata.generation` last reconciled. When != current, the
                    reconciler still has work to do.
                  format: int64
                  nullable: true
                  type: integer
                phase:
                  description: >-
                    `Proposed` → `Approved` → `Applied` → `Recovered` |
                    `Failed`.

                    Or `Rejected` (operator denied) / `Expired` (TTL elapsed).
                  nullable: true
                  type: string
                writerCrbName:
                  description: >-
                    Name of the one-shot ClusterRoleBinding the controller
                    minted

                    for the writer SA on approval. Cleaned up post-execution.

                    Persisted in status so the cleanup reconciler can find it

                    after a controller restart.
                  nullable: true
                  type: string
              type: object
          required:
            - spec
          title: KarsSREAction
          type: object
      served: true
      storage: true
      subresources:
        status: {}

