apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: toolpolicies.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: ToolPolicy
    plural: toolpolicies
    shortNames:
      - tp
    singular: toolpolicy
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.appliesTo.tool
          name: Tool
          type: string
        - jsonPath: .spec.commerce.dailyCap
          name: DailyCap
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for ToolPolicySpec via `CustomResource`
          properties:
            spec:
              description: >-
                `ToolPolicy.spec` — declares per-tool gating: rate limits,
                approval,

                and AP2 commerce caps. Resolves bottom-up (most-specific
                selector

                wins). See `docs/api/lifecycle.md` for resolution semantics.
              properties:
                agtProfile:
                  description: >-
                    Customer-supplied AGT policy profile. The controller writes
                    the

                    raw profile bytes into the compiled ConfigMap under key

                    `agt-profile.yaml` and the sandbox inference-router loads it
                    via

                    the AGT policy engine. This is the **sole** source of AGT
                    policy

                    profiles post-Slice-1e — the bundled

                    `/opt/kars-plugin/policies/*.yaml` fallback that older

                    releases shipped has been removed.


                    Two sources are supported (mutually exclusive):

                    - `inline`: raw YAML carried in the spec (Slice 1b)

                    - `bundleRef`: signed OCI artifact (Slice 1c.2) — the
                    controller
                      pulls + cosign-verifies via
                      [`crate::policy_fetcher::fetch_and_verify_generic`] with
                      [`crate::policy_canonical::tools::ToolsKind`] and writes the
                      verified bytes into the same ConfigMap key. The wire contract
                      with the router is identical to the inline path — the router
                      doesn't know (or need to know) which source produced the bytes.

                    Mutual exclusion: admission CEL (in the Helm CRD) enforces

                    `has(inline) != has(bundleRef)`. The reconciler also checks
                    this

                    at runtime as a defense-in-depth measure (older clusters
                    without

                    the latest CRD).


                    Per principles.md §3: when `agtProfile` is set, the
                    controller

                    stamps `phase=Compiled` and `Ready=False /

                    reason=AwaitingRouterEnforcement` until the
                    router-confirmation

                    poller closes the loop. Fetch failures (signature, ACR,
                    parse)

                    surface as `Ready=False / reason=AllowlistMissing|…` —
                    reusing

                    the egress error taxonomy via
                    [`crate::policy_fetcher::FetchError`].
                  nullable: true
                  properties:
                    bundleRef:
                      description: >-
                        Signed OCI artifact reference. The controller pulls the
                        artifact

                        from `<registry>/<repository>@<digest>`, verifies the
                        cosign

                        signature against the active
                        [`crate::signer_policy::SignerPolicy`],

                        re-validates the AGT YAML structure

                        ([`crate::policy_canonical::tools::ToolsKind`]), and
                        writes the

                        bytes into the compiled-profile ConfigMap under

                        `agt-profile.yaml`. On any verification failure the
                        controller

                        stamps `Ready=False /
                        reason=AllowlistMissing|AllowlistMalformed|

                        AllowlistUnauthorized|AllowlistSignatureVerifyFailed`
                        (the same

                        `FetchError` variants used by egress — one error
                        taxonomy

                        across all signed-policy kinds).


                        Artifact `artifactType` MUST be

                        `application/vnd.kars.agt-profile.v1+yaml`; a mismatch

                        surfaces as `Ready=False / reason=InvalidRef`.
                      nullable: true
                      properties:
                        artifactType:
                          description: >-
                            OCI artifactType media-type, e.g.

                            `application/vnd.kars.egress-allowlist.v1+yaml`.
                            Consumers MUST

                            reject artifacts whose pulled `artifactType` doesn't
                            match.
                          type: string
                        digest:
                          description: >-
                            Content-addressed digest, including the algorithm
                            prefix

                            (`sha256:abc…`). The digest covers the canonical
                            artifact bytes —

                            see `docs/internal/policy-canonical-format.md` for
                            the egress-allowlist

                            canonicalization rules.
                          type: string
                        registry:
                          description: Registry hostname (e.g. `myacr.azurecr.io`, `ghcr.io`).
                          type: string
                        repository:
                          description: Repository path (e.g. `kars/policies/sandbox-foo`).
                          type: string
                      required:
                        - artifactType
                        - digest
                        - registry
                        - repository
                      type: object
                    inline:
                      description: >-
                        Inline AGT policy YAML body. Plain string — admission
                        validates

                        it is non-empty; the router parses it at load time and
                        surfaces

                        any syntax error via `GET /internal/policy-status`.
                      nullable: true
                      type: string
                  type: object
                appliesTo:
                  description: >-
                    Selector: which tool calls this policy applies to. AND of
                    tool name,

                    MCP server, and sandbox label-selector.
                  properties:
                    mcpServer:
                      description: >-
                        MCP server name (`McpServer.metadata.name`) the tool
                        must come

                        from. Empty means any.
                      nullable: true
                      type: string
                    sandboxMatchLabels:
                      additionalProperties:
                        type: string
                      default: {}
                      description: Sandbox label selector. AND with the other fields.
                      type: object
                    tool:
                      description: Tool name as advertised by the MCP server. `"*"` matches all.
                      nullable: true
                      type: string
                  type: object
                approval:
                  description: "Approval policy: human-in-the-loop confirmation step."
                  nullable: true
                  properties:
                    channel:
                      description: Approval channel reference, e.g. Telegram bot, email.
                      nullable: true
                      type: string
                    mode:
                      description: >-
                        Approval required: `never` | `always` |
                        `aboveThreshold`.

                        Default `aboveThreshold` when commerce is set.
                      nullable: true
                      type: string
                    threshold:
                      description: >-
                        Threshold value (currency string) above which approval
                        is

                        required. Only meaningful when `mode ==
                        "aboveThreshold"`.
                      nullable: true
                      type: string
                  type: object
                commerce:
                  description: >-
                    AP2 commerce caps. Optional — present only for tools that
                    move

                    money / commit purchases / sign transfers.
                  nullable: true
                  properties:
                    counterpartyAllowlist:
                      default: []
                      description: |-
                        Counterparty allowlist. Empty = deny-all (fail-closed).
                        Format: AP2 counterparty identifier (DID or domain).
                      items:
                        type: string
                      type: array
                    dailyCap:
                      description: >-
                        Daily spend cap as ISO-4217 currency string with
                        2-decimal-place

                        integer minor units, e.g. `"USD 100.00"`. Parser is
                        strict;

                        admission CEL rejects malformed values at apply time.
                      nullable: true
                      type: string
                    monthlyCap:
                      description: Monthly spend cap. Must be >= dailyCap (admission CEL).
                      nullable: true
                      type: string
                    perTransferCap:
                      description: >-
                        Per-transfer hard cap. Even within daily/monthly, a
                        single

                        transfer above this is refused.
                      nullable: true
                      type: string
                  type: object
                displayName:
                  description: Optional human-readable label.
                  nullable: true
                  type: string
                rateLimit:
                  description: Rate-limit configuration. Resolved by AGT RateLimiter.
                  nullable: true
                  properties:
                    burst:
                      description: Burst (token bucket size).
                      format: uint32
                      minimum: 0
                      nullable: true
                      type: integer
                    rps:
                      description: Requests per second across all matching invocations.
                      format: uint32
                      minimum: 0
                      nullable: true
                      type: integer
                    window:
                      description: Window for the counter, e.g. `"1m"`, `"1h"`, `"24h"`.
                      nullable: true
                      type: string
                  type: object
              required:
                - appliesTo
              type: object
              x-kubernetes-validations:
                - message: spec.appliesTo.sandboxMatchLabels must contain at least one label
                  reason: FieldValueInvalid
                  rule: has(self.appliesTo.sandboxMatchLabels) &&
                    size(self.appliesTo.sandboxMatchLabels) > 0
                - message: spec.agtProfile.inline and spec.agtProfile.bundleRef are mutually
                    exclusive
                  reason: FieldValueInvalid
                  rule: "!has(self.agtProfile) || !(has(self.agtProfile.inline) &&
                    has(self.agtProfile.bundleRef))"
            status:
              nullable: true
              properties:
                agtProfileBundleDigest:
                  description: >-
                    Verified OCI manifest digest when the AGT profile was
                    sourced

                    from `spec.agtProfile.bundleRef`. Distinct from

                    [`Self::agt_profile_digest`]: that one is the
                    length-prefixed

                    hash over the *content* (wire contract with the router);
                    this

                    one is the *OCI manifest digest* re-validated against

                    `bundleRef.digest` after cosign verification (the
                    supply-chain

                    attestation). `None` when the profile came from `inline`.
                  nullable: true
                  type: string
                agtProfileDigest:
                  description: |-
                    Length-prefixed sha256 digest (Slice 1a aggregate canonical
                    format) of the AGT profile bytes the controller published to
                    the compiled ConfigMap. Set when `spec.agtProfile.inline` OR
                    `spec.agtProfile.bundleRef` produces a profile. The router
                    echoes this digest on `GET /internal/policy-status` once it
                    has loaded the profile; the controller-side confirmation
                    poller uses it to promote `Compiled → Ready`.
                  nullable: true
                  type: string
                conditions:
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another. This should be when the
                          underlying condition changed.  If that is not known,
                          then using the time when the API field changed is
                          acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition. This may be an empty string.
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon. For instance, if
                          .metadata.generation is currently 12, but the
                          .status.conditions[x].observedGeneration is 9, the
                          condition is out of date with respect to the current
                          state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition. Producers of specific
                          condition types may define expected values and
                          meanings for this field, and whether the values are
                          considered a guaranteed API. The value should be a
                          CamelCase string. This field may not be empty.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  nullable: true
                  type: array
                lastCompiledAt:
                  description: Last time the policy was compiled to an AGT profile and pushed.
                  nullable: true
                  type: string
                observedGeneration:
                  description: "`metadata.generation` last successfully reconciled. KEP-1623."
                  format: int64
                  nullable: true
                  type: integer
                phase:
                  nullable: true
                  type: string
              type: object
          required:
            - spec
          title: ToolPolicy
          type: object
      served: true
      storage: true
      subresources:
        status: {}

