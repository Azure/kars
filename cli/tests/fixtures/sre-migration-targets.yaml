                tokenHash:
                  type: string
                  description: SHA-256 hash of the pairing token secret (hex-encoded)
                expiresAt:
                  type: string
                  description: ISO 8601 timestamp when this pairing expires
                slotsMax:
                  type: integer
                  default: 1
                  description: Maximum concurrent offload sandboxes
                tokenBudget:
                  type: integer
                  default: 500000
                  description: Maximum total tokens the paired agent can consume
                capabilities:
                  type: array
                  items:
                    type: string
                  default:
                    - offload
                    - handoff
                  description: Granted capabilities
                displayName:
                  type: string
                  description: Admin-friendly display name
                model:
                  type: string
                  description: Inference model for offload sandboxes
                isolation:
                  type: string
                  enum:
                    - standard
                    - enhanced
                    - confidential
                  description: Isolation level for offload sandboxes
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - PendingPairing
                    - Active
                    - Expired
                    - Revoked
                boundAmid:
                  type: string
                  description: External agent AMID (set on pairing)
                boundPubkeyEd25519:
                  type: string
                  description: External agent Ed25519 public key (base64)
                pairedAt:
                  type: string
                  format: date-time
                slotsUsed:
                  type: integer
                tokensUsed:
                  type: integer
                lastOffloadAt:
                  type: string
                  format: date-time
                offloadsCompleted:
                  type: integer
                offloadsFailed:
                  type: integer
                activeSandbox:
                  type: string
                conditions:
                  type: array
                  description: Standard Kubernetes conditions for KarsPairing
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
