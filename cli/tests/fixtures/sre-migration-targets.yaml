apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karssandboxes.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
spec:
  group: kars.azure.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: "!has(self.spec) || !has(self.spec.credentialsRef) ||
                self.spec.credentialsRef.name == 'kars-credential-source-' +
                self.metadata.name"
              message: credentialsRef must use the reserved source name for this Sandbox
          properties:
            spec:
              type: object
              required:
                - runtime
                - sandbox
                - inferenceRef
              x-kubernetes-validations:
                - rule: "!has(self.credentialsRef) || !has(self.upstreamCompatibility) ||
                    !has(self.upstreamCompatibility.sigsAgentSandbox) ||
                    self.upstreamCompatibility.sigsAgentSandbox != 'overlay'"
                  message: credentialsRef requires a controller-managed runtime, not overlay mode
                - rule: self.runtime.kind != 'BYO' || !has(self.agent)
                  message: spec.agent (Foundry agent) is incompatible with spec.runtime.kind=BYO;
                    BYO runtimes own their own inference + agent loop
                  reason: FieldValueInvalid
                - rule: "!has(self.governance) || !has(self.governance.toolPolicyRef) ||
                    !has(self.governance.toolPolicyRef.name) ||
                    (!self.governance.toolPolicyRef.name.contains('/') &&
                    !self.governance.toolPolicyRef.name.contains(':'))"
                  message: spec.governance.toolPolicyRef.name must be a same-namespace name (no
                    '/' or ':' separators); cross-namespace refs are forbidden
                  reason: FieldValueInvalid
              properties:
                upstreamCompatibility:
                  type: object
                  description: Existing upstream interoperability settings; omitted by native
                    Sandboxes.
                  x-kubernetes-validations:
                    - rule: "!has(self.sigsAgentSandbox) || self.sigsAgentSandbox != 'overlay' ||
                        has(self.upstreamSandboxRef)"
                      message: overlay mode requires a same-namespace upstreamSandboxRef
                  properties:
                    sigsAgentSandbox:
                      type: string
                      enum:
                        - off
                        - observe
                        - translate
                        - overlay
                    upstreamSandboxRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                    aiConformanceReference:
                      type: boolean
                credentialBindings:
                  description: Explicit governed credential sources and key grants; included in
                    task authority.
                  type: object
                  required:
                    - grant
                    - sources
                  properties:
                    grant:
                      type: object
                      required:
                        - name
                        - uid
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                        uid:
                          type: string
                          minLength: 1
                          maxLength: 128
                    sources:
                      type: array
                      minItems: 1
                      maxItems: 3
                      items:
                        type: object
                        required:
                          - keys
                          - scope
                          - source
                        properties:
                          scope:
                            type: string
                            enum:
                              - workspace
                              - team
                              - target
                          source:
                            type: object
                            required:
                              - name
                              - uid
                            properties:
                              name:
                                type: string
                                minLength: 1
                                maxLength: 253
                              uid:
                                type: string
                                minLength: 1
                                maxLength: 128
                          keys:
                            type: array
                            maxItems: 128
                            items:
                              type: string
                              pattern: ^[A-Z_][A-Z0-9_]{0,127}$
                          owner:
                            type: object
                            required:
                              - kind
                              - name
                              - namespace
                              - uid
                            properties:
                              kind:
                                type: string
                                enum:
                                  - KarsSandbox
                                  - KarsTask
                                  - KarsTeam
                              namespace:
                                type: string
                                minLength: 1
                                maxLength: 63
                              name:
                                type: string
                                minLength: 1
                                maxLength: 253
                              uid:
                                type: string
                                minLength: 1
                                maxLength: 128
                githubBinding:
                  type: object
                  required:
                    - connection
                    - grant
                    - repositories
                  properties:
                    grant:
                      type: object
                      required:
                        - name
                        - uid
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                        uid:
                          type: string
                          minLength: 1
                          maxLength: 128
                    connection:
                      type: object
                      required:
                        - name
                        - uid
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                        uid:
                          type: string
                          minLength: 1
                          maxLength: 128
                    repositories:
                      type: array
                      minItems: 1
                      maxItems: 32
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 140
                        pattern: ^[a-z0-9._-]{1,39}/[a-z0-9._-]{1,100}$
                    write:
                      type: boolean
                      default: false
                inferenceBudgetRef:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Controller-generated Task/account UID binding; validated against
                    live task authority before private routing
                credentialsRef:
                  type: object
                  description: Explicit agent credential collection in this Sandbox's workspace;
                    replaces legacy credentials while set. Missing/replaced
                    sources fail closed.
                  required:
                    - name
                    - uid
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: ^kars-credential-(source|bundle)-[a-z0-9][a-z0-9-]*$
                    uid:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9-]+$
                runtime:
                  type: object
                  required:
                    - kind
                  description: |
                    Agent runtime selector (S10.A1 multi-runtime hosting).
                    The `kind` discriminator selects which sibling struct
                    (`openclaw` / `openaiAgents` / `microsoftAgentFramework`
                    / `semanticKernel` / `langGraph` / `anthropic`
                    /                     `pydanticAi` / `hermes` / `byo`)
                    is required; the others must be absent.
                    Replaces the legacy `spec.openclaw` field — the
                    kars v1alpha1 schema is in-place edited (no
                    conversion webhook; pre-release simplification).
                    Declared placeholders (`semanticKernel`) parse but the
                    controller stamps
                    `RuntimeReady=False / AdapterMissing` until the
                    respective adapter image ships.
                  x-kubernetes-validations:
                    - rule: (self.kind == 'OpenClaw') == has(self.openclaw)
                      message: spec.runtime.openclaw must be set iff kind is OpenClaw
                    - rule: (self.kind == 'OpenAIAgents') == has(self.openaiAgents)
                      message: spec.runtime.openaiAgents must be set iff kind is OpenAIAgents
                    - rule: (self.kind == 'MicrosoftAgentFramework') ==
                        has(self.microsoftAgentFramework)
                      message: spec.runtime.microsoftAgentFramework must be set iff kind is
                        MicrosoftAgentFramework
                    - rule: (self.kind == 'SemanticKernel') == has(self.semanticKernel)
                      message: spec.runtime.semanticKernel must be set iff kind is SemanticKernel
                    - rule: (self.kind == 'LangGraph') == has(self.langGraph)
                      message: spec.runtime.langGraph must be set iff kind is LangGraph
                    - rule: (self.kind == 'Anthropic') == has(self.anthropic)
                      message: spec.runtime.anthropic must be set iff kind is Anthropic
                    - rule: (self.kind == 'PydanticAi') == has(self.pydanticAi)
                      message: spec.runtime.pydanticAi must be set iff kind is PydanticAi
                    - rule: (self.kind == 'Hermes') == has(self.hermes)
                      message: spec.runtime.hermes must be set iff kind is Hermes
                    - rule: (self.kind == 'BYO') == has(self.byo)
                      message: spec.runtime.byo must be set iff kind is BYO
                  properties:
                    kind:
                      type: string
                      enum:
                        - OpenClaw
                        - OpenAIAgents
                        - MicrosoftAgentFramework
                        - SemanticKernel
                        - LangGraph
                        - Anthropic
                        - PydanticAi
                        - Hermes
                        - BYO
                      description: Variant discriminator. PascalCase wire values.
                    openclaw:
                      type: object
                      properties:
                        version:
                          type: string
                          description: OpenClaw version to deploy
                        image:
                          type: string
                          description: Container image for the sandbox
                        config:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          description: OpenClaw configuration (openclaw.json equivalent)
                        extraEnv:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          description: Extra environment variables (key/value map) injected into the
                            openclaw container. Used by the controller for
                            offload parameters (OFFLOAD_REQUEST_ID,
                            OFFLOAD_PARENT_AMID, OFFLOAD_TASK,
                            OFFLOAD_TIMEOUT_MINUTES).
                    openaiAgents:
                      type: object
                      description: OpenAI Agents Python runtime variant.
                      properties:
                        pythonVersion:
                          type: string
                          description: Python interpreter version, e.g. '3.12'
                        agentCode:
                          type: object
                          description: Where the user's agent code comes from. Exactly one of `oci` /
                            `git`.
                          x-kubernetes-validations:
                            - rule: has(self.oci) != has(self.git)
                              message: spec.runtime.openaiAgents.agentCode must set exactly one of `oci` or
                                `git`
                          properties:
                            oci:
                              type: object
                              required:
                                - image
                              properties:
                                image:
                                  type: string
                                  description: Fully-qualified OCI image reference
                            git:
                              type: object
                              required:
                                - url
                              properties:
                                url:
                                  type: string
                                ref:
                                  type: string
                                  description: Branch / tag / commit SHA. Defaults to HEAD.
                                path:
                                  type: string
                                  description: Subdirectory inside the repo. Defaults to repo root.
                        entrypoint:
                          type: array
                          items:
                            type: string
                          description: Container entrypoint override. Defaults to the adapter's stock
                            launcher.
                        extraEnv:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                    microsoftAgentFramework:
                      type: object
                      description: Microsoft Agent Framework runtime variant. Python is wired. .NET is
                        blocked upstream on a `Microsoft.AgentGovernance` .NET
                        package that exposes an `AgentMesh` relay client (the
                        package today ships trust/identity/policy/audit only);
                        it will be re-introduced once upstream lands.
                      properties:
                        language:
                          type: string
                          enum:
                            - python
                          description: Adapter image flavour. v1.0 ships Python only; .NET tracked for
                            v1.1.
                        agentCode:
                          type: object
                          x-kubernetes-validations:
                            - rule: has(self.oci) != has(self.git)
                              message: spec.runtime.microsoftAgentFramework.agentCode must set exactly one of
                                `oci` or `git`
                          properties:
                            oci:
                              type: object
                              required:
                                - image
                              properties:
                                image:
                                  type: string
                            git:
                              type: object
                              required:
                                - url
                              properties:
                                url:
                                  type: string
                                ref:
                                  type: string
                                path:
                                  type: string
                        entrypoint:
