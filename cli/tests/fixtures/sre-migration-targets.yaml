apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karstasks.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: KarsTask
    plural: karstasks
    shortNames:
      - ctask
    singular: karstask
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.envelope.tier
          name: Tier
          type: integer
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.executionPhase
          name: Execution
          type: string
        - jsonPath: .spec.envelope.delegationDepth
          name: Depth
          type: integer
        - jsonPath: .status.envelopeDigest
          name: EnvelopeDigest
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for KarsTaskSpec via `CustomResource`
          properties:
            spec:
              description: "`KarsTask.spec` — a governed unit of work plus its trust
                envelope."
              properties:
                blueprint:
                  description: >-
                    The **run blueprint** — the concrete, editable shape of the
                    agent that

                    will run this task: which harness, which model, the system
                    prompt, the

                    connected services (MCP) and tools it may use, the network
                    destinations

                    it may reach, and the sandbox isolation. This is the
                    substance a human

                    reviews and edits on the §20 launch package; every field
                    here drives a

                    real field on the materialized `InferencePolicy` /
                    `KarsSandbox`. When a

                    field is unset the controller falls back to a safe default.
                  nullable: true
                  properties:
                    egress:
                      description: >-
                        Network destinations the mission may reach. Drives

                        `KarsSandbox.spec.networkPolicy.allowedEndpoints`. Task
                        sandboxes always

                        use Strict mode, including an empty list (no additional
                        destinations).
                      items:
                        description: A network destination the mission may reach.
                        properties:
                          host:
                            description: Hostname, e.g. `api.github.com`.
                            type: string
                          port:
                            description: Optional TCP port (e.g. `443`); any port when omitted.
                            format: uint16
                            maximum: 65535
                            minimum: 0
                            nullable: true
                            type: integer
                        required:
                          - host
                        type: object
                      type: array
                    instructions:
                      description: >-
                        System prompt / standing instructions for the agent, in
                        addition to the

                        objective. Drives `KarsSandbox.spec.agent.instructions`.
                      nullable: true
                      type: string
                    isolation:
                      description: >-
                        Sandbox isolation level (`standard`, `enhanced`,
                        `confidential`). Drives

                        `KarsSandbox.spec.sandbox.isolation`. Defaults to
                        `standard`.
                      nullable: true
                      type: string
                    mcpServers:
                      description: >-
                        Connected services (MCP server names, same namespace)
                        the mission may

                        use. Drives `KarsSandbox.spec.governance.mcpServerRefs`.
                        Requires

                        `toolPolicy` to be set (governed MCP access is bounded
                        by the tool

                        policy).
                      items:
                        type: string
                      type: array
                    memory:
                      description: >-
                        Shared team memory — the name of a same-namespace
                        `KarsMemory` the agent

                        reads/writes. Drives `KarsSandbox.spec.memoryRef`. This
                        is how a

                        persistent team shares knowledge across members and over
                        time; a short

                        one-off task usually leaves it unset.
                      nullable: true
                      type: string
                    model:
                      description: >-
                        The model the agent reasons with. Drives

                        `InferencePolicy.spec.modelPreference.primary`. Defaults
                        from controller

                        env when unset.
                      nullable: true
                      properties:
                        deployment:
                          description: Deployment / model name as the provider advertises it.
                          type: string
                        provider:
                          description: >-
                            Provider tag: `azure-openai`, `anthropic`, `gemini`,
                            `bedrock`,

                            `ollama`, `github-models`.
                          type: string
                      required:
                        - deployment
                        - provider
                      type: object
                    credentialBindings:
                      description: Explicit governed credential sources and key grants; included in
                        task authority.
                      type: object
                      required:
                        - grant
                        - sources
                      properties:
                        grant:
                          type: object
                          required:
                            - name
                            - uid
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                            uid:
                              type: string
                              minLength: 1
                              maxLength: 128
                        sources:
                          type: array
                          minItems: 1
                          maxItems: 3
                          items:
                            type: object
                            required:
                              - keys
                              - scope
                              - source
                            properties:
                              scope:
                                type: string
                                enum:
                                  - workspace
                                  - team
                                  - target
                              source:
                                type: object
                                required:
                                  - name
                                  - uid
                                properties:
                                  name:
                                    type: string
                                    minLength: 1
                                    maxLength: 253
                                  uid:
                                    type: string
                                    minLength: 1
                                    maxLength: 128
                              keys:
                                type: array
                                maxItems: 128
                                items:
                                  type: string
                                  pattern: ^[A-Z_][A-Z0-9_]{0,127}$
                              owner:
                                type: object
                                required:
                                  - kind
                                  - name
                                  - namespace
                                  - uid
                                properties:
                                  kind:
                                    type: string
                                    enum:
                                      - KarsSandbox
                                      - KarsTask
                                      - KarsTeam
                                  namespace:
                                    type: string
                                    minLength: 1
                                    maxLength: 63
                                  name:
                                    type: string
                                    minLength: 1
                                    maxLength: 253
                                  uid:
                                    type: string
                                    minLength: 1
                                    maxLength: 128
                    githubBinding:
                      type: object
                      required:
                        - connection
                        - grant
                        - repositories
                      properties:
                        grant:
                          type: object
                          required:
                            - name
                            - uid
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                            uid:
                              type: string
                              minLength: 1
                              maxLength: 128
                        connection:
                          type: object
                          required:
                            - name
                            - uid
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                            uid:
                              type: string
                              minLength: 1
                              maxLength: 128
                        repositories:
                          type: array
                          minItems: 1
                          maxItems: 32
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            maxLength: 140
                            pattern: ^[a-z0-9._-]{1,39}/[a-z0-9._-]{1,100}$
                        write:
                          type: boolean
                          default: false
                    modelFallbacks:
                      description: Ordered alternative inference routes; absent preserves the default
                        route.
                      type: array
                      maxItems: 8
                      items:
                        type: object
                        required:
                          - deployment
                          - provider
                        properties:
                          deployment:
                            type: string
                            minLength: 1
                            maxLength: 253
                            pattern: \S
                          provider:
                            type: string
                            minLength: 1
                            maxLength: 253
                            pattern: \S
                    runtime:
                      description: >-
                        Harness/runtime (`OpenClaw`, `OpenAIAgents`,
                        `MicrosoftAgentFramework`,

                        `Hermes`; `MAF` is an alias). BYO requires configuration
                        not supported

                        by task blueprints and is rejected. Defaults to
                        `OpenClaw`.
                      nullable: true
                      type: string
                    toolPolicy:
                      description: >-
                        Tools the agent may call, expressed as the name of an
                        existing

                        same-namespace `ToolPolicy`. Drives
                        `KarsSandbox.spec.governance`

                        (`enabled: true` + `toolPolicyRef`). Composing the
                        existing `ToolPolicy`

                        CRD keeps the AGT profile + `appliesTo` scope
                        authoritative rather than

                        duplicating an allow-list here. Required whenever
                        `mcpServers` is set —

                        governed MCP access is meaningless without a tool policy
                        to bound it.
                      nullable: true
                      type: string
                  type: object
                displayName:
                  description: Optional short label surfaced in CLI / UI listings.
                  nullable: true
                  type: string
                envelope:
                  description: The trust envelope that governs this task and bounds any
                    delegation.
                  properties:
                    authorityCeiling:
                      description: >-
                        The maximum autonomy tier any *descendant* task may
                        hold. Must be in

                        `1..5` and `<= tier` — a task can never authorize a
                        child to act with

                        more authority than it holds itself.
                      format: int32
                      type: integer
                    budget:
                      description: Optional resource budget for the whole task subtree.
                      nullable: true
                      properties:
                        scope:
                          type: string
                          enum:
                            - GovernedInference
                            - null
                          nullable: true
                          description: >-
                            Explicit opt-in to governed-inference
                            tokens/configured maximum prices.

                            An absent scope retains the foundation's
                            planning-only interpretation.
                        tokens:
                          description: >-
                            Maximum total tokens the task subtree may consume.
                            `0`/absent means

                            "no token cap declared". Positive ceilings are
                            planning declarations:

                            launch is rejected until durable total/subtree
                            enforcement is available.
                          format: int64
                          nullable: true
                          type: integer
                        usdMicros:
                          description: >-
                            Maximum total spend in micro-USD (1e-6 USD) for the
                            task subtree.

                            `0`/absent means no cap declared. Positive ceilings
                            block launch in this

                            foundation. Integer micro-USD avoids floating-point
                            in an audit field.
                          format: int64
                          nullable: true
                          type: integer
                      type: object
                    delegationDepth:
                      default: 0
                      description: >-
                        Remaining number of delegation hops this task may still
                        spawn. A child

                        task is minted with `delegationDepth =
                        parent.delegationDepth - 1`;

                        at `0` no further delegation is permitted. Must be `>=
                        0`.
                      format: int32
                      type: integer
                    egressAllowlistRef:
                      description: >-
                        Reserved egress policy reference. This foundation cannot
                        resolve it

                        and rejects it before Ready. Use `blueprint.egress` for
                        Strict inline

                        destinations; standalone sandbox signed OCI allowlists
                        are unchanged.
                      nullable: true
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    tier:
                      description: Autonomy tier (1..5). See the module docs for the taxonomy.
                      format: int32
                      type: integer
                    toolPolicyRef:
                      description: >-
                        Optional reference to a same-namespace `ToolPolicy` CR
                        that bounds

                        which tools/MCP servers this task (and its descendants)
                        may call.
                      nullable: true
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - authorityCeiling
                    - tier
                  type: object
                execution:
                  description: >-
                    Execution gate (plan §20). A task is *governed-but-idle* by
                    default —

                    validated and digested, but not running. Execution begins
                    only on an

                    explicit launch, mirroring the "review the package, then
                    launch"

                    principle: the human reviews the trust envelope, then opts
                    in. When

                    `execution.launch` is `true` and the envelope is valid, the
                    controller

                    materializes a governed `KarsSandbox` (the running agent)
                    bounded by

                    the envelope.
                  nullable: true
                  properties:
                    launch:
                      default: false
                      description: >-
                        When `true`, the controller materializes a governed
                        `KarsSandbox` from

                        this task. Defaults to `false` — review before launch.
                      type: boolean
                    runtime:
                      description: >-
                        Runtime to launch the agent on. Defaults to `OpenClaw`.
                        Must match the

                        controller's `RuntimeKind` enum. Superseded by
                        `blueprint.runtime` when

                        both are set.
                      nullable: true
                      type: string
                  type: object
                objective:
                  description: >-
                    Human-readable statement of the task to be performed. This
                    is the

                    instruction a task-giver writes; the agent fleet works to
                    satisfy it.
                  type: string
                parentRef:
                  description: >-
                    Optional reference to a parent `KarsTask` in the **same
                    namespace**.


                    When set, this task is a *delegated child*: the controller
                    verifies

                    that this task's `envelope` is a strict subset of the
                    parent's

                    (capability-attenuating delegation — a child may narrow
                    authority but

                    never amplify it), and mints `status.lineage` from the
                    parent's

                    ancestry. A child whose envelope exceeds its parent on any
                    axis is

                    rejected as `Degraded` and never receives an envelope
                    digest. This is

                    the substrate enforcement of OWASP ASI-08 (cascading
                    authority) — done

                    by the controller, not asked of the model.
                  nullable: true
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
              required:
                - envelope
                - objective
              type: object
              x-kubernetes-validations:
                - message: spec.objective must be 1-4096 characters
                  reason: FieldValueInvalid
                  rule: size(self.objective) > 0 && size(self.objective) <= 4096
                - message: spec.envelope.tier must be in 1..5
                  reason: FieldValueInvalid
                  rule: self.envelope.tier >= 1 && self.envelope.tier <= 5
                - message: spec.envelope.authorityCeiling must be in 1..5
                  reason: FieldValueInvalid
                  rule: self.envelope.authorityCeiling >= 1 && self.envelope.authorityCeiling <= 5
                - message: spec.envelope.authorityCeiling must be <= spec.envelope.tier (a task
                    cannot grant a child more authority than it holds)
                  reason: FieldValueInvalid
                  rule: self.envelope.authorityCeiling <= self.envelope.tier
                - message: spec.envelope.delegationDepth must be in 0..16
                  reason: FieldValueInvalid
                  rule: self.envelope.delegationDepth >= 0 && self.envelope.delegationDepth <= 16
                - message: spec.envelope.budget.tokens, when set, must be >= 0
                  reason: FieldValueInvalid
                  rule: "!has(self.envelope.budget) || !has(self.envelope.budget.tokens) ||
                    self.envelope.budget.tokens >= 0"
                - message: spec.envelope.budget.usdMicros, when set, must be >= 0
                  reason: FieldValueInvalid
                  rule: "!has(self.envelope.budget) || !has(self.envelope.budget.usdMicros) ||
                    self.envelope.budget.usdMicros >= 0"
                - message: spec.displayName, when set, must be 1-253 characters
                  reason: FieldValueInvalid
                  rule: "!has(self.displayName) || (size(self.displayName) > 0 &&
                    size(self.displayName) <= 253)"
                - message: spec.blueprint.runtime must be OpenClaw, OpenAIAgents, MAF,
                    MicrosoftAgentFramework or Hermes; BYO task configuration is
                    unsupported
                  reason: FieldValueInvalid
                  rule: "!has(self.blueprint) || !has(self.blueprint.runtime) ||
                    self.blueprint.runtime in
                    ['OpenClaw','OpenAIAgents','MAF','MicrosoftAgentFramework',\
                    'Hermes']"
                - message: spec.execution.runtime must name a supported task runtime; BYO task
                    configuration is unsupported
                  reason: FieldValueInvalid
                  rule: "!has(self.execution) || !has(self.execution.runtime) ||
                    self.execution.runtime in
                    ['OpenClaw','OpenAIAgents','MAF','MicrosoftAgentFramework',\
                    'Hermes']"
                - message: spec.blueprint.toolPolicy must match spec.envelope.toolPolicyRef
                  reason: FieldValueInvalid
                  rule: "!has(self.envelope.toolPolicyRef) || !has(self.blueprint) ||
                    !has(self.blueprint.toolPolicy) || self.blueprint.toolPolicy
                    == self.envelope.toolPolicyRef.name"
                - message: envelope.egressAllowlistRef is unsupported by this foundation; use
                    blueprint.egress for enforced Strict destinations
                  reason: FieldValueInvalid
                  rule: "!has(self.envelope.egressAllowlistRef)"
                - message: "UnsupportedLaunchBudget: positive launch budgets require explicit
                    GovernedInference scope and a configured durable broker"
                  reason: FieldValueForbidden
                  rule: "!has(self.execution) || !self.execution.launch ||
                    !has(self.envelope.budget) ||
                    ((!has(self.envelope.budget.tokens) ||
                    self.envelope.budget.tokens == 0) &&
                    (!has(self.envelope.budget.usdMicros) ||
                    self.envelope.budget.usdMicros == 0)) ||
                    (has(self.envelope.budget.scope) &&
                    self.envelope.budget.scope == 'GovernedInference')"
                - message: spec.blueprint.isolation must be one of standard, enhanced,
                    confidential
                  reason: FieldValueInvalid
                  rule: "!has(self.blueprint) || !has(self.blueprint.isolation) ||
                    self.blueprint.isolation in
                    ['standard','enhanced','confidential']"
                - message: spec.blueprint.instructions, when set, must be <= 8192 characters
                  reason: FieldValueInvalid
                  rule: "!has(self.blueprint) || !has(self.blueprint.instructions) ||
                    size(self.blueprint.instructions) <= 8192"
                - message: spec.blueprint.mcpServers may list at most 8 connected services
                  reason: FieldValueInvalid
                  rule: "!has(self.blueprint) || !has(self.blueprint.mcpServers) ||
                    size(self.blueprint.mcpServers) <= 8"
                - message: spec.blueprint.mcpServers requires spec.blueprint.toolPolicy — governed
                    MCP access must be bounded by a tool policy
                  reason: FieldValueInvalid
                  rule: "!has(self.blueprint) || !has(self.blueprint.mcpServers) ||
                    size(self.blueprint.mcpServers) == 0 ||
                    has(self.blueprint.toolPolicy)"
                - message: spec.blueprint.egress may list at most 32 destinations
                  reason: FieldValueInvalid
                  rule: "!has(self.blueprint) || !has(self.blueprint.egress) ||
                    size(self.blueprint.egress) <= 32"
                - message: First finite GovernedInference opt-in requires a new Task/Team UID; an
                    existing unbounded runtime cannot be silently converted
                  reason: FieldValueForbidden
                  rule: "!has(self.envelope.budget) || !has(self.envelope.budget.scope) ||
                    self.envelope.budget.scope != 'GovernedInference' ||
                    ((!has(self.envelope.budget.tokens) ||
                    self.envelope.budget.tokens == 0) &&
                    (!has(self.envelope.budget.usdMicros) ||
                    self.envelope.budget.usdMicros == 0)) ||
                    (has(oldSelf.envelope.budget) &&
                    has(oldSelf.envelope.budget.scope) &&
                    oldSelf.envelope.budget.scope == 'GovernedInference' &&
                    ((has(oldSelf.envelope.budget.tokens) &&
                    oldSelf.envelope.budget.tokens > 0) ||
                    (has(oldSelf.envelope.budget.usdMicros) &&
                    oldSelf.envelope.budget.usdMicros > 0)))"
                - message: GovernedInference scope cannot be removed or changed for an existing
                    UID
                  reason: FieldValueForbidden
                  rule: "!has(oldSelf.envelope.budget) || !has(oldSelf.envelope.budget.scope) ||
                    oldSelf.envelope.budget.scope != 'GovernedInference' ||
                    (has(self.envelope.budget) &&
                    has(self.envelope.budget.scope) &&
                    self.envelope.budget.scope == 'GovernedInference')"
            status:
              description: "`KarsTask.status`."
              nullable: true
              properties:
                inferenceBudget:
                  type: object
                  nullable: true
                  description: >-
                    Controller-owned immutable account/UID ancestry binding. Not
                    a task-name

                    metering label and never supplied by an agent header.
                  properties:
                    account:
                      type: object
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        uid:
                          type: string
                      required:
                        - name
                        - namespace
                        - uid
                    authorizationDigest:
                      type: string
                    parentTaskUid:
                      type: string
                      nullable: true
                    root:
                      type: object
                      properties:
                        clusterUid:
                          type: string
                        kind:
                          type: string
                          enum:
                            - KarsTask
                            - KarsTeam
                        resource:
                          type: object
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                            uid:
                              type: string
                          required:
                            - name
                            - namespace
                            - uid
                        workspaceUid:
                          type: string
                      required:
                        - clusterUid
                        - kind
                        - resource
                        - workspaceUid
                    rootTaskUid:
                      type: string
                    scope:
                      type: string
                      enum:
                        - GovernedInference
                    taskUid:
                      type: string
                  required:
                    - account
                    - authorizationDigest
                    - root
                    - rootTaskUid
                    - scope
                    - taskUid
                conditions:
                  description: >-
                    Standard K8s conditions. `Ready` is set `True` once the
                    envelope has

                    been validated and its digest stamped.
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another. This should be when the
                          underlying condition changed.  If that is not known,
                          then using the time when the API field changed is
                          acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition. This may be an empty string.
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon. For instance, if
                          .metadata.generation is currently 12, but the
                          .status.conditions[x].observedGeneration is 9, the
                          condition is out of date with respect to the current
                          state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition. Producers of specific
                          condition types may define expected values and
                          meanings for this field, and whether the values are
                          considered a guaranteed API. The value should be a
                          CamelCase string. This field may not be empty.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  nullable: true
                  type: array
                envelopeDigest:
                  description: >-
                    `sha256:` authorization digest of the validated envelope and
                    effective

                    governed blueprint, including resolved model defaults and
                    capability refs.
                  nullable: true
                  type: string
                executionDetail:
                  description: >-
                    Human-readable detail about the execution state — surfaced
                    verbatim in

                    the product so a user understands *why* (e.g. the
                    kind/Foundry caveat).
                  nullable: true
                  type: string
                executionPhase:
                  description: >-
                    Execution phase (the §20 launch lifecycle), distinct from
                    the

                    governance `phase`:

                    - `Idle` — governed but not launched (the default).

                    - `Launching` — a `KarsSandbox` has been materialized;
                    awaiting it.

                    - `Running` — the sandbox reports Running.

                    - `Degraded` — the sandbox degraded (e.g. no inference
                    endpoint).
                  nullable: true
                  type: string
                lineage:
                  description: >-
                    Ancestry of this task, oldest-first: the chain of parent
                    task names

                    from the root delegation down to (but excluding) this task.
                    Empty for

                    a root task. Populated by the delegation minting path (next
                    slice).
                  items:
                    type: string
                  type: array
                observedGeneration:
                  description: >-
                    The `.metadata.generation` most recently reconciled, so
                    clients can

                    tell whether `status` reflects the current `spec`.
                  format: int64
                  nullable: true
                  type: integer
                phase:
                  description: "One of: `Pending`, `Ready`, `Degraded`."
                  nullable: true
                  type: string
                sandboxRef:
                  description: Name of the `KarsSandbox` materialized for this task, when
                    launched.
                  nullable: true
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
              type: object
          required:
            - spec
          title: KarsTask
          type: object
      served: true
      storage: true
      subresources:
        status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karsteams.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: KarsTeam
    plural: karsteams
    shortNames:
      - cteam
    singular: karsteam
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.envelope.tier
          name: Tier
          type: integer
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.memberCount
          name: Members
          type: integer
        - jsonPath: .status.generatedTaskCount
          name: Generated
          type: integer
        - jsonPath: .status.lastRunAt
          name: LastRun
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for KarsTeamSpec via `CustomResource`
          properties:
            spec:
              description: "`KarsTeam.spec` — a standing org with a persistent mandate + trust
                envelope."
              properties:
                blueprint:
                  description: >-
                    The default run blueprint for the principal + generated
                    task-force tasks

                    (harness/model/instructions/tools/egress/isolation). Member
                    roles may

                    override their own blueprint via `TeamRole.blueprint`.
                  nullable: true
                  properties:
                    egress:
                      description: >-
                        Network destinations the mission may reach. Drives

                        `KarsSandbox.spec.networkPolicy.allowedEndpoints`. Task
                        sandboxes always

                        use Strict mode, including an empty list (no additional
                        destinations).
                      items:
                        description: A network destination the mission may reach.
                        properties:
                          host:
                            description: Hostname, e.g. `api.github.com`.
                            type: string
                          port:
                            description: Optional TCP port (e.g. `443`); any port when omitted.
                            format: uint16
                            maximum: 65535
                            minimum: 0
                            nullable: true
                            type: integer
                        required:
                          - host
                        type: object
                      type: array
                    instructions:
                      description: >-
                        System prompt / standing instructions for the agent, in
                        addition to the

                        objective. Drives `KarsSandbox.spec.agent.instructions`.
                      nullable: true
                      type: string
                    isolation:
                      description: >-
                        Sandbox isolation level (`standard`, `enhanced`,
                        `confidential`). Drives

                        `KarsSandbox.spec.sandbox.isolation`. Defaults to
                        `standard`.
                      nullable: true
                      type: string
                    mcpServers:
                      description: >-
                        Connected services (MCP server names, same namespace)
                        the mission may

                        use. Drives `KarsSandbox.spec.governance.mcpServerRefs`.
                        Requires

                        `toolPolicy` to be set (governed MCP access is bounded
                        by the tool

                        policy).
                      items:
                        type: string
                      type: array
                    memory:
                      description: >-
                        Shared team memory — the name of a same-namespace
                        `KarsMemory` the agent

                        reads/writes. Drives `KarsSandbox.spec.memoryRef`. This
                        is how a

                        persistent team shares knowledge across members and over
                        time; a short

                        one-off task usually leaves it unset.
                      nullable: true
                      type: string
                    model:
                      description: >-
                        The model the agent reasons with. Drives

                        `InferencePolicy.spec.modelPreference.primary`. Defaults
                        from controller

                        env when unset.
                      nullable: true
                      properties:
                        deployment:
                          description: Deployment / model name as the provider advertises it.
                          type: string
                        provider:
                          description: >-
                            Provider tag: `azure-openai`, `anthropic`, `gemini`,
                            `bedrock`,

                            `ollama`, `github-models`.
                          type: string
                      required:
                        - deployment
                        - provider
                      type: object
                    credentialBindings:
                      description: Explicit governed credential sources and key grants; included in
                        task authority.
                      type: object
                      required:
                        - grant
                        - sources
                      properties:
                        grant:
                          type: object
                          required:
                            - name
                            - uid
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                            uid:
                              type: string
                              minLength: 1
                              maxLength: 128
                        sources:
                          type: array
                          minItems: 1
                          maxItems: 3
                          items:
                            type: object
                            required:
                              - keys
                              - scope
                              - source
                            properties:
                              scope:
                                type: string
                                enum:
                                  - workspace
                                  - team
                                  - target
                              source:
                                type: object
                                required:
                                  - name
                                  - uid
                                properties:
                                  name:
                                    type: string
                                    minLength: 1
                                    maxLength: 253
                                  uid:
                                    type: string
                                    minLength: 1
                                    maxLength: 128
                              keys:
                                type: array
                                maxItems: 128
                                items:
                                  type: string
                                  pattern: ^[A-Z_][A-Z0-9_]{0,127}$
                              owner:
                                type: object
                                required:
                                  - kind
                                  - name
                                  - namespace
                                  - uid
                                properties:
                                  kind:
                                    type: string
                                    enum:
                                      - KarsSandbox
                                      - KarsTask
                                      - KarsTeam
                                  namespace:
                                    type: string
                                    minLength: 1
                                    maxLength: 63
                                  name:
                                    type: string
                                    minLength: 1
                                    maxLength: 253
                                  uid:
                                    type: string
                                    minLength: 1
                                    maxLength: 128
                    githubBinding:
                      type: object
                      required:
                        - connection
                        - grant
                        - repositories
                      properties:
                        grant:
                          type: object
                          required:
                            - name
                            - uid
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                            uid:
                              type: string
                              minLength: 1
                              maxLength: 128
                        connection:
                          type: object
                          required:
                            - name
                            - uid
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                            uid:
                              type: string
                              minLength: 1
                              maxLength: 128
                        repositories:
                          type: array
                          minItems: 1
                          maxItems: 32
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            maxLength: 140
                            pattern: ^[a-z0-9._-]{1,39}/[a-z0-9._-]{1,100}$
                        write:
                          type: boolean
                          default: false
                    modelFallbacks:
                      description: Ordered alternative inference routes; absent preserves the default
                        route.
                      type: array
                      maxItems: 8
                      items:
                        type: object
                        required:
                          - deployment
                          - provider
                        properties:
                          deployment:
                            type: string
                            minLength: 1
                            maxLength: 253
                            pattern: \S
                          provider:
                            type: string
                            minLength: 1
                            maxLength: 253
                            pattern: \S
                    runtime:
                      description: >-
                        Harness/runtime (`OpenClaw`, `OpenAIAgents`,
                        `MicrosoftAgentFramework`,

                        `Hermes`; `MAF` is an alias). BYO requires configuration
                        not supported

                        by task blueprints and is rejected. Defaults to
                        `OpenClaw`.
                      nullable: true
                      type: string
                    toolPolicy:
                      description: >-
                        Tools the agent may call, expressed as the name of an
                        existing

                        same-namespace `ToolPolicy`. Drives
                        `KarsSandbox.spec.governance`

                        (`enabled: true` + `toolPolicyRef`). Composing the
                        existing `ToolPolicy`

                        CRD keeps the AGT profile + `appliesTo` scope
                        authoritative rather than

                        duplicating an allow-list here. Required whenever
                        `mcpServers` is set —

                        governed MCP access is meaningless without a tool policy
                        to bound it.
                      nullable: true
                      type: string
                  type: object
                cadence:
                  description: >-
                    The standing-operation cadence — how often the charter loop
                    mints a

                    task-force task (autonomous monitoring). Absent ⇒ the team
                    is a passive

                    org (members exist, but no autonomous tick).
                  nullable: true
                  properties:
                    digestEveryMinutes:
                      description: >-
                        How often (in **minutes**) the team publishes a
                        **digest** to the

                        steering inbox — a periodic standing report (runs
                        generated/delivered,

                        tokens spent, knowledge accumulated, health). Absent ⇒
                        no digest is

                        published. Named per the design's *daily* digest (§20);
                        kept as a minute

                        interval so it is demoable on a plain cluster without
                        waiting a day.
                      format: uint32
                      minimum: 0
                      nullable: true
                      type: integer
                    everyMinutes:
                      description: >-
                        Tick interval in **minutes**. On each tick the charter
                        loop mints one

                        task-force `KarsTask`. Kept as a simple interval so the
                        standing loop is

                        honest and reproducible on a plain (kind) cluster. Must
                        be `>= 1`.

                        Positive envelope budgets block execution with
                        `UnsupportedLaunchBudget`;

                        the foundation does not substitute per-sandbox daily
                        limits for totals.
                      format: uint32
                      minimum: 0
                      nullable: true
                      type: integer
                  type: object
                charter:
                  description: >-
                    The **charter** — the team's standing mandate in plain
                    language. This is

                    the durable instruction that *generates* the team's work:
                    each cadence

                    tick mints a task-force `KarsTask` whose objective is
                    derived from this

                    charter. E.g. *"Keep the kars repo healthy: triage new
                    issues, run tests

                    on open PRs, and draft fixes for failing checks."*
                  type: string
                displayName:
                  description: Optional short label surfaced in CLI / UI listings.
                  nullable: true
                  type: string
                envelope:
                  description: >-
                    The team's full trust envelope — the ceiling of authority
                    any member or

                    generated task may hold. Reuses the `KarsTask` envelope so
                    attenuation,

                    digesting, and the org-as-topology lattice apply unchanged.
                  properties:
                    authorityCeiling:
                      description: >-
                        The maximum autonomy tier any *descendant* task may
                        hold. Must be in

                        `1..5` and `<= tier` — a task can never authorize a
                        child to act with

                        more authority than it holds itself.
                      format: int32
                      type: integer
                    budget:
                      description: Optional resource budget for the whole task subtree.
                      nullable: true
                      properties:
                        scope:
                          type: string
                          enum:
                            - GovernedInference
                            - null
                          nullable: true
                          description: >-
                            Explicit opt-in to governed-inference
                            tokens/configured maximum prices.

                            An absent scope retains the foundation's
                            planning-only interpretation.
                        tokens:
                          description: >-
                            Maximum total tokens the task subtree may consume.
                            `0`/absent means

                            "no token cap declared". Positive ceilings are
                            planning declarations:

                            launch is rejected until durable total/subtree
                            enforcement is available.
                          format: int64
                          nullable: true
                          type: integer
                        usdMicros:
                          description: >-
                            Maximum total spend in micro-USD (1e-6 USD) for the
                            task subtree.

                            `0`/absent means no cap declared. Positive ceilings
                            block launch in this

                            foundation. Integer micro-USD avoids floating-point
                            in an audit field.
                          format: int64
                          nullable: true
                          type: integer
                      type: object
                    delegationDepth:
                      default: 0
                      description: >-
                        Remaining number of delegation hops this task may still
                        spawn. A child

                        task is minted with `delegationDepth =
                        parent.delegationDepth - 1`;

                        at `0` no further delegation is permitted. Must be `>=
                        0`.
                      format: int32
                      type: integer
                    egressAllowlistRef:
                      description: >-
                        Reserved egress policy reference. This foundation cannot
                        resolve it

                        and rejects it before Ready. Use `blueprint.egress` for
                        Strict inline

                        destinations; standalone sandbox signed OCI allowlists
                        are unchanged.
                      nullable: true
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    tier:
                      description: Autonomy tier (1..5). See the module docs for the taxonomy.
                      format: int32
                      type: integer
                    toolPolicyRef:
                      description: >-
                        Optional reference to a same-namespace `ToolPolicy` CR
                        that bounds

                        which tools/MCP servers this task (and its descendants)
                        may call.
                      nullable: true
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - authorityCeiling
                    - tier
                  type: object
                knowledgeCommons:
                  description: >-
                    Name of the team's **knowledge commons** (shared,
                    provenance-tracked

                    memory, §14). Defaults to the team name when unset.
                  nullable: true
                  type: string
                paused:
                  default: false
                  description: >-
                    When `true` the team **hibernates**: members stay
                    governed-but-idle and

                    the charter loop does not tick (idle-scaled,
                    budget-preserving, §11).
                  type: boolean
                profileRef:
                  description: >-
                    Optional **profile** this team is instantiated from
                    (`KarsProfile` name,

                    same namespace, §17). When set, the team inherits the
                    profile's charter

                    template (if `charter` is empty) and roster (if `roster` is
                    empty) and is

                    recorded as profile-derived on the receipt. The platform
                    stays

                    domain-blind; the domain lives in the referenced profile.
                  nullable: true
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                reportingTo:
                  description: >-
                    The human owner this team reports to (the apex of the org
                    chart, §12).

                    Surfaced verbatim; digests + escalations route here.
                  nullable: true
                  type: string
                requestedTier:
                  description: >-
                    A **requested promotion** — a target autonomy tier the
                    team's principal

                    wants to operate at (§12). When greater than
                    `envelope.tier`, the

                    controller opens a human `KarsApproval` (a `tierRaise`);
                    only on approval

                    does the controller widen the team envelope to this tier.
                    Promotion is

                    therefore always human-approved and ledgered (the approval
                    is bound into

                    the principal's receipt). Widening is controller-only — a
                    non-controller

                    principal cannot raise the envelope (enforced by the
                    envelope-write VAP).
                  format: int32
                  nullable: true
                  type: integer
                roster:
                  description: >-
                    The roster of member roles. Each role holds a strict
                    *subset* of the

                    team envelope (capability-attenuating delegation, §12).
                    Materialized as

                    member `KarsTask`s parented to the principal.
                  items:
                    description: >-
                      A member role in the team roster — a named seat in the org
                      chart holding an

                      attenuated subset of the team's authority.
                    properties:
                      blueprint:
                        description: >-
                          Optional per-role run blueprint override
                          (model/tools/egress). Falls back

                          to the team blueprint when unset.
                        nullable: true
                        properties:
                          egress:
                            description: >-
                              Network destinations the mission may reach. Drives

                              `KarsSandbox.spec.networkPolicy.allowedEndpoints`.
                              Task sandboxes always

                              use Strict mode, including an empty list (no
                              additional destinations).
                            items:
                              description: A network destination the mission may reach.
                              properties:
                                host:
                                  description: Hostname, e.g. `api.github.com`.
                                  type: string
                                port:
                                  description: Optional TCP port (e.g. `443`); any port when omitted.
                                  format: uint16
                                  maximum: 65535
                                  minimum: 0
                                  nullable: true
                                  type: integer
                              required:
                                - host
                              type: object
                            type: array
                          instructions:
                            description: >-
                              System prompt / standing instructions for the
                              agent, in addition to the

                              objective. Drives
                              `KarsSandbox.spec.agent.instructions`.
                            nullable: true
                            type: string
                          isolation:
                            description: >-
                              Sandbox isolation level (`standard`, `enhanced`,
                              `confidential`). Drives

                              `KarsSandbox.spec.sandbox.isolation`. Defaults to
                              `standard`.
                            nullable: true
                            type: string
                          mcpServers:
                            description: >-
                              Connected services (MCP server names, same
                              namespace) the mission may

                              use. Drives
                              `KarsSandbox.spec.governance.mcpServerRefs`.
                              Requires

                              `toolPolicy` to be set (governed MCP access is
                              bounded by the tool

                              policy).
                            items:
                              type: string
                            type: array
                          memory:
                            description: >-
                              Shared team memory — the name of a same-namespace
                              `KarsMemory` the agent

                              reads/writes. Drives `KarsSandbox.spec.memoryRef`.
                              This is how a

                              persistent team shares knowledge across members
                              and over time; a short

                              one-off task usually leaves it unset.
                            nullable: true
                            type: string
                          model:
                            description: >-
                              The model the agent reasons with. Drives

                              `InferencePolicy.spec.modelPreference.primary`.
                              Defaults from controller

                              env when unset.
                            nullable: true
                            properties:
                              deployment:
                                description: Deployment / model name as the provider advertises it.
                                type: string
                              provider:
                                description: >-
                                  Provider tag: `azure-openai`, `anthropic`,
                                  `gemini`, `bedrock`,

                                  `ollama`, `github-models`.
                                type: string
                            required:
                              - deployment
                              - provider
                            type: object
                          credentialBindings:
                            description: Explicit governed credential sources and key grants; included in
                              task authority.
                            type: object
                            required:
                              - grant
                              - sources
                            properties:
                              grant:
                                type: object
                                required:
                                  - name
                                  - uid
                                properties:
                                  name:
                                    type: string
                                    minLength: 1
                                    maxLength: 253
                                  uid:
                                    type: string
                                    minLength: 1
                                    maxLength: 128
                              sources:
                                type: array
                                minItems: 1
                                maxItems: 3
                                items:
                                  type: object
                                  required:
                                    - keys
                                    - scope
                                    - source
                                  properties:
                                    scope:
                                      type: string
                                      enum:
                                        - workspace
                                        - team
                                        - target
                                    source:
                                      type: object
                                      required:
                                        - name
                                        - uid
                                      properties:
                                        name:
                                          type: string
                                          minLength: 1
                                          maxLength: 253
                                        uid:
                                          type: string
                                          minLength: 1
                                          maxLength: 128
                                    keys:
                                      type: array
                                      maxItems: 128
                                      items:
                                        type: string
                                        pattern: ^[A-Z_][A-Z0-9_]{0,127}$
                                    owner:
                                      type: object
                                      required:
                                        - kind
                                        - name
                                        - namespace
                                        - uid
                                      properties:
                                        kind:
                                          type: string
                                          enum:
                                            - KarsSandbox
                                            - KarsTask
                                            - KarsTeam
                                        namespace:
                                          type: string
                                          minLength: 1
                                          maxLength: 63
                                        name:
                                          type: string
                                          minLength: 1
                                          maxLength: 253
                                        uid:
                                          type: string
                                          minLength: 1
                                          maxLength: 128
                          githubBinding:
                            type: object
                            required:
                              - connection
                              - grant
                              - repositories
                            properties:
                              grant:
                                type: object
                                required:
                                  - name
                                  - uid
                                properties:
                                  name:
                                    type: string
                                    minLength: 1
                                    maxLength: 253
                                  uid:
                                    type: string
                                    minLength: 1
                                    maxLength: 128
                              connection:
                                type: object
                                required:
                                  - name
                                  - uid
                                properties:
                                  name:
                                    type: string
                                    minLength: 1
                                    maxLength: 253
                                  uid:
                                    type: string
                                    minLength: 1
                                    maxLength: 128
                              repositories:
                                type: array
                                minItems: 1
                                maxItems: 32
                                x-kubernetes-list-type: set
                                items:
                                  type: string
                                  maxLength: 140
                                  pattern: ^[a-z0-9._-]{1,39}/[a-z0-9._-]{1,100}$
                              write:
                                type: boolean
                                default: false
                          modelFallbacks:
                            description: Ordered alternative inference routes; absent preserves the default
                              route.
                            type: array
                            maxItems: 8
                            items:
                              type: object
                              required:
                                - deployment
                                - provider
                              properties:
                                deployment:
                                  type: string
                                  minLength: 1
                                  maxLength: 253
                                  pattern: \S
                                provider:
                                  type: string
                                  minLength: 1
                                  maxLength: 253
                                  pattern: \S
                          runtime:
                            description: >-
                              Harness/runtime (`OpenClaw`, `OpenAIAgents`,
                              `MicrosoftAgentFramework`,

                              `Hermes`; `MAF` is an alias). BYO requires
                              configuration not supported

                              by task blueprints and is rejected. Defaults to
                              `OpenClaw`.
                            nullable: true
                            type: string
                          toolPolicy:
                            description: >-
                              Tools the agent may call, expressed as the name of
                              an existing

                              same-namespace `ToolPolicy`. Drives
                              `KarsSandbox.spec.governance`

                              (`enabled: true` + `toolPolicyRef`). Composing the
                              existing `ToolPolicy`

                              CRD keeps the AGT profile + `appliesTo` scope
                              authoritative rather than

                              duplicating an allow-list here. Required whenever
                              `mcpServers` is set —

                              governed MCP access is meaningless without a tool
                              policy to bound it.
                            nullable: true
                            type: string
                        type: object
                      envelope:
                        description: >-
                          The role's attenuated trust envelope — a strict subset
                          of the team

                          envelope. When unset the member inherits a safe
                          attenuation of the team

                          envelope (one tier below the team, no further
                          delegation).
                        nullable: true
                        properties:
                          authorityCeiling:
                            description: >-
                              The maximum autonomy tier any *descendant* task
                              may hold. Must be in

                              `1..5` and `<= tier` — a task can never authorize
                              a child to act with

                              more authority than it holds itself.
                            format: int32
                            type: integer
                          budget:
                            description: Optional resource budget for the whole task subtree.
                            nullable: true
                            properties:
                              scope:
                                type: string
                                enum:
                                  - GovernedInference
                                  - null
                                nullable: true
                                description: >-
                                  Explicit opt-in to governed-inference
                                  tokens/configured maximum prices.

                                  An absent scope retains the foundation's
                                  planning-only interpretation.
                              tokens:
                                description: >-
                                  Maximum total tokens the task subtree may
                                  consume. `0`/absent means

                                  "no token cap declared". Positive ceilings are
                                  planning declarations:

                                  launch is rejected until durable total/subtree
                                  enforcement is available.
                                format: int64
                                nullable: true
                                type: integer
                              usdMicros:
                                description: >-
                                  Maximum total spend in micro-USD (1e-6 USD)
                                  for the task subtree.

                                  `0`/absent means no cap declared. Positive
                                  ceilings block launch in this

                                  foundation. Integer micro-USD avoids
                                  floating-point in an audit field.
                                format: int64
                                nullable: true
                                type: integer
                            type: object
                          delegationDepth:
                            default: 0
                            description: >-
                              Remaining number of delegation hops this task may
                              still spawn. A child

                              task is minted with `delegationDepth =
                              parent.delegationDepth - 1`;

                              at `0` no further delegation is permitted. Must be
                              `>= 0`.
                            format: int32
                            type: integer
                          egressAllowlistRef:
                            description: >-
                              Reserved egress policy reference. This foundation
                              cannot resolve it

                              and rejects it before Ready. Use
                              `blueprint.egress` for Strict inline

                              destinations; standalone sandbox signed OCI
                              allowlists are unchanged.
                            nullable: true
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          tier:
                            description: Autonomy tier (1..5). See the module docs for the taxonomy.
                            format: int32
                            type: integer
                          toolPolicyRef:
                            description: >-
                              Optional reference to a same-namespace
                              `ToolPolicy` CR that bounds

                              which tools/MCP servers this task (and its
                              descendants) may call.
                            nullable: true
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                        required:
                          - authorityCeiling
                          - tier
                        type: object
                      name:
                        description: >-
                          The role name (e.g. `bugfix-engineer`,
                          `compliance-screener`). Becomes

                          the materialized member `KarsTask` name suffix.
                        type: string
                      skills:
                        description: >-
                          **Skills** (`KarsSkill` names, same namespace, §13)
                          this role acquires.

                          The team reconciler merges each Ready skill's bounding
                          tool policy, MCP

                          servers, and recipe into the materialized member
                          blueprint — so the grant

                          is a real authority fact (the member runs with the
                          skill's bounded tools),

                          not a label.
                        items:
                          type: string
                        type: array
                      systemPrompt:
                        description: >-
                          The role's standing instructions (its system prompt),
                          in addition to the

                          charter. Drives the member sandbox's `instructions`.
                        nullable: true
                        type: string
                    required:
                      - name
                    type: object
                  type: array
              required:
                - charter
                - envelope
              type: object
              x-kubernetes-validations:
                - message: spec.charter must be 1-8192 characters (or empty when spec.profileRef
                    is set, to inherit the profile's charter)
                  reason: FieldValueInvalid
                  rule: (has(self.profileRef) && size(self.charter) == 0) || (size(self.charter) >
                    0 && size(self.charter) <= 8192)
                - message: spec.envelope.tier must be in 1..5
                  reason: FieldValueInvalid
                  rule: self.envelope.tier >= 1 && self.envelope.tier <= 5
                - message: spec.envelope.authorityCeiling must be in 1..5
                  reason: FieldValueInvalid
                  rule: self.envelope.authorityCeiling >= 1 && self.envelope.authorityCeiling <= 5
                - message: spec.envelope.authorityCeiling must be <= spec.envelope.tier (a team
                    cannot grant a member more authority than it holds)
                  reason: FieldValueInvalid
                  rule: self.envelope.authorityCeiling <= self.envelope.tier
                - message: spec.envelope.delegationDepth must be in 0..16
                  reason: FieldValueInvalid
                  rule: self.envelope.delegationDepth >= 0 && self.envelope.delegationDepth <= 16
                - message: spec.cadence.everyMinutes, when set, must be >= 1
                  reason: FieldValueInvalid
                  rule: "!has(self.cadence) || !has(self.cadence.everyMinutes) ||
                    self.cadence.everyMinutes >= 1"
                - message: First finite GovernedInference opt-in requires a new Task/Team UID; an
                    existing unbounded runtime cannot be silently converted
                  reason: FieldValueForbidden
                  rule: "!has(self.envelope.budget) || !has(self.envelope.budget.scope) ||
                    self.envelope.budget.scope != 'GovernedInference' ||
                    ((!has(self.envelope.budget.tokens) ||
                    self.envelope.budget.tokens == 0) &&
                    (!has(self.envelope.budget.usdMicros) ||
                    self.envelope.budget.usdMicros == 0)) ||
                    (has(oldSelf.envelope.budget) &&
                    has(oldSelf.envelope.budget.scope) &&
                    oldSelf.envelope.budget.scope == 'GovernedInference' &&
                    ((has(oldSelf.envelope.budget.tokens) &&
                    oldSelf.envelope.budget.tokens > 0) ||
                    (has(oldSelf.envelope.budget.usdMicros) &&
                    oldSelf.envelope.budget.usdMicros > 0)))"
                - message: GovernedInference scope cannot be removed or changed for an existing
                    UID
                  reason: FieldValueForbidden
                  rule: "!has(oldSelf.envelope.budget) || !has(oldSelf.envelope.budget.scope) ||
                    oldSelf.envelope.budget.scope != 'GovernedInference' ||
                    (has(self.envelope.budget) &&
                    has(self.envelope.budget.scope) &&
                    self.envelope.budget.scope == 'GovernedInference')"
            status:
              description: "`KarsTeam.status` — the controller is the sole writer."
              nullable: true
              properties:
                inferenceBudgetAccount:
                  type: object
                  nullable: true
                  description: Lifetime Team-UID inference account; cadence runs never reset its
                    balance.
                  required:
                    - name
                    - namespace
                    - uid
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                    uid:
                      type: string
                commonsEntryCount:
                  description: Number of entries in the team's knowledge commons (shared memory
                    size).
                  format: int64
                  nullable: true
                  type: integer
                conditions:
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another. This should be when the
                          underlying condition changed.  If that is not known,
                          then using the time when the API field changed is
                          acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition. This may be an empty string.
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon. For instance, if
                          .metadata.generation is currently 12, but the
                          .status.conditions[x].observedGeneration is 9, the
                          condition is out of date with respect to the current
                          state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition. Producers of specific
                          condition types may define expected values and
                          meanings for this field, and whether the values are
                          considered a guaranteed API. The value should be a
                          CamelCase string. This field may not be empty.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  nullable: true
                  type: array
                detail:
                  description: Human-readable detail surfaced verbatim in the product.
                  nullable: true
                  type: string
                envelopeDigest:
                  description: "`sha256:` digest of the validated team envelope (reuses the task
                    digest)."
                  nullable: true
                  type: string
                generatedTaskCount:
                  default: 0
                  description: How many task-force tasks the charter loop has generated so far.
                  format: int64
                  type: integer
                health:
                  description: >-
                    Operational health of the standing operation, computed from
                    run outcomes:

                    `Healthy` (recent substantive runs), `Watching` (active,
                    awaiting first

                    result), `Degraded` (recent runs produced no deliverable),
                    or `Stalled`

                    (cadence set but overdue). The autonomous-monitoring signal
                    — proof the

                    team is actually doing its job, not just scheduled.
                  nullable: true
                  type: string
                lastDigestAt:
                  description: When the team last published a digest to the steering inbox
                    (RFC3339).
                  nullable: true
                  type: string
                lastGeneratedTask:
                  description: The most recent task-force task the charter loop minted.
                  nullable: true
                  type: string
                lastRunAt:
                  description: When the charter loop last ticked (RFC3339).
                  nullable: true
                  type: string
                lastSuccessAt:
                  description: When the team last produced a substantive deliverable (RFC3339).
                  nullable: true
                  type: string
                memberCount:
                  description: Number of members materialized (printcolumn convenience).
                  format: int64
                  nullable: true
                  type: integer
                memberRefs:
                  description: The materialized **member** `KarsTask`s (the roster as cluster
                    state).
                  items:
                    description: >-
                      Minimal `LocalObjectReference`-shaped struct with `name`
                      only — the

                      emitted Secret/ConfigMap always lives in the same
                      namespace as the

                      CR, so namespace plumbing would be redundant. Mirrors the

                      `corev1.LocalObjectReference` Kubernetes API shape.
                    properties:
                      name:
                        type: string
                    required:
                      - name
                    type: object
                  type: array
                nextRunAt:
                  description: When the charter loop is next due to tick (RFC3339).
                  nullable: true
                  type: string
                observedGeneration:
                  format: int64
                  nullable: true
                  type: integer
                phase:
                  description: >-
                    Lifecycle phase: `Forming` (validating + materializing),
                    `Active`

                    (running, cadence ticking), `Hibernating` (paused/idle),
                    `Degraded`

                    (envelope invalid — no authority to operate), `Retired`.
                  nullable: true
                  type: string
                principalRef:
                  description: The materialized **principal** `KarsTask` (the org apex + authority
                    root).
                  nullable: true
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                runsSucceeded:
                  description: Count of standing-operation runs that produced a substantive
                    deliverable.
                  format: int64
                  nullable: true
                  type: integer
                tokensSpentTotal:
                  description: Total tokens spent across all of the team's standing-operation
                    runs.
                  format: int64
                  nullable: true
                  type: integer
              type: object
          required:
            - spec
          title: KarsTeam
          type: object
      served: true
      storage: true
      subresources:
        status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: McpServer
    plural: mcpservers
    shortNames:
      - mcp
    singular: mcpserver
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.url
          name: URL
          type: string
        - jsonPath: .spec.productionMode
          name: Production
          type: boolean
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for McpServerSpec via `CustomResource`
          properties:
            spec:
              description: >-
                `McpServer.spec` — declares an MCP 2026 server reachable from
                sandboxes

                in the same namespace (or, if `crossNamespaceAllowed: true` on
                the

                server side, cluster-wide).


                ## Two authoring paths


                The content fields (`url`, `oauth`, `productionMode`, `scopes`,

                `allowedTools`, `displayName`) are mutually exclusive with

                [`bundle_ref`](McpServerSpec::bundle_ref): either inline the
                values

                (no supply-chain attestation) or reference a signed OCI artifact

                (cosign-verified against the cluster `SignerPolicy`). The

                `allowedSandboxes` selector is owned exclusively by the CR — one

                signed server bundle can be referenced by multiple `McpServer`
                CRs

                with different sandbox selectors.
              properties:
                allowedSandboxes:
                  description: >-
                    Selector restricting which sandboxes can reach this server.

                    Empty = same-namespace only.


                    **CR-owned field**: deliberately NOT part of any signed
                    bundle.

                    The selector is a deployment-time concern; one signed server

                    bundle can be referenced by multiple `McpServer` CRs in

                    different environments with different selectors.
                  nullable: true
                  properties:
                    matchLabels:
                      additionalProperties:
                        type: string
                      default: {}
                      description: >-
                        Match labels on `KarsSandbox` resources. Standard label
                        selector

                        semantics; AND across keys.
                      type: object
                  type: object
                allowedTools:
                  description: >-
                    Allow-list of tool names. Empty list means "no tools
                    allowed";

                    to allow all tools, use `["*"]` and lean on `ToolPolicy` for

                    per-tool governance. Default empty — fail-closed.
                  items:
                    type: string
                  nullable: true
                  type: array
                bearerFromEnv:
                  description: >-
                    Slice 4d.4.1 — outbound static-bearer authentication.


                    Name of an environment variable visible to the
                    inference-router

                    container whose value should be attached as

                    `Authorization: Bearer <value>` on every outbound
                    `tools/list`

                    and `tools/call` request to this server.


                    Designed to reuse pre-existing sandbox env vars without

                    introducing new mounts. The primary intended consumer is the

                    GitHub Copilot dev-credential path (`COPILOT_GITHUB_TOKEN`),

                    which already contains a GitHub OAuth token that
                    authenticates

                    against `https://api.githubcopilot.com/mcp`.


                    Behaviour when the named env var is unset or empty: the
                    router

                    records a `skipped` entry and continues — non-fatal. Other

                    servers in the registry remain advertised. This keeps
                    Foundry

                    deployments (which do not set `COPILOT_GITHUB_TOKEN`) from

                    breaking when a github MCP CR is present.


                    OAuth on-behalf-of (where the *agent's* incoming bearer is

                    re-used) is deferred to Slice 4d.5 and tracked as a separate

                    CR field there.
                  nullable: true
                  type: string
                bundleRef:
                  description: >-
                    Reference to a signed OCI artifact carrying the policy
                    content

                    (`url`, `oauth`, `productionMode`, `scopes`, `allowedTools`,

                    `displayName`). Mutually exclusive with inline content
                    fields —

                    enforced by admission CEL and re-checked by the reconciler.


                    Slice 1c.5 of `crd-well-oiled-machine`.
                  nullable: true
                  properties:
                    artifactType:
                      description: >-
                        OCI artifactType media-type, e.g.

                        `application/vnd.kars.egress-allowlist.v1+yaml`.
                        Consumers MUST

                        reject artifacts whose pulled `artifactType` doesn't
                        match.
                      type: string
                    digest:
                      description: >-
                        Content-addressed digest, including the algorithm prefix

                        (`sha256:abc…`). The digest covers the canonical
                        artifact bytes —

                        see `docs/internal/policy-canonical-format.md` for the
                        egress-allowlist

                        canonicalization rules.
                      type: string
                    registry:
                      description: Registry hostname (e.g. `myacr.azurecr.io`, `ghcr.io`).
                      type: string
                    repository:
                      description: Repository path (e.g. `kars/policies/sandbox-foo`).
                      type: string
                  required:
                    - artifactType
                    - digest
                    - registry
                    - repository
                  type: object
                displayName:
                  description: Optional human-readable label for operator-TUI display.
                  nullable: true
                  type: string
                managed:
                  description: >-
                    Closed controller-managed workload preset. Mutually
                    exclusive with

                    url, bundleRef and endpoint authentication fields; the
                    controller

                    derives its private endpoint. No arbitrary workload image is
                    accepted.
                  nullable: true
                  properties:
                    preset:
                      description: Workloads for which Kars provides concrete deployment and protocol
                        support.
                      enum:
                        - playwright
                        - everything
                      type: string
                  required:
                    - preset
                  type: object
                oauth:
                  description: "OAuth 2.1 configuration. Required when `productionMode: true`."
                  nullable: true
                  properties:
                    audience:
                      description: Audience claim required on bearer tokens calling this server.
                      nullable: true
                      type: string
                    issuer:
                      description: >-
                        OAuth 2.1 issuer URL (must serve a discovery document at

                        `<issuer>/.well-known/oauth-authorization-server` or

                        `/.well-known/openid-configuration`). Validated lazily
                        on

                        reconcile; failures land in `Conditions`.
                      type: string
                    pkce:
                      default: S256
                      description: >-
                        PKCE method. Always S256 in this scaffold; field exists
                        for

                        future protocol negotiation.
                      type: string
                    resource:
                      description: Required `resource` indicator value for token exchange.
                      nullable: true
                      type: string
                  required:
                    - issuer
                  type: object
                productionMode:
                  description: >-
                    When true, the router rejects calls that are not
                    bearer-token-

                    authenticated against `oauth.issuer` with a verified PKCE
                    flow.

                    `false` allows unauthenticated calls — dev-only; admission
                    policy

                    rejects this for non-dev tenants (mirrors `Null*` provider
                    rule).


                    Optional: a signed bundle can supply this. When neither
                    inline

                    nor bundle sets the field, the effective value defaults to

                    `false` (back-compat with the pre-1c.5 schema).
                  nullable: true
                  type: boolean
                scopes:
                  description: >-
                    OAuth 2.1 scopes that the router will request when fronting
                    calls

                    from sandboxes to this server. The actual per-tool gating is

                    expressed in `ToolPolicy` resources, not here.
                  items:
                    type: string
                  nullable: true
                  type: array
                url:
                  description: >-
                    Server endpoint URL. MUST be `https://` when
                    `productionMode: true`.

                    Validated by admission CEL.


                    Optional: a signed bundle can supply this via
                    [`bundle_ref`]. At

                    reconcile time, exactly one of `url` or `bundle_ref.url`
                    must

                    resolve to a non-empty value, otherwise the reconciler
                    stamps

                    `Degraded=True/SpecInvalid`.
                  nullable: true
                  type: string
              type: object
              x-kubernetes-validations:
                - message: productionMode requires spec.oauth.issuer to be set
                  reason: FieldValueInvalid
                  rule: has(self.bundleRef) || !has(self.productionMode) || self.productionMode ==
                    false || (has(self.oauth) && size(self.oauth.issuer) > 0)
                - message: productionMode requires spec.url to begin with https://
                  reason: FieldValueInvalid
                  rule: has(self.bundleRef) || !has(self.productionMode) || self.productionMode ==
                    false || (has(self.url) && self.url.startsWith('https://'))
                - message: spec.oauth.pkce, when set, must be 'S256' (RFC 7636 §4.2)
                  reason: FieldValueInvalid
                  rule: "!has(self.oauth) || !has(self.oauth.pkce) || self.oauth.pkce == 'S256'"
                - message: spec.bundleRef is mutually exclusive with spec.url, spec.oauth,
                    spec.productionMode, spec.scopes, spec.allowedTools, and
                    spec.displayName, and spec.managed
                  reason: FieldValueInvalid
                  rule: "!has(self.bundleRef) || (!has(self.url) && !has(self.oauth) &&
                    !has(self.productionMode) && !has(self.scopes) &&
                    !has(self.allowedTools) && !has(self.displayName) &&
                    !has(self.managed))"
                - message: spec.managed is mutually exclusive with spec.url, spec.oauth,
                    spec.productionMode, spec.scopes, spec.bearerFromEnv, and
                    spec.bundleRef
                  reason: FieldValueInvalid
                  rule: "!has(self.managed) || (!has(self.url) && !has(self.oauth) &&
                    !has(self.productionMode) && !has(self.scopes) &&
                    !has(self.bearerFromEnv) && !has(self.bundleRef))"
            status:
              nullable: true
              properties:
                bundleRefDigest:
                  description: |-
                    OCI manifest digest of the verified signed bundle, when the
                    `bundleRef` authoring path was taken. Operator-visible proof
                    that the signature was checked and the bundle's bytes shaped
                    the effective server config.

                    `None` when the inline path was used.

                    Slice 1c.5 of `crd-well-oiled-machine`.
                  nullable: true
                  type: string
                conditions:
                  description: Standard K8s Conditions, KEP-1623 shape.
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another. This should be when the
                          underlying condition changed.  If that is not known,
                          then using the time when the API field changed is
                          acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition. This may be an empty string.
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon. For instance, if
                          .metadata.generation is currently 12, but the
                          .status.conditions[x].observedGeneration is 9, the
                          condition is out of date with respect to the current
                          state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition. Producers of specific
                          condition types may define expected values and
                          meanings for this field, and whether the values are
                          considered a guaranteed API. The value should be a
                          CamelCase string. This field may not be empty.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  nullable: true
                  type: array
                discoveredTools:
                  description: Last successfully probed, allowlisted upstream tool names.
                  items:
                    type: string
                  nullable: true
                  type: array
                endpoint:
                  description: Effective upstream URL. Absent while a managed workload is
                    unqualified.
                  nullable: true
                  type: string
                jwksConfigMapRef:
                  description: >-
                    Reference to the ConfigMap caching the issuer's JWKS.
                    Present

                    only when `spec.productionMode == true`. Single key
                    `jwks.json`

                    holds the raw RFC 7517 JWKSet bytes. Field-managed by

                    `kars-controller/mcp`.
                  nullable: true
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                lastProbedAt:
                  description: Last health-check timestamp (RFC 3339).
                  nullable: true
                  type: string
                managedNamespaceUid:
                  description: Exact API-server namespace incarnation holding the managed
                    workload.
                  nullable: true
                  type: string
                mode:
                  description: >-
                    Managed or External. Managed readiness includes current
                    workload

                    rollout and a successful bounded MCP initialize/tools/list
                    probe.
                  nullable: true
                  type: string
                observedGeneration:
                  description: "`metadata.generation` last successfully reconciled. KEP-1623."
                  format: int64
                  nullable: true
                  type: integer
                phase:
                  description: "Lifecycle phase: `Pending` | `Ready` | `Degraded` | `Unknown`."
                  nullable: true
                  type: string
                signingKeyRef:
                  description: >-
                    Reference to the Secret holding the Ed25519 signing keypair
                    this

                    reconciler emits. The Secret has type

                    `kars.azure.com/mcp-signing-key` with two keys:

                    `signing-key.private` (raw 32-byte Ed25519 seed) and

                    `signing-key.public` (raw 32-byte verifying key).
                    Field-managed

                    by `kars-controller/mcp`.
                  nullable: true
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  type: object
                toolSchemaDigest:
                  description: >-
                    Content digest of the discovered tool definitions, not a
                    signature or

                    supply-chain attestation.
                  nullable: true
                  type: string
                workloadGeneration:
                  description: Deployment generation covered by the successful protocol probe.
                  format: int64
                  nullable: true
                  type: integer
                workloadImage:
                  description: Exact image reference covered by the successful protocol probe.
                  nullable: true
                  type: string
                workloadRef:
                  description: >-
                    Display hint for the managed Deployment (namespace/name),
                    never

                    sufficient authority for cleanup.
                  nullable: true
                  type: string
              type: object
          required:
            - spec
          title: McpServer
          type: object
      served: true
      storage: true
      subresources:
        status: {}

