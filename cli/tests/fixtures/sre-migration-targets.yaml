                      description: Semantic Kernel runtime variant (declared placeholder). Schema is
                        locked but the controller stamps `RuntimeReady=False /
                        AdapterMissing` until the SK adapter image ships.
                      properties:
                        language:
                          type: string
                          enum:
                            - python
                            - dotnet
                            - java
                          description: Adapter image flavour. Defaults to `python`.
                        agentCode:
                          type: object
                          x-kubernetes-validations:
                            - rule: has(self.oci) != has(self.git)
                              message: spec.runtime.semanticKernel.agentCode must set exactly one of `oci` or
                                `git`
                          properties:
                            oci:
                              type: object
                              required:
                                - image
                              properties:
                                image:
                                  type: string
                            git:
                              type: object
                              required:
                                - url
                              properties:
                                url:
                                  type: string
                                ref:
                                  type: string
                                path:
                                  type: string
                        entrypoint:
                          type: array
                          items:
                            type: string
                        extraEnv:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                    langGraph:
                      type: object
                      description: LangGraph (LangChain) runtime variant. Both Python
