apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karsevals.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: KarsEval
    plural: karsevals
    shortNames:
      - ceval
    singular: karseval
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.targetSandboxRef.name
          name: Sandbox
          type: string
        - jsonPath: .spec.schedule
          name: Schedule
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.lastRunAt
          name: LastRun
          type: date
        - jsonPath: .status.lastResult.passed
          name: Passed
          type: integer
        - jsonPath: .status.lastResult.failed
          name: Failed
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for KarsEvalSpec via `CustomResource`
          properties:
            spec:
              description: "`KarsEval.spec` — declares a conformance run over a sandbox."
              properties:
                corpus:
                  description: >-
                    Source of the corpus to replay. Exactly one variant must be
                    set;

                    CEL admission enforces the mutex.
                  properties:
                    builtin:
                      description: >-
                        Name of a builtin corpus shipped with the controller.
                        See

                        `kars_eval_corpus::builtin::ALL_NAMES`.
                      nullable: true
                      type: string
                    bundleRef:
                      description: Reference to a signed OCI artifact carrying a corpus.
                      nullable: true
                      properties:
                        artifactType:
                          description: >-
                            OCI artifactType media-type, e.g.

                            `application/vnd.kars.egress-allowlist.v1+yaml`.
                            Consumers MUST

                            reject artifacts whose pulled `artifactType` doesn't
                            match.
                          type: string
                        digest:
                          description: >-
                            Content-addressed digest, including the algorithm
                            prefix

                            (`sha256:abc…`). The digest covers the canonical
                            artifact bytes —

                            see `docs/internal/policy-canonical-format.md` for
                            the egress-allowlist

                            canonicalization rules.
                          type: string
                        registry:
                          description: Registry hostname (e.g. `myacr.azurecr.io`, `ghcr.io`).
                          type: string
                        repository:
                          description: Repository path (e.g. `kars/policies/sandbox-foo`).
                          type: string
                      required:
                        - artifactType
                        - digest
                        - registry
                        - repository
                      type: object
                  type: object
                displayName:
                  description: Optional human-readable label surfaced in CLI output.
                  nullable: true
                  type: string
                failSandboxOnDrift:
                  description: >-
                    When `true`, a failing run patches the target
                    `KarsSandbox`'s

                    `Degraded` condition (reason `ConformanceDrift`) via a
                    distinct

                    field manager. The sandbox reconciler will then refuse to
                    admit

                    new agent sessions until the next successful eval clears the

                    condition.


                    Defaults to `false` so first-time operators can adopt the
                    CRD

                    without immediately taking sandboxes offline on a corpus
                    update.
                  nullable: true
                  type: boolean
                runnerImage:
                  description: >-
                    Optional override of the conformance-runner container image.
                    When

                    absent the controller falls back to the Helm-configured
                    default

                    (`KARS_CONFORMANCE_RUNNER_IMAGE` env). Setting this on a CR

                    is an escape hatch for in-cluster development; production
                    should

                    pin the image globally via the Helm chart.
                  nullable: true
                  type: string
                schedule:
                  description: >-
                    Optional cron schedule (5-token form, K8s
                    `CronJob.spec.schedule`

                    shape). When empty/absent, the eval runs only when an
                    operator

                    adds the `kars.azure.com/run-now=true` annotation.
                  nullable: true
                  type: string
                targetSandboxRef:
                  description: Sandbox this eval applies to. Must live in the same namespace.
                  properties:
                    name:
                      description: Sandbox name (`KarsSandbox.metadata.name`).
                      type: string
                  required:
                    - name
                  type: object
