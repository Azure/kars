                      description: >-
                        Per-type params. Stored as a string-keyed map so the CRD
                        schema

                        emits a concrete `type: object` (apiserver rejects
                        fields with

                        no schema type). Values are arbitrary JSON — the
                        reconciler

                        validates the shape per `kind` at execute time.


                        Required fields per type:
                          - DeleteResourceQuota: {namespace, name}
                          - PatchDeploymentImage: {namespace, name, container, image}
                          - ScaleDeployment: {namespace, name, replicas}
