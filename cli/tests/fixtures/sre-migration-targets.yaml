apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karsprofiles.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: KarsProfile
    plural: karsprofiles
    shortNames:
      - cprofile
    singular: karsprofile
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.domain
          name: Domain
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.templateDigest
          name: Digest
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for KarsProfileSpec via `CustomResource`
          properties:
            spec:
              description: "`KarsProfile.spec` — a vetted, admission-gated team template."
              properties:
                charterTemplate:
                  description: >-
                    The charter template — the standing mandate a team
                    instantiated from this

                    profile adopts (when the team doesn't override it).
                  type: string
                defaultEnvelope:
                  description: The default trust envelope a team instantiated from this profile
                    adopts.
                  properties:
                    authorityCeiling:
                      description: >-
                        The maximum autonomy tier any *descendant* task may
                        hold. Must be in

                        `1..5` and `<= tier` — a task can never authorize a
                        child to act with

                        more authority than it holds itself.
                      format: int32
                      type: integer
                    budget:
                      description: Optional resource budget for the whole task subtree.
                      nullable: true
                      properties:
                        scope:
                          type: string
                          enum:
                            - GovernedInference
                            - null
                          nullable: true
                          description: >-
                            Explicit opt-in to governed-inference
                            tokens/configured maximum prices.

                            An absent scope retains the foundation's
                            planning-only interpretation.
                        tokens:
                          description: >-
                            Maximum total tokens the task subtree may consume.
                            `0`/absent means

                            "no token cap declared". Positive ceilings are
                            planning declarations:

                            launch is rejected until durable total/subtree
                            enforcement is available.
                          format: int64
                          nullable: true
                          type: integer
                        usdMicros:
                          description: >-
                            Maximum total spend in micro-USD (1e-6 USD) for the
                            task subtree.

                            `0`/absent means no cap declared. Positive ceilings
                            block launch in this

                            foundation. Integer micro-USD avoids floating-point
                            in an audit field.
                          format: int64
                          nullable: true
                          type: integer
                      type: object
                    delegationDepth:
                      default: 0
                      description: >-
                        Remaining number of delegation hops this task may still
                        spawn. A child

                        task is minted with `delegationDepth =
                        parent.delegationDepth - 1`;

                        at `0` no further delegation is permitted. Must be `>=
                        0`.
                      format: int32
                      type: integer
                    egressAllowlistRef:
                      description: >-
                        Reserved egress policy reference. This foundation cannot
                        resolve it

                        and rejects it before Ready. Use `blueprint.egress` for
                        Strict inline

                        destinations; standalone sandbox signed OCI allowlists
                        are unchanged.
                      nullable: true
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                    tier:
                      description: Autonomy tier (1..5). See the module docs for the taxonomy.
                      format: int32
                      type: integer
                    toolPolicyRef:
                      description: >-
                        Optional reference to a same-namespace `ToolPolicy` CR
                        that bounds

                        which tools/MCP servers this task (and its descendants)
                        may call.
                      nullable: true
                      properties:
                        name:
                          type: string
                      required:
                        - name
                      type: object
                  required:
                    - authorityCeiling
                    - tier
                  type: object
                displayName:
                  nullable: true
                  type: string
                domain:
                  description: >-
