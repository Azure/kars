apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karsapprovals.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: KarsApproval
    plural: karsapprovals
    shortNames:
      - cappr
    singular: karsapproval
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.taskRef.name
          name: Task
          type: string
        - jsonPath: .spec.action.kind
          name: Action
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.decider
          name: Decider
          type: string
        - jsonPath: .status.expiresAt
          name: Expires
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for KarsApprovalSpec via `CustomResource`
          properties:
            spec:
              description: "`KarsApproval.spec` — a human decision a task is waiting on."
              properties:
                action:
                  description: What needs a human decision.
                  properties:
                    detail:
                      description: Optional longer detail (e.g. the exact tool args or egress host).
                      maxLength: 8192
                      nullable: true
                      type: string
                    kind:
                      description: >-
                        One of [`ACTION_KINDS`]. Not enum-constrained on the
                        wire so the

                        primitive stays open; the Bridge treats unknown kinds as
                        `custom`.
                      maxLength: 64
                      type: string
                    requestedTier:
                      description: >-
                        For a `tierRaise`, the autonomy tier (1..5) being
                        requested. Surfaced

                        so an approver sees exactly how much authority they are
                        granting.
                      format: int32
                      nullable: true
                      type: integer
                    summary:
                      description: One-line, human-readable statement of what the agent wants to do.
                      maxLength: 4096
                      type: string
                  required:
                    - kind
                    - summary
                  type: object
                decision:
                  description: >-
                    The human decision. Absent while the approval is pending; a
                    person (or

                    the Bridge acting for them) patches this to drive the
                    terminal

                    transition. The controller is the sole writer of `status`.
                  nullable: true
                  properties:
                    decider:
                      description: >-
                        Identity of the human (or delegated principal) who
                        decided. Recorded

                        verbatim into status and, for granted approvals, into
                        the receipt.
                      maxLength: 320
                      type: string
                    reason:
                      description: Optional justification, surfaced to auditors.
                      maxLength: 8192
                      nullable: true
                      type: string
                    verdict:
                      description: "`approve` or `deny`."
                      maxLength: 7
                      type: string
                  required:
                    - decider
                    - verdict
                  type: object
                taskRef:
                  description: >-
                    The `KarsTask` this approval gates, in the **same
                    namespace**. The

                    controller binds the approval to this task's envelope
                    digest.
                  properties:
                    name:
                      maxLength: 253
                      type: string
                  required:
                    - name
                  type: object
                ttl:
                  description: >-
                    Time-to-live as an ISO-8601 duration (`PT15M`, `PT4H`,
                    `P1D`). An

                    undecided approval past `requestedAt + ttl` becomes
                    `Expired`. Defaults

                    to `PT1H` when omitted.
                  maxLength: 64
                  nullable: true
                  type: string
              required:
                - action
                - taskRef
              type: object
              x-kubernetes-validations:
                - message: spec.action.kind must be non-empty
                  reason: FieldValueInvalid
                  rule: size(self.action.kind) > 0
                - message: spec.taskRef.name must be non-empty
                  reason: FieldValueInvalid
                  rule: size(self.taskRef.name) > 0
                - message: spec.taskRef and spec.action are immutable
                  reason: FieldValueForbidden
                  rule: self.taskRef == oldSelf.taskRef && self.action == oldSelf.action
                - message: spec.ttl is immutable
                  reason: FieldValueForbidden
                  rule: (!has(self.ttl) && !has(oldSelf.ttl)) || (has(self.ttl) &&
                    has(oldSelf.ttl) && self.ttl == oldSelf.ttl)
                - message: spec.decision is immutable once recorded
                  reason: FieldValueForbidden
                  rule: "!has(oldSelf.decision) || (has(self.decision) && self.decision ==
                    oldSelf.decision)"
                - message: spec.decision requires approve/deny and a non-empty decider
                  reason: FieldValueInvalid
                  rule: "!has(self.decision) || (self.decision.verdict in ['approve','deny'] &&
                    size(self.decision.decider) > 0)"
            status:
              description: "`KarsApproval.status` — the controller is the sole writer."
              nullable: true
              properties:
                boundEnvelopeDigest:
                  description: >-
                    The task authorization digest (envelope plus effective
                    blueprint).

                    Copied once from `status.envelopeDigest`; never changes
                    after binding.
                  nullable: true
                  type: string
                boundRequest:
                  description: >-
                    Controller snapshot of taskRef/action/ttl, excluding the
                    later decision.

                    Prevents request mutation even on clusters with outdated
                    admission rules.
                  nullable: true
                  type: string
                boundTaskUid:
                  description: Immutable Kubernetes identity of the task whose authority was
                    bound.
                  nullable: true
                  type: string
                conditions:
                  description: >-
                    Standard K8s conditions; the `Decided` condition message
                    surfaces

                    *why* (e.g. the staleness reason).
                  items:
                    description: Condition contains details for one aspect of the current state of
                      this API Resource.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned from
                          one status to another. This should be when the
                          underlying condition changed.  If that is not known,
                          then using the time when the API field changed is
                          acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human readable message indicating details about the
                          transition. This may be an empty string.
                        type: string
                      observedGeneration:
                        description: observedGeneration represents the .metadata.generation that the
                          condition was set based upon. For instance, if
                          .metadata.generation is currently 12, but the
                          .status.conditions[x].observedGeneration is 9, the
                          condition is out of date with respect to the current
                          state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: reason contains a programmatic identifier indicating the reason for
                          the condition's last transition. Producers of specific
                          condition types may define expected values and
                          meanings for this field, and whether the values are
                          considered a guaranteed API. The value should be a
                          CamelCase string. This field may not be empty.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  nullable: true
                  type: array
                decidedAt:
                  description: >-
                    RFC-3339 time the human decision was first recorded.
                    Immutable once

                    set — re-reconciles preserve it.
                  nullable: true
                  type: string
                decider:
                  description: Echo of `spec.decision.decider` once decided, for the printer
                    column.
                  nullable: true
                  type: string
                expiresAt:
                  description: RFC-3339 expiry (`requestedAt + ttl`). Stable across re-reconciles.
                  nullable: true
                  type: string
                observedGeneration:
                  description: "`metadata.generation` last reconciled."
                  format: int64
                  nullable: true
                  type: integer
                phase:
                  description: "`Pending` | `Approved` | `Denied` | `Expired` | `Stale`."
                  nullable: true
                  type: string
                requestedAt:
                  description: >-
                    RFC-3339 request creation time (first observation when
                    unavailable).

                    The TTL is measured from here; re-reconciles never bump it.
                  nullable: true
                  type: string
              type: object
          required:
            - spec
          title: KarsApproval
          type: object
      served: true
      storage: true
      subresources:
        status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karsauthconfigs.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: KarsAuthConfig
    plural: karsauthconfigs
    shortNames:
      - kac
    singular: karsauthconfig
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.tenant.tenantId
          name: Tenant
          type: string
        - jsonPath: .spec.agentId.blueprintClientId
          name: Blueprint
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            KarsAuthConfig — cluster-singleton holding the Entra Agent ID
            provisioning anchors. The canonical type definitions live in
            `controller/src/auth_config.rs`. The CLI (`kars mesh
            setup-trust`) writes this CR; the controller validates spec
            shape at reconcile time.
          type: object
          properties:
            spec:
              type: object
              required:
                - tenant
                - agentId
                - controller
              x-kubernetes-validations:
                - rule: self == oldSelf || true
                  message: spec mutations allowed; reconciler enforces shape
              properties:
                tenant:
                  type: object
                  required:
                    - tenantId
                  properties:
                    tenantId:
                      type: string
                      description: Microsoft Entra tenant GUID.
                    authorityHost:
                      type: string
                      description: Authority host (default login.microsoftonline.com).
                      default: https://login.microsoftonline.com/
                    serviceManagementReference:
                      type: string
                      description: |
                        ServiceTree GUID required by Microsoft-style enterprise
                        tenants when registering new Entra applications. Audit
                        lineage only; not used at runtime.
                agentId:
                  type: object
                  required:
                    - blueprintClientId
                    - blueprintObjectId
                  properties:
                    blueprintClientId:
                      type: string
                    blueprintObjectId:
                      type: string
                    sponsorUserObjectIds:
                      type: array
                      items:
                        type: string
                      description: Entra user objectIds applied as sponsors on every per-sandbox agent
                        identity. Required in tenants where Graph rejects
                        identities lacking a sponsor.
                controller:
                  type: object
                  required:
                    - managedIdentityClientId
                    - managedIdentityResourceId
                  properties:
                    managedIdentityClientId:
                      type: string
                    managedIdentityResourceId:
                      type: string
                    managedIdentityPrincipalId:
                      type: string
                meshAuthBackend:
                  type: string
                  enum:
                    - Anonymous
                    - EntraAgentIdentity
                  default: Anonymous
                  description: |
                    Selects the AGT mesh peer registration tier. `Anonymous`
                    (default) registers without identity; `EntraAgentIdentity`
                    mints an Entra-signed JWT per sandbox via the shared
                    auth-sidecar and presents it to the relay/registry for
                    verified-tier registration.
                meshAuthAudience:
                  type: string
                  description: |
                    Audience claim the AGT relay/registry expects on the
                    per-peer Entra JWT. Defaults to the blueprint's
                    `<clientId>/.default` scope when unset.
                downstreamApis:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                foundryRbac:
                  type: array
                  description: >
                    Per-sandbox ARM RBAC role assignments the controller

                    PUTs against each new per-sandbox agent identity SP at

                    provisioning time (and DELETEs on deprovision).

                    Eliminates the manual `az role assignment create` step

                    operators would otherwise run for each new sandbox.

                    Requires the controller MI to have

                    `Microsoft.Authorization/roleAssignments/write` on

                    each listed scope. See

                    `controller/src/auth_config.rs::FoundryRbacAssignment`

                    and
                    `docs/architecture/entra-agent-id/05-security-alignment.md`.
                  items:
                    type: object
                    required:
                      - scope
                      - roleDefinitionIds
                    properties:
                      scope:
                        type: string
                        description: |
                          Full ARM scope to assign at. Typical values:
                          - `/subscriptions/<sub>/resourceGroups/<rg>` for an entire RG
                          - `/subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.CognitiveServices/accounts/<name>`
                            for a single Foundry account.
                      roleDefinitionIds:
                        type: array
                        description: >
                          Built-in role definition GUIDs to grant at this scope.

                          kars-recommended defaults:

                          - `5e0bd9bd-7b93-4f28-af87-19fc36ad61bd` — Cognitive
                          Services OpenAI User

                          - `53ca6127-db72-4b80-b1b0-d745d6d5456d` — Azure AI
                          User
                        items:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: |
                    Pending | Ready | Degraded | NotDefault. Set by the
                    auth-config reconciler.
                observedGeneration:
                  type: integer
                  format: int64
                  description: |
                    metadata.generation last observed by the reconciler.
                blueprintFicCount:
