        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: AMID
          type: string
          jsonPath: .status.boundAmid
        - name: Budget
          type: integer
          jsonPath: .spec.tokenBudget
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
