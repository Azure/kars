# Pass BEFORE reviewed private operator values to the ordinary Bridge helm install.
# Core must have completed the same profile; render-time live lookups fail closed.
global:
  installationProfile: kind-beta
namespace: kars-system
core:
  namespace: kars-system
createNamespace: false
workspaceEnrollment:
  enabled: true
idp:
  enabled: false
  dex:
    persistence:
      enabled: true
networkPolicy:
  create: true
bff:
  routeQualification:
    mode: required
