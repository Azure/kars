{{- if .Values.idp.enabled }}
{{- $ns := include "kars-bridge.namespace" . }}
{{- $existing := (lookup "v1" "Secret" $ns .Values.idp.secretName) }}
{{- $client := .Values.idp.clientSecret }}
{{- $session := .Values.idp.sessionSecret }}
{{- if and (not $client) $existing }}{{ $client = (index $existing.data "client-secret" | b64dec) }}{{ end }}
{{- if and (not $session) $existing }}{{ $session = (index $existing.data "session-secret" | b64dec) }}{{ end }}
{{- if not $client }}{{ $client = randAlphaNum 64 }}{{ end }}
{{- if not $session }}{{ $session = randAlphaNum 64 }}{{ end }}
# kars Bridge — OIDC secrets (Dex client secret + Bridge session-signing secret).
#
# Both are 64-char values. When `idp.clientSecret` / `idp.sessionSecret` are set
# in values they are used verbatim; otherwise a stable per-release random value
# is generated (and preserved across upgrades via lookup) so a `helm upgrade`
# does not silently invalidate every live session. For anything beyond a private
# alpha, set them explicitly from a real secret manager and never commit them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.idp.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "kars-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ $client | quote }}
  session-secret: {{ $session | quote }}
{{- end }}
