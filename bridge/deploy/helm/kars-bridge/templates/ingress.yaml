{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kars-bridge
  namespace: {{ include "kars-bridge.namespace" . }}
  labels:
    {{- include "kars-bridge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The web app owns the origin and proxies /api/* to the BFF Service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kars-bridge-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
