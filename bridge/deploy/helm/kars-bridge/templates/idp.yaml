{{- if and (hasKey .Values.networkPolicy "dexApiServerIngress") (not (kindIs "bool" .Values.networkPolicy.dexApiServerIngress)) }}
{{- fail "networkPolicy.dexApiServerIngress must be a boolean" }}
{{- end }}
{{- if .Values.networkPolicy.dexApiServerIngress }}
{{- if not (and .Values.networkPolicy.create .Values.idp.enabled .Values.idp.dex.tls.enabled) }}
{{- fail "networkPolicy.dexApiServerIngress requires networkPolicy.create, idp.enabled and idp.dex.tls.enabled" }}
{{- end }}
{{- if not (.Capabilities.APIVersions.Has "cilium.io/v2/CiliumNetworkPolicy") }}
{{- fail "networkPolicy.dexApiServerIngress requires the CiliumNetworkPolicy API" }}
{{- end }}
{{- end }}
{{- if .Values.idp.enabled }}
{{- $managed := .Values.idp.dex.kindPrerequisite | default false }}
{{- if and $managed (not (and (kindIs "bool" $managed) .Values.idp.dex.tls.enabled .Values.idp.dex.persistence.enabled .Values.idp.dex.persistence.existingClaim .Values.networkPolicy.dexApiServerIngress (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" .Values.idp.dex.image))) }}
{{- fail "idp.dex.kindPrerequisite requires immutable Dex, TLS, an owned persistent claim and Cilium API-server ingress" }}
{{- end }}
{{- if and $managed (not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" (.Values.idp.dex.kindGatewayCIDR | default ""))) }}
{{- fail "idp.dex.kindPrerequisite requires the discovered Kind gateway IPv4 /32" }}
{{- end }}
{{- $tls := .Values.idp.dex.tls | default dict }}
{{- $persistence := .Values.idp.dex.persistence | default dict }}
{{- if and (hasKey $persistence "enabled") (not (kindIs "bool" $persistence.enabled)) }}
{{- fail "idp.dex.persistence.enabled must be a boolean" }}
{{- end }}
{{- $persistent := $persistence.enabled | default false }}
{{- if and (hasKey $persistence "existingClaim") (not (kindIs "string" $persistence.existingClaim)) }}
{{- fail "idp.dex.persistence.existingClaim must be a string" }}
{{- end }}
{{- $claim := $persistence.existingClaim | default "" }}
{{- if and $claim (or (gt (len $claim) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $claim))) }}
{{- fail "idp.dex.persistence.existingClaim must be a valid PVC name" }}
{{- end }}
{{- if and $claim (not $persistent) }}
{{- fail "idp.dex.persistence.existingClaim requires persistence.enabled" }}
{{- end }}
{{- if and $persistent (not $claim) }}
{{- if not (kindIs "string" $persistence.size) }}
{{- fail "idp.dex.persistence.size must be a nonempty Kubernetes storage quantity" }}
{{- end }}
{{- if not (trim $persistence.size) }}
{{- fail "idp.dex.persistence.size must be a nonempty Kubernetes storage quantity" }}
{{- end }}
{{- if and (ne $persistence.storageClass nil) (not (kindIs "string" $persistence.storageClass)) }}
{{- fail "idp.dex.persistence.storageClass must be a string or null" }}
{{- end }}
{{- end }}
{{- $headlamp := .Values.idp.headlampClient | default dict }}
{{- range $option := list (dict "name" "idp.dex.tls" "value" $tls) (dict "name" "idp.headlampClient" "value" $headlamp) }}
{{- if and (hasKey $option.value "enabled") (not (kindIs "bool" $option.value.enabled)) }}
{{- fail (printf "%s.enabled must be a boolean" $option.name) }}
{{- end }}
{{- end }}
{{- if or $tls.enabled $headlamp.enabled }}
{{- if not (regexMatch "^https://[^/?#@[:space:]]+(/[^?#[:space:]]*)?$" .Values.idp.issuer) }}
{{- fail "idp.issuer must be HTTPS when Dex TLS or the Headlamp client is enabled" }}
{{- end }}
{{- end }}
{{- if and $tls.enabled (not $tls.secretName) }}
{{- fail "idp.dex.tls.secretName must reference an existing TLS Secret" }}
{{- end }}
{{- if $headlamp.enabled }}
{{- if not (trim (required "idp.headlampClient.clientID is required" $headlamp.clientID)) }}
{{- fail "idp.headlampClient.clientID must not be blank" }}
{{- end }}
{{- if eq $headlamp.clientID .Values.idp.clientId }}
{{- fail "idp.headlampClient.clientID must differ from the Bridge client ID" }}
{{- end }}
{{- $secret := $headlamp.clientSecret | default dict }}
{{- if not (and $secret.name $secret.key) }}
{{- fail "idp.headlampClient.clientSecret.name and key must reference an existing Secret" }}
{{- end }}
{{- if not (regexMatch "^(https://[^/?#@[:space:]]+|http://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?)/oidc-callback$" (required "idp.headlampClient.callbackURL is required" $headlamp.callbackURL)) }}
{{- fail "idp.headlampClient.callbackURL must be HTTPS /oidc-callback (HTTP only on loopback)" }}
{{- end }}
{{- end }}
# The compatibility profile uses Bridge's same-origin /dex proxy.
# Managed local beta renders this component separately: HTTPS-only, persistent
# storage and explicit loopback hostname/trust, before installing full Bridge.
# Static passwords are genuine local beta accounts, not upstream identities;
# deployed multi-user environments should configure their external provider.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: {{ include "kars-bridge.namespace" . }}
  labels:
    {{- include "kars-bridge.labels" . | nindent 4 }}
    app: dex
data:
  config.yaml: |
    # The same issuer must resolve from both browsers and OIDC clients.
    issuer: {{ .Values.idp.issuer | quote }}
    {{- if $persistent }}
    storage:
      type: sqlite3
      config:
        file: /var/lib/dex/dex.db
    {{- else }}
    storage: { type: memory }
    {{- end }}
    web:
      {{- if not $managed }}
      http: 0.0.0.0:5556
      {{- end }}
      {{- if $tls.enabled }}
      https: 0.0.0.0:5557
      tlsCert: /etc/dex-tls/tls.crt
      tlsKey: /etc/dex-tls/tls.key
      {{- end }}
    oauth2: { skipApprovalScreen: true }
    staticClients:
      - id: {{ .Values.idp.clientId | quote }}
        name: kars Bridge
        secretEnv: DEX_CLIENT_SECRET
        redirectURIs: {{ .Values.idp.redirectURIs | toJson }}
      {{- if $headlamp.enabled }}
      - id: {{ $headlamp.clientID | quote }}
        name: kars Headlamp
        secretEnv: DEX_HEADLAMP_CLIENT_SECRET
        redirectURIs: [{{ $headlamp.callbackURL | quote }}]
      {{- end }}
    enablePasswordDB: {{ .Values.idp.dex.enablePasswordDB }}
    {{- with .Values.idp.dex.staticPasswords }}
    staticPasswords:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.idp.dex.connectors }}
    connectors:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: {{ include "kars-bridge.namespace" . }}
  labels:
    {{- include "kars-bridge.labels" . | nindent 4 }}
    app: dex
spec:
  replicas: 1
  {{- if $persistent }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        {{- include "kars-bridge.labels" . | nindent 8 }}
        app: dex
      annotations:
        # Roll the pod when the config changes so issuer/user edits take effect.
        checksum/config: {{ .Values.idp | toJson | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        {{- if or $tls.enabled $persistent }}
        fsGroup: 1001
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dex
          image: {{ .Values.idp.dex.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/config.yaml"]
          env:
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.idp.secretName }}
                  key: client-secret
            {{- if $headlamp.enabled }}
            - name: DEX_HEADLAMP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $headlamp.clientSecret.name | quote }}
                  key: {{ $headlamp.clientSecret.key | quote }}
            {{- end }}
          ports:
            {{- if not $managed }}
            - containerPort: 5556
            {{- end }}
            {{- if $tls.enabled }}
            - name: https
              containerPort: 5557
            {{- end }}
          {{- if $managed }}
          readinessProbe:
            httpGet:
              scheme: HTTPS
              port: https
              path: /.well-known/openid-configuration
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            {{- if $persistent }}
            - name: storage
              mountPath: /var/lib/dex
            {{- end }}
            - name: config
              mountPath: /etc/dex
              readOnly: true
            {{- if $tls.enabled }}
            - name: tls
              mountPath: /etc/dex-tls
              readOnly: true
            {{- end }}
      volumes:
        {{- if $persistent }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ $claim | default "dex-data" | quote }}
        {{- end }}
        - name: config
          configMap:
            name: dex
        {{- if $tls.enabled }}
        - name: tls
          secret:
            secretName: {{ $tls.secretName | quote }}
            defaultMode: 288
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
{{- if and $persistent (not $claim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dex-data
  namespace: {{ include "kars-bridge.namespace" . }}
  labels:
    {{- include "kars-bridge.labels" . | nindent 4 }}
    app: dex
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if kindIs "string" $persistence.storageClass }}
  storageClassName: {{ $persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: {{ include "kars-bridge.namespace" . }}
  labels:
    {{- include "kars-bridge.labels" . | nindent 4 }}
    app: dex
spec:
  {{- if $managed }}
  type: NodePort
  externalTrafficPolicy: Local
  {{- end }}
  {{- with .Values.idp.dex.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  selector:
    app: dex
  ports:
    {{- if not $managed }}
    - name: http
      port: 5556
      targetPort: 5556
    {{- end }}
    {{- if $tls.enabled }}
    - name: https
      port: {{ ternary 443 5557 $managed }}
      {{- if $managed }}
      nodePort: 30443
      {{- end }}
      targetPort: https
    {{- end }}
{{- if .Values.networkPolicy.create }}
---
# Compatibility allows the same-origin /dex proxy. Managed local beta admits
# only its gateway and named web clients over TLS, with deny-all egress;
# API-server/control-plane ingress is governed separately by Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dex
  namespace: {{ include "kars-bridge.namespace" . }}
  labels:
    {{- include "kars-bridge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: dex
  policyTypes: ["Ingress"{{ if $managed }}, "Egress"{{ end }}]
  {{- if $managed }}
  egress: []
  {{- end }}
  ingress:
    - from:
        {{- if $managed }}
        - ipBlock:
            cidr: {{ .Values.idp.dex.kindGatewayCIDR | quote }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: headlamp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: headlamp
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kars-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: web
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        {{- if not $managed }}
        - port: 5556
          protocol: TCP
        {{- end }}
        {{- if $tls.enabled }}
        - port: 5557
          protocol: TCP
        {{- end }}
{{- if .Values.networkPolicy.dexApiServerIngress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-dex-apiserver
  namespace: {{ include "kars-bridge.namespace" . }}
  labels:
    {{- include "kars-bridge.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: dex
  ingress:
    - fromEntities: ["kube-apiserver"]
      toPorts:
        - ports:
            - port: "5557"
              protocol: TCP
    - fromNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: ""
      toPorts:
        - ports:
            - port: "5557"
              protocol: TCP
{{- end }}
{{- end }}
{{- end }}
