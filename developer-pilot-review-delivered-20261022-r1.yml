                        - generic [ref=f1e4662]: "# Kars-on-Kind: owner-reviewed 30-minute developer pilot guide **Status: AWAITING OWNER REVIEW — execution deferred; not adoption authorization.** Date: 2026-10-22 UTC. Package: Developer pilot review / `developer-pilot-review`. Companion: [evidence-ledger.md](evidence-ledger.md). ## 1. What this package delivers This is an editable, conditional test plan, assembled from two retained role handoffs. No cluster, Kars workload, Azure resource or Entra identity was created or tested by this synthesis or reported as tested by the two roles. The useful completed work is documentation review, a substantive direct peer challenge/correction exchange, and explicit recording of failed governed-memory exercises. **The full Kars pilot is currently BLOCKED by missing product instructions.** The investigator's proposal to treat manifest security fields plus one allowed and one denied request as an isolation/governed-egress pass was withdrawn after reviewer challenge. The reviewer confirmed that specific correction, with no remaining disagreement on that claim. This guide incorporates it: configuration intent, narrowly observed runtime behavior and production acceptance are different kinds of evidence. See ledger E1–E4. ### Evidence vocabulary - **DOC:** retained public documentation/tool-result excerpts; not deployed behavior. - **OBS:** actual role tool observations in retained handoffs, not new synthesis observations of infrastructure. - **PLAN:** proposed developer action, never a passed check. - **UNVERIFIED KARS:** product-specific instructions or assertions unavailable in the inputs; do not invent commands to fill them. - **LATER AKS/ENTRA:** a separate approved acceptance effort, not implied by Kind results. The clock starts only after prerequisites are resolved and owner execution approval is recorded. Cold downloads, installations, access remediation and product-contract discovery are outside the 30 minutes. If these cannot be resolved, use this package as a blocked assessment, not a runnable Kars recipe. ## 2. Mandatory prerequisites — resolve before starting | Required input | Current evidence / owner action | |---|---| | Explicit owner review and execution authorization | Both files await review. A queued clarification is not approval. Record approval reference, operator, host and allowed test scope before executing. | | Canonical Kars repository and immutable revision | **UNVERIFIED KARS / MISSING.** Supply repository URL, tag/commit, immutable images, supported Kind/Kubernetes/runtime/host-architecture matrix and resource sizing. No Kars repository health, test-suite or maintenance assessment was possible. | | Kars install, readiness and uninstall contract | **UNVERIFIED KARS / MISSING.** Supply exact reviewed commands/manifests, namespaces/resources, required RBAC, rollout/readiness criteria, expected writable mounts, host access and external-state cleanup. Do not substitute guessed Helm, CLI or kubectl apply commands. | | Auth, request and accounting contract | **UNVERIFIED KARS / MISSING.** Supply least-privilege test authentication, one benign authenticated request and expected response, approved missing/invalid-credential test, provider/model route evidence and per-request usage lookup. No production credentials; no disabling auth. | | Isolation and egress contract | **UNVERIFIED KARS / MISSING.** Identify actual CNI/version, policy enforcement points, router path, safe allowed/denied destinations, decision-log lookup and approved non-destructive runtime probes. Treat DNS/TLS/timeouts separately from policy denial. | | Memory configuration | Both roles selected `foundry.memory`; update and search failed HTTP 403 `unsupported_budget_operation`. An operator must diagnose the current binding/funding contract. Do not reuse `memory-beta-r1474`, silently fall back, edit funding to fit the test or infer storage from files. | | Disposable developer host | Owner-approved host/VM with functioning container engine, Kind and kubectl already installed; record versions and OS/architecture. Use approved tooling channels. Do not install nested privileged Kind in this research sandbox. Rootless runtimes require additional setup per S1. | | Pinned node image and local readiness | Select an image compatible with the chosen Kind release and record its immutable digest from reviewed release information. Images must already be available through approved egress. S1 reports v0.33.0; secondary DeepWiki includes v0.32.0. Neither proves the installed version; no sample digest is endorsed here. | | Safe local isolation of test state | Use a dedicated empty evidence directory, a currently unused cluster name, a newly reserved kubeconfig path and an inventory of unrelated clusters. Protect logs/kubeconfig as sensitive; record redacted evidence only for sharing. | | Existing governance preserved | Preserve the beta workspace's unbounded/non-expiring allowance and actual usage accounting, provider limits, auth, isolation and governed egress. These are requirements, not verified configuration. Unbounded workspace allowance does not mean unlimited provider quota or free use. | Missing inputs were requested through Inbox by the investigator; both requests remained pending. The reviewer made no separate Inbox request. Synthesis is file-only and cannot resolve or reissue them. Details and identifiers are in ledger R1–R2. ## 3. Thirty-minute sequence — all steps below are PLAN, not execution results Reserve minutes 27–30 for cleanup. If readiness fails or a stage overruns, stop new testing and clean up; do not spend the cleanup reserve on retries. The timebox is a planning budget, not a performance promise. | Minutes | Developer action after approval | Observable checks and evidence to retain | Stop condition | |---|---|---|---| | 0–3 | Verify approval, input inventory, host/tool versions, cluster-name availability, dedicated kubeconfig/evidence directory and test credentials. | UTC start, approval reference, version outputs, baseline cluster inventory; no name/path collision. | Any missing prerequisite, ambiguous ownership or unexpected context. | | 3–8 | Create one digest-pinned disposable Kind cluster using the command skeleton below. Verify exact context, API and nodes. | Creation output; actual context; node Ready status, runtime/version and chosen image digest. Local Kind gate K1 only. | Creation fails, readiness exceeds five minutes or nodes are not Ready at stage end. | | 8–13 | Execute only owner-supplied Kars installation instructions; inspect expected workload images, ownership, spec/status and events. | Exact command/revision reference, expected resources in approved namespace, workload Ready, sanitized events/logs. Readiness alone is not functional or security acceptance. | Missing install contract, unexpected privilege/host mounts/images or readiness beyond stage. | | 13–18 | Run the approved benign request and approved missing/invalid-credential test. Correlate timestamps and request IDs with actual provider/model and usage records. Inspect configured rate/quota limits without saturation testing. | Expected authorized response; documented unauthorized rejection; actual route and usage entries; configured-limit evidence. | Auth/provider error, missing correlation, exposed credential or proposed bypass. Missing evidence remains inconclusive, not a pass. | | 18–24 | Review hardening intent separately from approved safe runtime probes. Run one approved allowed and one policy-denied egress check with decision logs and connectivity controls. If approved and available, exercise each participating role's native governed-memory write/read-back. | Fields for all app/init/ephemeral containers; approved UID/rootfs/writable-path probe results; actual CNI/router scope and decision IDs. Memory backend, labeled content, completed operation status and matching read-back are required. | Unexpected writable/privileged behavior, unclear 