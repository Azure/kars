# cargo-audit configuration
# See: https://docs.rs/cargo-audit/latest/cargo_audit/#configuration

[advisories]
ignore = [
    # RUSTSEC-2026-0097 — `rand` is unsound with a custom logger using `rand::rng()`
    # https://rustsec.org/advisories/RUSTSEC-2026-0097
    #
    # Severity: informational ("unsound"), NOT a vulnerability.
    # Source: transitive dependency — `agentmesh 3.1.0` pins `rand = "=0.8.5"` exactly.
    #   Our own direct deps are already on `rand = "0.9"` (patched).
    # Exploitation requires ALL of:
    #   1. A custom `log::Log` implementation is installed.
    #   2. That logger calls `rand::rng()` (or `rand::thread_rng()`).
    #   3. Trace-level logging is enabled AND a `TryRng`/`RngCore` method is invoked
    #      from inside the logger during a `ThreadRng` reseed (every 64 KiB).
    # Our inference-router uses `tracing-subscriber` (not `log::Log`) and no logger
    # implementation accesses `rand`. The upstream `agentmesh` crate uses `rand` only
    # for nonce/key generation, none of it from inside a logger.
    # TODO: remove once `agentmesh` ships a release with `rand >= 0.8.6`.
    "RUSTSEC-2026-0097",
    # RUSTSEC-2023-0071 — Marvin Attack: potential key recovery in `rsa` via timing sidechannels
    # https://rustsec.org/advisories/RUSTSEC-2023-0071
    #
    # Severity: medium (CVSS 5.9). NO upstream fix is available.
    # Source: transitive dependency — `sigstore 0.15.0` →
    # `openidconnect 4.1.0` → `rsa 0.9.10`. JWT verification uses
    # jsonwebtoken's AWS-LC backend and no longer adds RustCrypto RSA.
    # The Marvin attack requires *RSA private key operations* whose timing leaks
    # to a co-located attacker. The remaining use is Sigstore's Fulcio OIDC
    # signature validation against public keys; Kars does not perform RSA
    # decryption or private-key operations. Router JWT validation uses an
    # algorithm allow-list, kid pinning, and bounded JWKS caches.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2025-0134 — `rustls-pemfile` is unmaintained
    # https://rustsec.org/advisories/RUSTSEC-2025-0134
    #
    # Severity: informational ("unmaintained"), NOT a vulnerability.
    # Source: transitive dependency chain (S3.5, a2a-gateway + inference-router):
    #   rustls 0.23 ecosystem → rustls-pemfile 1.x (legacy reader)
    # `rustls-pemfile` 2.x exists but the rustls/tokio-rustls/rustls-native-certs
    # ecosystem still pulls 1.x transitively. Switching to `rustls-pki-types`
    # parsers requires upstream churn we don't control. Build-time + parse-only
    # behavior; no runtime/network exposure beyond what rustls itself provides.
    # TODO: drop this ignore once rustls-native-certs / tokio-rustls roll forward.
    "RUSTSEC-2025-0134",
    # RUSTSEC-2026-0173 — `proc-macro-error2 2.0.1` is unmaintained
    # https://rustsec.org/advisories/RUSTSEC-2026-0173
    #
    # Severity: informational ("unmaintained"), NOT a vulnerability.
    # Source: transitive build-time chain (controller-only):
    #   oci-client 0.16.1 / oci-client 0.18.0 → oci-spec → getset 0.1.6 (proc-macro)
    #     → proc-macro-error2 2.0.1
    # This proc-macro runs at compile time inside rustc, not at runtime in
    # the controller binary. There is no runtime attack surface from an
    # unmaintained proc-macro crate beyond the build toolchain itself. The
    # advisory was published 2026-06-07; no upstream replacement exists
    # yet — `getset` would need to roll forward.
    # TODO: drop this ignore when `getset` switches off `proc-macro-error2`.
    "RUSTSEC-2026-0173",
    # RUSTSEC-2024-0449 — `unsafe-libyaml 0.2.11` is unmaintained
    # https://rustsec.org/advisories/RUSTSEC-2024-0449
    #
    # Severity: informational ("unmaintained"), NOT a vulnerability.
    # Source: serde_yaml 0.9.34+deprecated, used by kube-client 3.1.0,
    # AGT agentmesh 4.0.0, and kars-controller / kars-inference-router /
    # kars-cncf-conformance. Dropping only our direct serde_yaml use would
    # not remove it while kube and agentmesh still depend on it.
    # Expires 2027-02-04 — remove or re-justify; tracked in Azure/kars#595.
    "RUSTSEC-2024-0449",
]
