# 02-toolpolicy.yaml — tool gates required for the exec-brief pipeline.
#
# Canonical tool names come from runtimes/openclaw/src/core/agt-tools/{agt,foundry}.ts:
#   azureclaw_spawn / _spawn_status / _spawn_destroy / _spawn_list
#   azureclaw_mesh_send / _mesh_inbox / _mesh_await / _mesh_transfer_file
#   azureclaw_discover
#   foundry_web_search / foundry_code_execute / foundry_image_generation
#   telegram_status
#
# Per controller/src/tool_policy.rs::AppliesToSelector, `appliesTo.tool`
# is a single string — one CR per gate. ApprovalPolicy.mode values are
# `never` | `always` | `aboveThreshold` (default `aboveThreshold` when
# commerce is set). RateLimitPolicy.window is a Go-duration string
# (`"1s"`, `"60s"`, `"1m"`, `"1h"`), NOT ISO-8601.
---
apiVersion: azureclaw.azure.com/v1alpha1
kind: ToolPolicy
metadata:
  name: execbrief-mesh-send
  namespace: azureclaw-system
  labels:
    azureclaw.azure.com/sandbox: execbrief
spec:
  appliesTo:
    tool: azureclaw_mesh_send
    sandboxMatchLabels:
      azureclaw.azure.com/sandbox: execbrief
  approval:
    mode: never
  rateLimit:
    rps: 5
    burst: 20
    window: "1s"
---
apiVersion: azureclaw.azure.com/v1alpha1
kind: ToolPolicy
metadata:
  name: execbrief-mesh-transfer-file
  namespace: azureclaw-system
  labels:
    azureclaw.azure.com/sandbox: execbrief
spec:
  appliesTo:
    tool: azureclaw_mesh_transfer_file
    sandboxMatchLabels:
      azureclaw.azure.com/sandbox: execbrief
  approval:
    mode: never
  rateLimit:
    rps: 2
    burst: 10
    window: "1s"
---
apiVersion: azureclaw.azure.com/v1alpha1
kind: ToolPolicy
metadata:
  name: execbrief-discover
  namespace: azureclaw-system
  labels:
    azureclaw.azure.com/sandbox: execbrief
spec:
  appliesTo:
    tool: azureclaw_discover
    sandboxMatchLabels:
      azureclaw.azure.com/sandbox: execbrief
  approval:
    mode: never
---
apiVersion: azureclaw.azure.com/v1alpha1
kind: ToolPolicy
metadata:
  name: execbrief-spawn
  namespace: azureclaw-system
  labels:
    azureclaw.azure.com/sandbox: execbrief
spec:
  appliesTo:
    tool: azureclaw_spawn
    sandboxMatchLabels:
      azureclaw.azure.com/sandbox: execbrief
  approval:
    mode: never
  rateLimit:
    # The parent spawns 3 sub-agents in parallel; 5 burst gives margin
    # for any auto-retry without exceeding the cap.
    rps: 1
    burst: 5
    window: "60s"
---
apiVersion: azureclaw.azure.com/v1alpha1
kind: ToolPolicy
metadata:
  name: execbrief-foundry-web-search
  namespace: azureclaw-system
  labels:
    azureclaw.azure.com/sandbox: execbrief
spec:
  appliesTo:
    tool: foundry_web_search
    sandboxMatchLabels:
      azureclaw.azure.com/sandbox: execbrief
  approval:
    mode: never
  rateLimit:
    rps: 1
    burst: 30
    window: "60s"
---
apiVersion: azureclaw.azure.com/v1alpha1
kind: ToolPolicy
metadata:
  name: execbrief-foundry-image-generation
  namespace: azureclaw-system
  labels:
    azureclaw.azure.com/sandbox: execbrief
spec:
  appliesTo:
    tool: foundry_image_generation
    sandboxMatchLabels:
      azureclaw.azure.com/sandbox: execbrief
  approval:
    mode: never
  rateLimit:
    # gpt-image-1 is expensive (~$0.04/image) — cap hard.
    rps: 1
    burst: 5
    window: "60s"
---
apiVersion: azureclaw.azure.com/v1alpha1
kind: ToolPolicy
metadata:
  name: execbrief-foundry-code-execute
  namespace: azureclaw-system
  labels:
    azureclaw.azure.com/sandbox: execbrief
spec:
  appliesTo:
    tool: foundry_code_execute
    sandboxMatchLabels:
      azureclaw.azure.com/sandbox: execbrief
  approval:
    mode: never
---
apiVersion: azureclaw.azure.com/v1alpha1
kind: ToolPolicy
metadata:
  name: execbrief-telegram-status
  namespace: azureclaw-system
  labels:
    azureclaw.azure.com/sandbox: execbrief
spec:
  appliesTo:
    tool: telegram_status
    sandboxMatchLabels:
      azureclaw.azure.com/sandbox: execbrief
  approval:
    mode: never
