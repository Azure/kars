# Protect enrolled operator stores even from an accidental write by another
# controller. An empty integration store cannot turn into a privileged key store.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-enrolled-store-shape
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: kars.azure.com/v1alpha1
    kind: KarsCredentialGrant
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    - name: explicitly-enrolled-store
      expression: >-
        (object != null && has(object.metadata.annotations) &&
          'kars.azure.com/credential-store-grant-uid' in object.metadata.annotations) ||
        (oldObject != null && has(oldObject.metadata.annotations) &&
          'kars.azure.com/credential-store-grant-uid' in oldObject.metadata.annotations)
  validations:
    - expression: >-
        params.spec.integrationStores.all(store,
          object.metadata.name != store.secret.name ||
          (object.metadata.uid == store.secret.uid && object.?type.orValue('') == 'Opaque' &&
            object.metadata.?annotations.orValue({})[?'kars.azure.com/credential-store-grant-uid'].orValue('') == params.metadata.uid &&
            [object.?data.orValue({}), object.?stringData.orValue({})].all(data, data.all(key,
              (store.purpose == 'providers' && store.secret.name == 'kars-inference-providers' &&
                (key == 'COPILOT_GITHUB_TOKEN' || key.matches('^KARS_PROVIDER_[A-Z0-9_]+_(ENDPOINT|API_KEY|TOKEN|MODELS)$'))) ||
              (store.purpose == 'foundry' && store.secret.name == 'kars-foundry-credentials' && key == 'FOUNDRY_API_KEY') ||
              (store.purpose == 'provider-default' && store.secret.name.startsWith('kars-provider-') && key == 'API_KEY') ||
              (store.purpose == 'github-app' && store.secret.name == 'kars-github-app' && key in ['GITHUB_APP_ID','GITHUB_APP_PRIVATE_KEY']) ||
              (store.purpose == 'github-connection' && store.secret.name == 'kars-github-connection' && key in ['GITHUB_TOKEN','GITHUB_OWNER','GITHUB_REPO']) ||
              (store.purpose == 'teams' && key in ['client-id','tenant-id','client-secret','entra-role-map','bff-internal-secret']) ||
              (store.purpose == 'controller-settings' && store.secret.name == 'kars-credential-controller-settings' && key == 'configuration')))))
      message: "An enrolled credential store must retain its exact UID and purpose; re-enroll replacements explicitly"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-enrolled-store-shape
spec:
  policyName: kars-credential-enrolled-store-shape
  paramRef:
    name: workspace
    parameterNotFoundAction: Allow
  validationActions: [Deny, Audit]
