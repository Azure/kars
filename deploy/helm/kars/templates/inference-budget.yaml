Governed inference only. No prices, model limits, free providers, or TLS
identities are guessed. Old/reused values without this block render no broker.
*/ -}}
{{- include "kars.inferenceBudget.tls.validate" . -}}
{{- $budget := .Values.inferenceBudget | default dict -}}
{{- if and (hasKey $budget "enabled") (not (kindIs "bool" $budget.enabled)) (not (kindIs "invalid" $budget.enabled)) -}}
{{- fail "inferenceBudget.enabled must be a boolean" -}}
{{- end -}}
{{- if and ($budget.builtInFunding | default list) (not ($budget.enabled | default false)) -}}
{{- fail "inferenceBudget.builtInFunding requires inferenceBudget.enabled" -}}
{{- end -}}
{{- if and ($budget.tokenTopUps | default list) (not ($budget.enabled | default false)) -}}
{{- fail "inferenceBudget.tokenTopUps requires inferenceBudget.enabled" -}}
{{- end -}}
{{- if and ($budget.unboundedTokenAllowances | default list) (not ($budget.enabled | default false)) -}}
{{- fail "inferenceBudget.unboundedTokenAllowances requires inferenceBudget.enabled" -}}
{{- end -}}
{{- $calendarPolicy := "enforce" -}}
{{- if hasKey $budget "calendarPolicy" -}}
{{- if not (kindIs "string" $budget.calendarPolicy) -}}{{- fail "inferenceBudget.calendarPolicy must be enforce or record-only" -}}{{- end -}}
{{- $calendarPolicy = $budget.calendarPolicy -}}
{{- end -}}
{{- if not (has $calendarPolicy (list "enforce" "record-only")) -}}{{- fail "inferenceBudget.calendarPolicy must be enforce or record-only" -}}{{- end -}}
{{- if and (eq $calendarPolicy "record-only") (not ($budget.enabled | default false)) -}}
{{- fail "inferenceBudget.calendarPolicy record-only requires inferenceBudget.enabled" -}}
{{- end -}}
{{- if ($budget.enabled | default false) -}}
{{- $version := required "inferenceBudget.catalogVersion is required" $budget.catalogVersion -}}
{{- include "kars.inferenceBudget.contracts.validate" . -}}
{{- $contracts := $budget.contracts -}}
{{- $ca := required "inferenceBudget.caBundle is required" $budget.caBundle -}}
{{- $tls := required "inferenceBudget.tlsSecretName is required" $budget.tlsSecretName -}}
{{- $routerDigest := required "inferenceBudget.routerImageDigest is required" $budget.routerImageDigest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $routerDigest) -}}
{{- fail "inferenceBudget.routerImageDigest must be a qualified sha256 manifest digest" -}}
{{- end -}}
{{- $routerTag := .Values.inferenceRouter.image.tag | toString -}}
{{- if and (contains "@" $routerTag) (ne (last (splitList "@" $routerTag)) $routerDigest) -}}
{{- fail "inferenceBudget.routerImageDigest must match the digest pinned in inferenceRouter.image.tag; update both when upgrading a governed router" -}}
{{- end -}}
{{- if contains "PRIVATE KEY" $ca -}}{{- fail "inferenceBudget.caBundle must contain public certificates only" -}}{{- end -}}
{{- $identity := $budget.tls | default dict -}}
{{- $catalog := dict "version" $version "contracts" $contracts "nonInferenceEgressHosts" ($budget.nonInferenceEgressHosts | default list) -}}
{{- $existingCatalog := lookup "v1" "ConfigMap" .Release.Namespace "kars-inference-budget-contracts" -}}
{{- $catalogData := include "kars.inferenceBudget.catalogData" (dict "desired" $catalog "current" $existingCatalog "release" .Release.Name "namespace" .Release.Namespace) -}}
{{- $allowances := ($budget.unboundedTokenAllowances | default list) | toJson -}}
{{- if and .Release.IsUpgrade .Values.sre.firstInstallFunding.unboundedTokens -}}
{{- $source := lookup "kars.azure.com/v1alpha1" "KarsSandbox" .Release.Namespace "sre" | default dict -}}
{{- $accountName := dig "spec" "inferenceBudgetRef" "account" "name" "" $source -}}
{{- $account := dict -}}
{{- if $accountName -}}{{- $account = lookup "kars.azure.com/v1alpha1" "KarsBudgetAccount" .Release.Namespace $accountName | default dict -}}{{- end -}}
{{- $allowances = include "kars.sre.firstInstallAllowances" (dict "desired" ($budget.unboundedTokenAllowances | default list)
  "catalog" ($existingCatalog | default dict) "source" $source "account" $account "release" .Release.Name "namespace" .Release.Namespace
  "intent" (lookup "v1" "ConfigMap" .Release.Namespace "kars-sre-first-install" | default dict)
  "registration" (lookup "kars.azure.com/v1alpha1" "KarsSRERegistration" "" "canonical" | default dict)) -}}
{{- end -}}
{{- if $identity.certificate }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tls | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    kars.azure.com/inference-budget-tls: v1
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: inference-budget
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $identity.certificate | b64enc | quote }}
  tls.key: {{ $identity.privateKey | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kars-inference-budget-contracts
  namespace: {{ .Release.Namespace }}
  annotations:
    kars.azure.com/inference-budget-contracts: v1
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: inference-budget
data:
  {{- if .Values.sre.firstInstallFunding }}
  first-install-sre-intent: kars-sre-first-install
  {{- end }}
  calendar-policy: {{ $calendarPolicy | quote }}
  built-in-funding.json: {{ ($budget.builtInFunding | default list) | toJson | quote }}
  token-top-ups.json: {{ ($budget.tokenTopUps | default list) | toJson | quote }}
  unbounded-token-allowances.json: {{ $allowances | quote }}
  contracts.json: {{ $catalogData | quote }}
  ca.crt: |
    {{- $ca | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kars-inference-budget
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: controller
  ports:
    - name: budget-tls
      port: 9447
      targetPort: 9447
      protocol: TCP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kars-inference-budget-store
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["kars.azure.com"]
    resources: ["karsbudgetaccounts", "karsbudgetaccounts/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $tls | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kars-inference-budget-store
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kars-inference-budget-store
subjects:
  - kind: ServiceAccount
    name: kars-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kars-inference-budget-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kars-inference-budget-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kars-inference-budget-reviewer
subjects:
  - kind: ServiceAccount
    name: kars-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
