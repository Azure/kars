apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-namespace-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: restricted-adapter
      expression: >-
        authorizer.group('kars.azure.com').resource('karscredentialgrants').name('workspace').check('bridge-adapter').allowed() &&
        !authorizer.group('kars.azure.com').resource('karscredentialgrants').name('workspace').check('project-credentials').allowed() &&
        !authorizer.group('kars.azure.com').resource('karscredentialgrants').name('workspace').check('manage').allowed()
  validations:
    - expression: "request.operation == 'CREATE' && object.metadata.name == 'kars-local-inference'"
      message: "Bridge may only create its dedicated local-inference namespace; core owns agent namespace lifecycle"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-namespace-boundary
spec:
  policyName: kars-credential-namespace-boundary
  validationActions: [Deny, Audit]
