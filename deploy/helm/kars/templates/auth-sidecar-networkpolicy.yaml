{{- /*
NetworkPolicy gating ingress to the shared auth-sidecar.

Trust-boundary control: **only pods labeled
`kars.azure.com/component=inference-router`** may reach the sidecar
Service. Agent code runs in a different container (UID 1000) inside
the same sandbox pod; the egress-guard's iptables baseline already
prevents UID 1000 from sending TCP traffic outbound, and even if it
escaped that, the NetworkPolicy ingress selector matches POD labels,
not container UIDs — every sandbox pod IS labeled inference-router-
component because the router IS one of its containers. The trust
boundary is therefore "pods whose inference-router container holds
the right PINNED_AGENT_IDENTITY_APP_ID env value."

This is the architectural trade-off vs. the per-pod sidecar model:
trust expands from pod-local (iptables UID isolation) to namespace-
scoped (NetworkPolicy ingress selector + env-var-based identity
pinning). Acceptable per Microsoft's documentation: the
`?AgentIdentity=<appId>` parameter ON THE SIDECAR CALL itself
identifies which child identity to mint for, so a malicious sandbox
trying to acquire tokens for a different sandbox's identity would
need to fabricate that appId on the wire — and the inference-
router's `PINNED_AGENT_IDENTITY_APP_ID` env (immutable post-pod-
create) is what the router actually passes.

Conditionally rendered: only when `.Values.entraSidecar.enabled` AND
the cluster has NetworkPolicy support (every CNI we support does).
*/}}
{{- if .Values.entraSidecar.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entra-auth-sidecar-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: entra-auth-sidecar
    app.kubernetes.io/managed-by: helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kars
      app.kubernetes.io/component: entra-auth-sidecar
  policyTypes:
    - Ingress
  ingress:
    # Allow inbound from any sandbox namespace's inference-router pod.
    # The sandbox namespaces are stamped with the same project label
    # by the controller (see reconciler/mod.rs:create_namespace).
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: kars
              app.kubernetes.io/component: sandbox
          podSelector:
            matchLabels:
              kars.azure.com/component: inference-router
      ports:
        - port: 5000
          protocol: TCP
    # Also allow inbound from the operator namespace itself (e.g. for
    # kars CLI verify-trust health probes via kubectl exec curl).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: 5000
          protocol: TCP
{{- end }}
