apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karscredentialgrants.kars.azure.com
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: kars.azure.com
  scope: Namespaced
  names:
    kind: KarsCredentialGrant
    plural: karscredentialgrants
    singular: karscredentialgrant
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [workspaceUid, writers]
              properties:
                workspaceUid: {type: string, minLength: 1}
                enabled: {type: boolean, default: true}
                observationTargets:
                  type: array
                  default: []
                  maxItems: 128
                  items:
                    {{- include "kars.credentialTargetSchema" . | nindent 20 }}
                controller:
                  {{- include "kars.credentialIdentitySchema" . | nindent 18 }}
                githubConnections:
                  type: array
                  default: []
                  maxItems: 32
                  items:
                    type: object
                    required: [connection, appSecret, appId, ownerSubject, installationId, repositories]
                    properties:
                      connection:
                        {{- include "kars.credentialIdentitySchema" . | nindent 24 }}
                      appSecret:
                        {{- include "kars.credentialIdentitySchema" . | nindent 24 }}
                      appId: {type: string, maxLength: 20, pattern: '^[0-9]+$'}
                      ownerSubject: {type: string, minLength: 1, maxLength: 512}
                      installationId: {type: integer, format: int64, minimum: 1}
                      repositories:
                        type: array
                        minItems: 1
                        maxItems: 32
                        x-kubernetes-list-type: set
                        items: {type: string, maxLength: 140, pattern: '^[a-z0-9._-]{1,39}/[a-z0-9._-]{1,100}$'}
                      write: {type: boolean, default: false}
                bridgeConsumers:
                  type: object
                  required: [bff, gateway]
                  properties:
                    bff:
                      {{- include "kars.credentialIdentitySchema" . | nindent 22 }}
                    gateway:
                      {{- include "kars.credentialIdentitySchema" . | nindent 22 }}
                    gatewayReplicas: {type: integer, minimum: 1, maximum: 5, default: 1}
                legacyImports:
                  type: array
                  default: []
                  maxItems: 128
                  items:
                    {{- include "kars.credentialLegacySchema" . | nindent 20 }}
                writers:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [namespace, name, uid]
                    properties:
                      namespace: {type: string, minLength: 1}
                      name: {type: string, minLength: 1}
                      uid: {type: string, minLength: 1}
                agentKeys:
                  type: array
                  maxItems: 128
                  default: []
                  items: {type: string, pattern: '^[A-Z_][A-Z0-9_]{0,127}$'}
                integrationStores:
                  type: array
                  maxItems: 32
                  default: []
                  items:
                    type: object
                    required: [secret, purpose]
                    properties:
                      secret:
                        {{- include "kars.credentialIdentitySchema" . | nindent 24 }}
                      purpose:
                        type: string
                        enum: [providers, foundry, provider-default, github-app, github-connection, teams, controller-settings]
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                phase: {type: string}
                reason: {type: string}
                integrationError: {type: string}
                integrationRevision: {type: string}
                legacySources:
                  type: array
                  items:
                    {{- include "kars.credentialLegacySchema" . | nindent 20 }}
                sources:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      uid: {type: string}
                      resourceVersion: {type: string}
                      phase: {type: string}
                      reason: {type: string}
                      keys:
                        type: array
                        items: {type: string}
                      target:
                        {{- include "kars.credentialTargetSchema" . | nindent 24 }}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
