apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karssreregistrations.kars.azure.com
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: kars.azure.com
  scope: Cluster
  names:
    kind: KarsSRERegistration
    plural: karssreregistrations
    singular: karssreregistration
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: "self.metadata.name == 'canonical'"
              message: "The canonical SRE registration is the only supported instance"
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [controller, sandbox, runtimeNamespace]
              properties:
                enabled: {type: boolean, default: true}
                controller:
                  type: object
                  required: [namespace, deployment, release]
                  properties:
                    namespace:
                      type: object
                      required: [name, uid]
                      properties:
                        name: {type: string, minLength: 1}
                        uid: {type: string, minLength: 1}
                    deployment:
                      type: object
                      required: [name, uid]
                      properties:
                        name: {type: string, enum: [kars-controller]}
                        uid: {type: string, minLength: 1}
                    release: {type: string, minLength: 1, maxLength: 53}
                sandbox:
                  type: object
                  required: [namespace, name, uid]
                  properties:
                    namespace: {type: string, minLength: 1}
                    name: {type: string, enum: [sre]}
                    uid: {type: string, minLength: 1}
                runtimeNamespace:
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, enum: [kars-sre]}
                    uid: {type: string, minLength: 1}
                firstInstallFunding:
                  type: object
                  required: [intent, grant]
                  properties:
                    intent:
                      type: object
                      required: [name, uid, digest]
                      properties:
                        name: {type: string, enum: [kars-sre-first-install]}
                        uid: {type: string, minLength: 1, maxLength: 128}
                        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
                    grant:
                      type: object
                      required: [root, limits]
                      x-kubernetes-validations:
                        - rule: "has(self.unboundedTokens) ? self.unboundedTokens && !has(self.limits.tokens) && !has(self.expiresAt) : has(self.limits.tokens) && has(self.expiresAt)"
                          message: "Choose explicit unbounded tokens without expiry, or finite tokens with expiry"
                      properties:
                        unboundedTokens: {type: boolean}
                        root:
                          type: object
                          required: [kind, resource, workspaceUid, clusterUid]
                          properties:
                            kind: {type: string, enum: [KarsSandbox]}
                            workspaceUid: {type: string, minLength: 1, maxLength: 128}
                            clusterUid: {type: string, minLength: 1, maxLength: 128}
                            resource:
                              type: object
                              required: [namespace, name, uid]
                              properties:
                                namespace: {type: string, minLength: 1, maxLength: 63}
                                name: {type: string, enum: [sre]}
                                uid: {type: string, minLength: 1, maxLength: 128}
                        limits:
                          type: object
                          properties:
                            tokens: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
                        expiresAt: {type: string, format: date-time}
                legacyConsumer:
                  type: object
                  required: [namespace, name, uid, resourceVersion]
                  properties:
                    namespace: {type: string, enum: [kars-sre]}
                    name: {type: string, enum: [sre]}
                    uid: {type: string, minLength: 1}
                    resourceVersion: {type: string, minLength: 1}
                legacyBindings:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [kind, name, uid, resourceVersion, roleRef, subjects]
                    properties:
                      kind: {type: string, enum: [ClusterRoleBinding, RoleBinding]}
                      namespace: {type: string}
                      name: {type: string, minLength: 1}
                      uid: {type: string, minLength: 1}
                      resourceVersion: {type: string, minLength: 1}
                      roleRef:
                        type: object
                        required: [apiGroup, kind, name]
                        properties:
                          apiGroup: {type: string, enum: [rbac.authorization.k8s.io]}
                          kind: {type: string, enum: [Role, ClusterRole]}
                          name: {type: string, minLength: 1}
                      subjects:
                        type: array
                        items:
                          type: object
                          required: [kind, name]
                          properties:
                            apiGroup: {type: string}
                            kind: {type: string}
                            name: {type: string}
                            namespace: {type: string}
              x-kubernetes-validations:
                - rule: "self.sandbox.__namespace__ == self.controller.__namespace__.name"
                  message: "SRE must be registered in its controller/release namespace"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      lastTransitionTime: {type: string, format: date-time}
                phase: {type: string}
                observedGeneration: {type: integer, format: int64}
                privacyEpoch: {type: string}
                routerServiceAccountUid: {type: string}
                legacySecretAccessDenied: {type: boolean}
                privacyRevision: {type: string}
                detail: {type: string}
