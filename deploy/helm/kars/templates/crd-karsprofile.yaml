---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karsprofiles.kars.azure.com
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: crd
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: KarsProfile
    plural: karsprofiles
    shortNames:
    - cprofile
    singular: karsprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.templateDigest
      name: Digest
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KarsProfileSpec via `CustomResource`
        properties:
          spec:
            description: '`KarsProfile.spec` — a vetted, admission-gated team template.'
            properties:
              charterTemplate:
                description: |-
                  The charter template — the standing mandate a team instantiated from this
                  profile adopts (when the team doesn't override it).
                type: string
              defaultEnvelope:
                description: The default trust envelope a team instantiated from this profile adopts.
                properties:
                  authorityCeiling:
                    description: |-
                      The maximum autonomy tier any *descendant* task may hold. Must be in
                      `1..5` and `<= tier` — a task can never authorize a child to act with
                      more authority than it holds itself.
                    format: int32
                    type: integer
                  budget:
                    description: Optional resource budget for the whole task subtree.
                    nullable: true
                    properties:
                      tokens:
                        description: |-
                          Maximum total tokens the task subtree may consume. `0`/absent means
                          "no token cap declared" (governance still applies at the router).
                        format: int64
                        nullable: true
                        type: integer
                      usdMicros:
                        description: |-
                          Maximum total spend in micro-USD (1e-6 USD) for the task subtree.
                          Integer micro-USD avoids floating-point in an audit-bound field.
                        format: int64
                        nullable: true
                        type: integer
                    type: object
                  delegationDepth:
                    default: 0
                    description: |-
                      Remaining number of delegation hops this task may still spawn. A child
                      task is minted with `delegationDepth = parent.delegationDepth - 1`;
                      at `0` no further delegation is permitted. Must be `>= 0`.
                    format: int32
                    type: integer
                  egressAllowlistRef:
                    description: |-
                      Optional reference to a same-namespace `EgressAllowlist`-style CR that
                      bounds the network destinations this task (and its descendants) may
                      reach through the inference router.
                    nullable: true
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  tier:
                    description: Autonomy tier (1..5). See the module docs for the taxonomy.
                    format: int32
                    type: integer
                  toolPolicyRef:
                    description: |-
                      Optional reference to a same-namespace `ToolPolicy` CR that bounds
                      which tools/MCP servers this task (and its descendants) may call.
                    nullable: true
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - authorityCeiling
                - tier
                type: object
              displayName:
                nullable: true
                type: string
              domain:
                description: |-
                  The domain this profile vets a team for (e.g. `finance`, `eng`, `docs`,
                  `soc`, `legal`). Surfaced verbatim; domain-blind platform, domain in the
                  profile.
                type: string
              knowledgeCommons:
                description: The knowledge-commons name the team should use.
                nullable: true
                type: string
              roles:
                description: |-
                  The roster template — the roles a team instantiated from this profile
                  gets, each with its skills.
                items:
                  description: A role in the profile's roster template.
                  properties:
                    name:
                      description: Role name (becomes the member task suffix when instantiated).
                      type: string
                    skills:
                      description: Skills (KarsSkill names) this role should hold.
                      items:
                        type: string
                      type: array
                    systemPrompt:
                      description: The role's standing instructions (its system prompt).
                      nullable: true
                      type: string
                  required:
                  - name
                  type: object
                type: array
              toolPolicy:
                description: The default bounding tool policy for the team's members.
                nullable: true
                type: string
            required:
            - charterTemplate
            - defaultEnvelope
            - domain
            type: object
            x-kubernetes-validations:
            - message: spec.charterTemplate must be non-empty
              reason: FieldValueInvalid
              rule: size(self.charterTemplate) > 0
            - message: spec.domain must be non-empty
              reason: FieldValueInvalid
              rule: size(self.domain) > 0
          status:
            description: '`KarsProfile.status` — controller-owned.'
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                nullable: true
                type: array
              detail:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                description: '`Ready` (validated, instantiable) | `Degraded` (invalid).'
                nullable: true
                type: string
              roleCount:
                format: int64
                nullable: true
                type: integer
              templateDigest:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: KarsProfile
        type: object
    served: true
    storage: true
    subresources:
      status: {}
