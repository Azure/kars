# Unbound: an operator explicitly delegates workspace credential administration.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kars-credential-grant-operator
rules:
  - apiGroups: ["kars.azure.com"]
    resources: ["karscredentialgrants"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete", "manage"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kars-credential-grant-controller
rules:
  - apiGroups: ["kars.azure.com"]
    resources: ["karscredentialgrants"]
    verbs: ["get", "list", "watch", "patch", "project-credentials", "use-agent-credentials"]
  - apiGroups: ["kars.azure.com"]
    resources: ["karscredentialgrants/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "namespaces"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["selfsubjectreviews"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kars-credential-grant-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kars-credential-grant-controller
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: kars-controller
