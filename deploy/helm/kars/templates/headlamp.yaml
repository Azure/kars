{{- $headlamp := .Values.headlamp | default dict }}
{{- if and (hasKey $headlamp "oidc") (not (kindIs "map" $headlamp.oidc)) }}
{{- fail "headlamp.oidc must be a map" }}
{{- end }}
{{- $oidc := $headlamp.oidc | default dict }}
{{- if and (hasKey $oidc "clientSecret") (not (kindIs "map" $oidc.clientSecret)) }}
{{- fail "headlamp.oidc.clientSecret must be a map" }}
{{- end }}
{{- $secret := $oidc.clientSecret | default dict }}
{{- range $field := list "name" "sourceName" "key" }}
{{- if and (hasKey $secret $field) (not (kindIs "string" (get $secret $field))) }}
{{- fail (printf "headlamp.oidc.clientSecret.%s must be a string" $field) }}
{{- end }}
{{- end }}
{{- range $field := list "caConfigMap" "caSourceConfigMap" }}
{{- if and (hasKey $oidc $field) (not (kindIs "string" (get $oidc $field))) }}
{{- fail (printf "headlamp.oidc.%s must be a string" $field) }}
{{- end }}
{{- end }}
{{- if and (or $secret.sourceName $oidc.caSourceConfigMap) (or (not $headlamp.enabled) (not $oidc.enabled)) }}
{{- fail "Headlamp OIDC projection requires headlamp.enabled and headlamp.oidc.enabled" }}
{{- end }}
{{- if $headlamp.enabled }}
{{- $oidcPort := 443 }}
{{- if and (hasKey $oidc "enabled") (not (kindIs "bool" $oidc.enabled)) }}
{{- fail "headlamp.oidc.enabled must be a boolean" }}
{{- end }}
{{- if $oidc.enabled }}
{{- $issuerURL := required "headlamp.oidc.issuerURL is required" $oidc.issuerURL }}
{{- if not (regexMatch "^https://[^/?#@[:space:]]+(/[^?#[:space:]]*)?$" $issuerURL) }}
{{- fail "headlamp.oidc.issuerURL must be an HTTPS issuer without credentials, query or fragment" }}
{{- end }}
{{- $issuer := urlParse $issuerURL }}
{{- $port := regexFind ":[0-9]+$" $issuer.host | trimPrefix ":" }}
{{- if $port }}{{- $oidcPort = int $port }}{{- end }}
{{- if or (lt $oidcPort 1) (gt $oidcPort 65535) }}
{{- fail "headlamp.oidc.issuerURL port must be between 1 and 65535" }}
{{- end }}
{{- if not (trim (required "headlamp.oidc.clientID is required" $oidc.clientID)) }}
{{- fail "headlamp.oidc.clientID must not be blank" }}
{{- end }}
{{- if not (and $secret.name $secret.key) }}
{{- fail "headlamp.oidc.clientSecret.name and key must reference a Secret in headlamp" }}
{{- end }}
{{- range $field, $name := dict "clientSecret.name" $secret.name "clientSecret.sourceName" ($secret.sourceName | default "") "caConfigMap" ($oidc.caConfigMap | default "") "caSourceConfigMap" ($oidc.caSourceConfigMap | default "") }}
{{- if and $name (or (gt (len $name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $name))) }}
{{- fail (printf "headlamp.oidc.%s must be a Kubernetes object name" $field) }}
{{- end }}
{{- end }}
{{- if or (gt (len $secret.key) 253) (not (regexMatch "^[-._a-zA-Z0-9]+$" $secret.key)) }}
{{- fail "headlamp.oidc.clientSecret.key must be a Kubernetes Secret data key" }}
{{- end }}
{{- if and $oidc.caSourceConfigMap (not $oidc.caConfigMap) }}
{{- fail "headlamp.oidc.caConfigMap is required for CA projection" }}
{{- end }}
{{- $callback := required "headlamp.oidc.callbackURL is required" $oidc.callbackURL }}
{{- if not (regexMatch "^(https://[^/?#@[:space:]]+|http://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?)/oidc-callback$" $callback) }}
{{- fail "headlamp.oidc.callbackURL must be an HTTPS /oidc-callback URL (HTTP only on loopback)" }}
{{- end }}
{{- end }}
{{- $ownerID := printf "%s/%s" .Release.Namespace .Release.Name }}
{{- range $resource := list (dict "api" "v1" "kind" "Namespace" "namespace" "") (dict "api" "apps/v1" "kind" "Deployment" "namespace" "headlamp") }}
{{- $existing := lookup $resource.api $resource.kind $resource.namespace "headlamp" }}
{{- if $existing }}
{{- $annotations := $existing.metadata.annotations | default dict }}
{{- $marker := get $annotations "kars.azure.com/headlamp-owner" }}
{{- $release := get $annotations "meta.helm.sh/release-name" }}
{{- $namespace := get $annotations "meta.helm.sh/release-namespace" }}
{{- $helmOwned := and (eq $release $.Release.Name) (eq $namespace $.Release.Namespace) }}
{{- if not (and (or (eq $marker $ownerID) $helmOwned) (or (not $marker) (eq $marker $ownerID)) (or (not (or $release $namespace)) $helmOwned)) }}
{{- fail "Headlamp exists outside this Core installation; set headlamp.enabled=false to keep it external instead of adopting it" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    app.kubernetes.io/name: kars-headlamp
  annotations:
    helm.sh/resource-policy: keep
    kars.azure.com/headlamp-owner: {{ $ownerID | quote }}
{{- range $projection := list (dict "kind" "Secret" "source" ($secret.sourceName | default "") "target" $secret.name "key" $secret.key) (dict "kind" "ConfigMap" "source" ($oidc.caSourceConfigMap | default "") "target" $oidc.caConfigMap "key" "ca.crt") }}
{{- if $projection.source }}
{{- if and (eq $.Release.Namespace "headlamp") (eq $projection.source $projection.target) }}
{{- fail "Headlamp OIDC projection source and destination must be distinct objects" }}
{{- end }}
{{- $existing := lookup "v1" $projection.kind "headlamp" $projection.target }}
{{- if $existing }}
{{- $annotations := $existing.metadata.annotations | default dict }}
{{- $labels := $existing.metadata.labels | default dict }}
{{- if or $existing.metadata.deletionTimestamp (ne (get $labels "app.kubernetes.io/managed-by") $.Release.Service) (ne (get $annotations "meta.helm.sh/release-name") $.Release.Name) (ne (get $annotations "meta.helm.sh/release-namespace") $.Release.Namespace) }}
{{- fail "Headlamp OIDC projection destination ownership conflict; cannot adopt an unrelated or terminating object" }}
{{- end }}
{{- end }}
{{- $source := lookup "v1" $projection.kind $.Release.Namespace $projection.source }}
{{- if or (not $source) $source.metadata.deletionTimestamp }}
{{- fail "Headlamp OIDC projection requires an existing non-terminating source in the Core release namespace" }}
{{- end }}
{{- if or (ne $source.kind $projection.kind) (not (kindIs "map" $source.data)) }}
{{- fail "Headlamp OIDC projection source must contain the selected data key" }}
{{- end }}
{{- $data := get $source.data $projection.key }}
{{- if not (kindIs "string" $data) }}
{{- fail "Headlamp OIDC projection source data must be a nonempty string" }}
{{- end }}
{{- if eq $projection.kind "Secret" }}
{{- if or (not (kindIs "string" $source.type)) (ne $source.type "Opaque") (not (trim (b64dec $data))) (ne (b64enc (b64dec $data)) $data) }}
{{- fail "Headlamp OIDC projection requires an Opaque source Secret with nonempty base64 data at the selected key" }}
{{- end }}
{{- else }}
{{- if not (regexMatch "^([[:space:]]*-----BEGIN CERTIFICATE-----[[:space:]]+[A-Za-z0-9+/=\\r\\n]+-----END CERTIFICATE-----[[:space:]]*)+$" $data) }}
{{- fail "Headlamp OIDC projection source ca.crt must contain public PEM certificates only" }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: {{ $projection.kind }}
metadata:
  name: {{ $projection.target | quote }}
  namespace: headlamp
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace | quote }}
{{- if eq $projection.kind "Secret" }}
type: Opaque
{{- end }}
data:
  {{ $projection.key | quote }}: {{ $data | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: kars
  annotations:
    kars.azure.com/headlamp-plugin: bundled
    kars.azure.com/headlamp-owner: {{ $ownerID | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/part-of: kars
    spec:
      serviceAccountName: headlamp
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.headlamp.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.headlamp.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: headlamp
          image: "{{ .Values.headlamp.image.repository }}:{{ .Values.headlamp.image.tag }}"
          imagePullPolicy: {{ .Values.headlamp.image.pullPolicy }}
          args:
            - -html-static-dir=/headlamp/frontend
            - -plugins-dir=/headlamp/plugins
            - -in-cluster
            - -in-cluster-context-name=main
            - -session-ttl=3600
          {{- if $oidc.enabled }}
          env:
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_ID
              value: {{ $oidc.clientID | quote }}
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.clientSecret.name | quote }}
                  key: {{ $oidc.clientSecret.key | quote }}
            - name: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL
              value: {{ $oidc.issuerURL | quote }}
            - name: HEADLAMP_CONFIG_OIDC_CALLBACK_URL
              value: {{ $oidc.callbackURL | quote }}
            - name: HEADLAMP_CONFIG_OIDC_SCOPES
              value: {{ $oidc.scopes | default "profile,email" | quote }}
            - name: HEADLAMP_CONFIG_OIDC_USE_PKCE
              value: "true"
            - name: HEADLAMP_CONFIG_OIDC_SKIP_TLS_VERIFY
              value: "false"
            {{- if $oidc.caConfigMap }}
            - name: HEADLAMP_CONFIG_OIDC_CA_FILE
              value: /etc/headlamp/oidc/ca.crt
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4466
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.headlamp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and $oidc.enabled $oidc.caConfigMap }}
            - name: oidc-ca
              mountPath: /etc/headlamp/oidc
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if and $oidc.enabled $oidc.caConfigMap }}
        - name: oidc-ca
          configMap:
            name: {{ $oidc.caConfigMap | quote }}
            defaultMode: 292
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- with .Values.headlamp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.headlamp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kars-headlamp
  namespace: headlamp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 4466
  egress:
    {{- with $oidc.localDexNamespace }}
    {{- if or (ne . "kars-local-idp") (ne $.Values.global.installationProfile "kind-beta") }}
    {{- fail "headlamp.oidc.localDexNamespace is reserved for the Kind beta local IdP" }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
          podSelector:
            matchLabels:
              app: dex
      ports:
        - protocol: TCP
          port: 5557
    {{- end }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        {{- if and $oidc.enabled (ne $oidcPort 443) (ne $oidcPort 6443) }}
        - protocol: TCP
          port: {{ $oidcPort }}
        {{- end }}
{{- end }}
