# These guards apply only to identities enrolled by the controller. DELETE
# remains allowed: the core revokes owned read Roles, proves their absence, then
# removes the guard. Namespace /finalize cannot bypass a pending name hold.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-reader-continuity
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["serviceaccounts", "namespaces", "namespaces/status", "namespaces/finalize"]
  variables:
    - name: prefix
      expression: "'kars.azure.com/credential-reader-'"
    - name: before
      expression: "oldObject == null ? {} : oldObject.metadata.?annotations.orValue({})"
    - name: after
      expression: "object == null ? variables.before : object.metadata.?annotations.orValue({})"
    - name: keys
      expression: >-
        variables.before.filter(key, key.startsWith(variables.prefix)) +
        variables.after.filter(key, key.startsWith(variables.prefix))
    - name: controller
      expression: >-
        request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:kars-controller' &&
        has(request.userInfo.uid) && request.userInfo.uid != '' &&
        authorizer.group('kars.azure.com').resource('karscredentialgrants').name('workspace')
          .check('project-credentials').allowed()
  validations:
    - expression: >-
        variables.keys.all(key,
          (variables.controller && request.userInfo.uid ==
            (key in variables.before ? variables.before[key] : variables.after[key])) ||
          (key in variables.before && key in variables.after &&
            variables.before[key] == variables.after[key] &&
            (object == null ||
              (key in object.metadata.?finalizers.orValue([]) &&
               object.metadata.?labels.orValue({})[?key].orValue('') ==
                 oldObject.metadata.?labels.orValue({})[?key].orValue('')))))
      message: "Only the exact enrolled controller UID may change a credential identity continuity guard"
      reason: Forbidden
    - expression: >-
        object == null || object.metadata.?finalizers.orValue([]).all(key,
          !key.startsWith(variables.prefix) ||
          (key in variables.after && variables.after[key] != '' &&
            object.metadata.?labels.orValue({})[?key].orValue('') != ''))
      message: "Credential name holds require their protected controller and namespace UID markers"
    - expression: >-
        request.?subResource.orValue('') != 'finalize' || variables.keys.size() == 0
      message: "Enrolled writer namespace finalization waits for core to revoke and remove all owned read Roles"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-reader-continuity
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: kars-credential-reader-continuity
  validationActions: [Deny, Audit]
---
# A second RoleBinding using User/Group subjects must not launder a guarded
# Role into name-bound read access outside the controller's release protocol.
{{ range $kind := list "roles" "bindings" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-reader-rbac-{{ $kind }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        {{- if eq $kind "roles" }}
        resources: ["roles", "clusterroles"]
        {{- else }}
        resources: ["rolebindings", "clusterrolebindings"]
        {{- end }}
  matchConditions:
    - name: governed-reader-role-or-alias
      expression: >-
        [object, oldObject].exists(o, o != null &&
          (['kars-credential-writer-', 'kars-credential-operator-'].exists(prefix,
            o.metadata.name.startsWith(prefix))
           {{- if eq $kind "bindings" }}
           ||
           (has(o.roleRef) && ['kars-credential-writer-', 'kars-credential-operator-'].exists(prefix,
             o.roleRef.name.startsWith(prefix)))
           {{- end }}
          ))
  variables:
    - name: value
      expression: "oldObject == null ? object : oldObject"
  validations:
    - expression: >-
        request.userInfo.username == 'system:serviceaccount:{{ $.Release.Namespace }}:kars-controller' &&
        has(request.userInfo.uid) && request.userInfo.uid != '' &&
        request.userInfo.uid == variables.value.metadata.?annotations.orValue({})
          [?'kars.azure.com/credential-reader-controller-uid'].orValue('') &&
        authorizer.group('kars.azure.com').resource('karscredentialgrants')
          .name('workspace').check('project-credentials').allowed()
      message: "Only the pinned controller UID can create, alter, or alias governed credential reader Roles"
      reason: Forbidden
    - expression: >-
        object == null || oldObject == null ||
        object.metadata.?annotations.orValue({})[?'kars.azure.com/credential-reader-controller-uid'].orValue('') ==
          oldObject.metadata.?annotations.orValue({})[?'kars.azure.com/credential-reader-controller-uid'].orValue('')
      message: "Credential reader controller identity is immutable"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-reader-rbac-{{ $kind }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: kars-credential-reader-rbac-{{ $kind }}
  validationActions: [Deny, Audit]
{{ end }}
---
# Namespace storage finalization is distinct from ordinary ObjectMeta
# finalizers. Keep its native finalizer until the protected marker is released.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-namespace-retirement
  annotations:
    helm.sh/resource-policy: keep
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces", "namespaces/status", "namespaces/finalize"]
  variables:
    - name: value
      expression: "object == null ? oldObject : object"
  validations:
    - expression: >-
        !variables.value.metadata.?annotations.orValue({}).exists(key,
          key.startsWith('kars.azure.com/credential-reader-')) ||
        (has(variables.value.spec) && has(variables.value.spec.finalizers) &&
          'kubernetes' in variables.value.spec.finalizers)
      message: "A guarded writer namespace retains native Kubernetes finalization until read authority is absent"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-namespace-retirement
  annotations:
    helm.sh/resource-policy: keep
spec:
  policyName: kars-credential-namespace-retirement
  validationActions: [Deny, Audit]
