apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-grant-authority
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kars.azure.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["karscredentialgrants", "karscredentialgrants/status"]
  validations:
    - expression: >-
        authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check(request.subResource == 'status' ? 'project-credentials' : 'manage').allowed() ||
        (request.operation == 'UPDATE' && request.subResource == '' && object.spec == oldObject.spec &&
          authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
            .name('workspace').check('project-credentials').allowed())
      message: "Credential grants require explicit operator authority; controllers only publish status"
      reason: Forbidden
    - expression: "request.name == 'workspace' || (object != null && object.metadata.name == 'workspace')"
      message: "The namespace credential grant is the canonical workspace instance"
    - expression: >-
        object == null || request.subResource == 'status' ||
        object.spec.?legacyImports.orValue([]).all(review,
          authorizer.group('').resource('secrets').namespace(review.namespace).name(review.secret.name).check('get').allowed())
      message: "An operator may only authorize legacy import from Secrets they can read"
      reason: Forbidden
    - expression: >-
        object == null || request.subResource == 'status' ||
        object.spec.?githubConnections.orValue([]).all(connection,
          authorizer.group('').resource('secrets').namespace(request.namespace).name(connection.appSecret.name).check('get').allowed() &&
          authorizer.group('').resource('configmaps').namespace(request.namespace).name(connection.connection.name).check('get').allowed())
      message: "GitHub enrollment requires operator access to the exact App store and connection"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-grant-authority
spec:
  policyName: kars-credential-grant-authority
  validationActions: [Deny, Audit]
---
# This fence has NO params dependency: deletion of a grant can never turn its
# old writer Role's create permission into arbitrary Secret creation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-source-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: credential-source-or-restricted-writer
      expression: >-
        (object != null && (object.metadata.name.startsWith('kars-credential-input-') ||
          object.metadata.name.startsWith('kars-credential-bundle-'))) ||
        (oldObject != null && (oldObject.metadata.name.startsWith('kars-credential-input-') ||
          oldObject.metadata.name.startsWith('kars-credential-bundle-'))) ||
        (authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('use-agent-credentials').allowed() &&
          !authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
            .name('workspace').check('project-credentials').allowed() &&
          !authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
            .name('workspace').check('manage').allowed())
  variables:
    - name: value
      expression: "object == null ? oldObject : object"
    - name: input
      expression: "variables.value.metadata.name.startsWith('kars-credential-input-')"
    - name: bundle
      expression: "variables.value.metadata.name.startsWith('kars-credential-bundle-')"
    - name: projector
      expression: >-
        authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('project-credentials').allowed()
    - name: manager
      expression: >-
        authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('manage').allowed()
  validations:
    - expression: "request.operation == 'DELETE' || variables.value.?type.orValue('') == 'Opaque'"
      message: "Governed credential stores must be Opaque; service-account token and other Secret types are forbidden"
    - expression: >-
        variables.projector || variables.manager ||
        (request.operation == 'DELETE' && authorizer.group('').resource('secrets').check('delete').allowed()) ||
        (!variables.bundle && (request.operation != 'CREATE' || variables.input))
      message: "Credential writers may only create source inputs, never runtime bundles or arbitrary integration stores"
      reason: Forbidden
    - expression: >-
        !variables.input || request.operation == 'DELETE' ||
        (has(variables.value.metadata.annotations) &&
         variables.value.metadata.annotations['kars.azure.com/credential-purpose'] == 'agent-input-v2' &&
         variables.value.metadata.annotations['kars.azure.com/credential-workspace'] == request.namespace &&
         variables.value.metadata.annotations['kars.azure.com/credential-binding-intent'] == 'explicit-reference-v2')
      message: "Agent source purpose, workspace and explicit binding intent are required"
    - expression: >-
        !(variables.input || variables.bundle) || request.operation == 'DELETE' ||
        [variables.value.?data.orValue({}), variables.value.?stringData.orValue({})].all(data,
          data.all(key, key.matches('^[A-Z_][A-Z0-9_]{0,127}$') &&
            !key.matches('^(AGT_|AZURE_|IMDS_|KARS_|FOUNDRY_|KUBERNETES_|LD_|DYLD_|NODE_|PYTHON|BASH|ENV_|SSL_|RUST_|CARGO_|GIT_|SSH_|OPENAI_|ANTHROPIC_|GEMINI_|GOOGLE_|OLLAMA_|COPILOT_).*') &&
            !(key in ['PATH','HOME','SHELL','ENV','IFS','USER','LOGNAME','PWD','TMPDIR',
              'HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','NO_PROXY','AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN']) &&
            (key in ['TELEGRAM_BOT_TOKEN','TELEGRAM_ALLOW_FROM','SLACK_BOT_TOKEN','DISCORD_BOT_TOKEN','WHATSAPP_ENABLED',
              'BRAVE_API_KEY','TAVILY_API_KEY','EXA_API_KEY','FIRECRAWL_API_KEY','PERPLEXITY_API_KEY'] ||
             key.matches('.*(_TOKEN|_KEY|_SECRET|_PASSWORD|_PAT|_CREDENTIAL|_CREDENTIALS|_CONNECTION_STRING|_AUTH|_AUTHORIZATION)$'))))
      message: "Agent sources cannot inject provider, identity, control-plane or process-bootstrap variables"
    - expression: >-
        variables.projector || variables.manager || object == null || oldObject == null ||
        !variables.input ||
        ['kars.azure.com/credential-purpose','kars.azure.com/credential-workspace',
         'kars.azure.com/credential-target-kind','kars.azure.com/credential-target',
         'kars.azure.com/credential-grant-uid'].all(key,
            object.metadata.annotations[key] == oldObject.metadata.annotations[key])
      message: "Source writers cannot relabel or adopt another credential authority"
    - expression: >-
        variables.projector || variables.manager || object == null || !variables.input ||
        (oldObject == null ? object.metadata.?ownerReferences.orValue([]).size() == 0 :
          object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]))
      message: "Only the controller binds credential source ownership to an actual target UID"
    - expression: >-
        variables.projector || variables.manager || object == null || !variables.input ||
        (oldObject == null ?
          !('kars.azure.com/credential-import-revision' in object.metadata.annotations) :
          (!('kars.azure.com/credential-target-uid' in oldObject.metadata.annotations) ||
            oldObject.metadata.annotations['kars.azure.com/credential-target-uid'] ==
              object.metadata.annotations['kars.azure.com/credential-target-uid']) &&
          (oldObject.metadata.annotations[?'kars.azure.com/credential-import-revision'].orValue('') ==
            object.metadata.annotations[?'kars.azure.com/credential-import-revision'].orValue('')))
      message: "Source writers cannot reset captured target UIDs or legacy-import evidence"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-source-boundary
spec:
  policyName: kars-credential-source-boundary
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-source-writes
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: kars.azure.com/v1alpha1
    kind: KarsCredentialGrant
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: delegated-writer
      expression: >-
        authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('use-agent-credentials').allowed() &&
        !authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('project-credentials').allowed() &&
        !authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('manage').allowed()
  variables:
    - name: value
      expression: "object == null ? oldObject : object"
    - name: input
      expression: "variables.value.metadata.name.startsWith('kars-credential-input-')"
  validations:
    - expression: >-
        params.spec.enabled && namespaceObject.metadata.uid == params.spec.workspaceUid &&
        params.spec.writers.exists(writer, request.userInfo.uid == writer.uid &&
          request.userInfo.username == 'system:serviceaccount:' + writer.namespace + ':' + writer.name)
      message: "The actual writer and workspace UIDs must match the enabled operator grant"
      reason: Forbidden
    - expression: >-
        !variables.input ||
        (variables.value.metadata.annotations['kars.azure.com/credential-grant-uid'] == params.metadata.uid &&
         (request.operation == 'DELETE' ||
          [variables.value.?data.orValue({}), variables.value.?stringData.orValue({})].all(data,
            data.all(key, key in params.spec.agentKeys ||
              key in ['TELEGRAM_BOT_TOKEN','TELEGRAM_ALLOW_FROM','SLACK_BOT_TOKEN','DISCORD_BOT_TOKEN','WHATSAPP_ENABLED',
                'BRAVE_API_KEY','TAVILY_API_KEY','EXA_API_KEY','FIRECRAWL_API_KEY','PERPLEXITY_API_KEY']))))
      message: "Custom agent credential keys require an explicit operator grant"
    - expression: >-
        variables.input || params.spec.integrationStores.exists(store,
          store.secret.name == variables.value.metadata.name && store.secret.uid == variables.value.metadata.uid &&
          (request.operation == 'DELETE' ||
            [variables.value.?data.orValue({}), variables.value.?stringData.orValue({})].all(data, data.all(key,
              (store.purpose == 'providers' && store.secret.name == 'kars-inference-providers' &&
                (key == 'COPILOT_GITHUB_TOKEN' || key.matches('^KARS_PROVIDER_[A-Z0-9_]+_(ENDPOINT|API_KEY|TOKEN|MODELS)$'))) ||
              (store.purpose == 'foundry' && store.secret.name == 'kars-foundry-credentials' && key == 'FOUNDRY_API_KEY') ||
              (store.purpose == 'provider-default' && store.secret.name.startsWith('kars-provider-') && key == 'API_KEY') ||
              (store.purpose == 'github-app' && store.secret.name == 'kars-github-app' && key in ['GITHUB_APP_ID','GITHUB_APP_PRIVATE_KEY']) ||
              (store.purpose == 'github-connection' && store.secret.name == 'kars-github-connection' && key in ['GITHUB_TOKEN','GITHUB_OWNER','GITHUB_REPO']) ||
              (store.purpose == 'teams' && key in ['client-id','tenant-id','client-secret','entra-role-map','bff-internal-secret']) ||
              (store.purpose == 'controller-settings' && store.secret.name == 'kars-credential-controller-settings' && key == 'configuration')))))
      message: "Integration mutations require the exact enrolled Secret UID and purpose-specific keys"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-source-writes
spec:
  policyName: kars-credential-source-writes
  paramRef:
    name: workspace
    parameterNotFoundAction: Allow
  validationActions: [Deny, Audit]
---
{{ range $resource := list "karssandboxes" "karstasks" "karsteams" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-consumer-{{ $resource }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kars.azure.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: [{{ $resource | quote }}]
  matchConditions:
    - name: governed-credential-consumer
      expression: >-
        [object, oldObject].exists(o, o != null &&
          ((has(o.metadata.annotations) &&
            ['kars.azure.com/credential-bundle-uid','kars.azure.com/github-grant-uid'].exists(key, key in o.metadata.annotations)) ||
           {{- if eq $resource "karssandboxes" }}
           has(o.spec.credentialBindings) || has(o.spec.githubBinding) ||
           (has(o.spec.credentialsRef) && o.spec.credentialsRef.name.startsWith('kars-credential-bundle-'))
           {{- else }}
           (has(o.spec.blueprint) && (has(o.spec.blueprint.credentialBindings) || has(o.spec.blueprint.githubBinding)))
           {{- if eq $resource "karsteams" }}
           || o.spec.?roster.orValue([]).exists(role, has(role.blueprint) && (has(role.blueprint.credentialBindings) || has(role.blueprint.githubBinding)))
           {{- end }}
           {{- end }}
          ))
  variables:
    - name: projector
      expression: >-
        authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('project-credentials').allowed() ||
        authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('manage').allowed()
  validations:
    - expression: >-
        variables.projector ||
        authorizer.group('kars.azure.com').resource('karscredentialgrants').namespace(request.namespace)
          .name('workspace').check('use-agent-credentials').allowed()
      message: "Governed credential bindings require delegated credential authority"
      reason: Forbidden
    {{- if eq $resource "karssandboxes" }}
    - expression: >-
        variables.projector ||
        !(has(object.spec.credentialsRef) && object.spec.credentialsRef.name.startsWith('kars-credential-bundle-'))
      message: "Only the controller may select an internal credential bundle"
    - expression: >-
        variables.projector || oldObject == null ||
        !(has(oldObject.spec.credentialsRef) && oldObject.spec.credentialsRef.name.startsWith('kars-credential-bundle-')) ||
        (has(object.spec.credentialsRef) && object.spec.credentialsRef == oldObject.spec.credentialsRef)
      message: "Controller bundle bindings cannot be replaced with legacy credentials"
    {{- end }}
    - expression: >-
        variables.projector ||
        (oldObject == null ? !('kars.azure.com/credential-bundle-uid' in object.metadata.?annotations.orValue({})) :
          oldObject.metadata.?annotations.orValue({})[?'kars.azure.com/credential-bundle-uid'].orValue('') ==
          object.metadata.?annotations.orValue({})[?'kars.azure.com/credential-bundle-uid'].orValue(''))
      message: "The controller owns the captured bundle CREATE UID"
    - expression: >-
        variables.projector ||
        (oldObject == null ? !('kars.azure.com/github-grant-uid' in object.metadata.?annotations.orValue({})) :
          oldObject.metadata.?annotations.orValue({})[?'kars.azure.com/github-grant-uid'].orValue('') ==
          object.metadata.?annotations.orValue({})[?'kars.azure.com/github-grant-uid'].orValue(''))
      message: "Only the controller may change private GitHub enrollment and retirement state"
    - expression: >-
        variables.projector || oldObject == null ||
        {{- if eq $resource "karssandboxes" }}
        (!has(oldObject.spec.credentialBindings) || has(object.spec.credentialBindings))
        {{- else }}
        (!(has(oldObject.spec.blueprint) && has(oldObject.spec.blueprint.credentialBindings)) ||
          (has(object.spec.blueprint) && has(object.spec.blueprint.credentialBindings)))
        {{- end }}
      message: "Removing governed bindings must not silently reactivate legacy credentials"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-consumer-{{ $resource }}
spec:
  policyName: kars-credential-consumer-{{ $resource }}
  validationActions: [Deny, Audit]
{{ end }}
