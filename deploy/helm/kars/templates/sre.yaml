{{- $rendered := include "kars.sre.resources" . -}}
{{- $cold := and .Values.schemaHook.enabled .Values.sre.enabled -}}
{{- $intentName := "kars-sre-first-install" -}}
{{- $prior := dict -}}
{{- if .Release.IsUpgrade -}}
{{- $prior = lookup "v1" "ConfigMap" .Release.Namespace $intentName | default dict -}}
{{- end -}}
{{- if and $prior $cold -}}
{{- fail "An existing first-install SRE intent requires schemaHook.enabled=false for ordinary upgrades" -}}
{{- end -}}
{{- $custom := list -}}
{{- $ordinary := list -}}
{{- range splitList "\n---" $rendered -}}
{{- $object := fromYaml . -}}
{{- if $object.kind -}}
{{- if eq $object.apiVersion "kars.azure.com/v1alpha1" -}}
{{- if eq $object.kind "KarsSandbox" -}}
{{- if or $cold $prior -}}
{{- $_ := set $object.metadata "annotations" (mergeOverwrite (default dict $object.metadata.annotations) (dict "kars.azure.com/sre-first-install-intent" $intentName)) -}}
{{- end -}}
{{- end -}}
{{- $custom = append $custom $object -}}
{{- else -}}{{- $ordinary = append $ordinary $object -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- if $cold -}}
{{- if hasKey (.Values.metricsServer | default dict) "hostAliasesBaseline" -}}
{{- fail "Cold SRE cannot use upgrade-only metricsServer.hostAliasesBaseline; omit the previous node address baseline" -}}
{{- end -}}
{{- if or (hasKey .Values.sre "routerImageBaseline") (hasKey .Values.sre "runtimeImageBaseline") (hasKey (.Values.missionDispatcher | default dict) "imageBaseline") -}}
{{- fail "Cold SRE cannot use upgrade-only image baselines; omit sre.routerImageBaseline, sre.runtimeImageBaseline and missionDispatcher.imageBaseline without changing the selected images" -}}
{{- end -}}
{{- $funding := required "Cold SRE requires explicit sre.firstInstallFunding" .Values.sre.firstInstallFunding -}}
{{- if or (not .Values.inferenceBudget.enabled) .Values.sre.authorityStage (ne (len $custom) 3) -}}
{{- fail "Cold SRE requires the governed broker and fresh source, inference and tool policies" -}}
{{- end -}}
{{- if hasKey $funding "unboundedTokens" -}}
{{- if or (ne (toJson $funding.unboundedTokens) "true") (ne (len $funding) 1) -}}
{{- fail "Unbounded first-install funding requires exactly unboundedTokens: true, without tokens or expiry" -}}
{{- end -}}
{{- else if or (not (regexMatch "^[1-9][0-9]*$" (toJson $funding.tokens))) (gt (float64 $funding.tokens) 9007199254740991.0) (ne (len $funding) 2) (not (regexMatch "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$" ($funding.expiresAt | default ""))) -}}
{{- fail "sre.firstInstallFunding requires positive safe-integer tokens and an explicit UTC expiresAt" -}}
{{- end -}}
{{- if or (not (regexMatch "^sha256:[a-f0-9]{64}$" (.Values.controller.image.digest | default "")))
  (not (regexMatch "@sha256:[a-f0-9]{64}$" (.Values.runtimes.hermes.image | default "")))
  (not (regexMatch "^latest@sha256:[a-f0-9]{64}$" (.Values.inferenceRouter.image.tag | toString))) -}}
{{- fail "Cold SRE requires approved immutable controller.image.digest, runtimes.hermes.image and inferenceRouter.image.tag" -}}
{{- end -}}
{{- if or .Values.inferenceBudget.builtInFunding .Values.inferenceBudget.tokenTopUps .Values.inferenceBudget.unboundedTokenAllowances -}}
{{- fail "Cold SRE cannot reuse existing UID-bound funding; omit inferenceBudget.builtInFunding, inferenceBudget.tokenTopUps and inferenceBudget.unboundedTokenAllowances or supply empty lists" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $intentName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
immutable: true
data:
  intent.json: {{ dict "version" 1 "release" .Release.Name "namespace" .Release.Namespace "resources" $custom "funding" $funding "budget" (omit .Values.inferenceBudget "tls" "builtInFunding") "valuesDigest" (.Values | toJson | sha256sum) | toJson | quote }}
---
{{- else if $prior -}}
{{- $registration := lookup "kars.azure.com/v1alpha1" "KarsSRERegistration" "" "canonical" | default dict -}}
{{- $source := lookup "kars.azure.com/v1alpha1" "KarsSandbox" .Release.Namespace "sre" | default dict -}}
{{- $receipt := dict -}}
{{- $adoptionName := "kars-sre-helm-adoption" -}}
{{- $budgetTls := dict -}}
{{- if .Values.inferenceBudget.tlsSecretName -}}
{{- $budgetTls = lookup "v1" "Secret" .Release.Namespace .Values.inferenceBudget.tlsSecretName | default dict -}}
{{- end -}}
{{- $workspace := lookup "v1" "Namespace" "" .Release.Namespace | default dict -}}
{{- $privateConsumers := dict -}}
{{- $privateNamespaces := dict -}}
{{- $sealedIntent := index $prior.data "intent.json" | mustFromJson -}}
{{- if and (eq (dig "metadata" "annotations" "kars.azure.com/private-state" "" $workspace) "Pending")
  (dig "metadata" "annotations" "kars.azure.com/private-core-publication" "" $workspace) -}}
{{- range $scope := (lookup "v1" "Namespace" "" "").items -}}
{{- if eq (dig "metadata" "annotations" "kars.azure.com/private-root-namespace-uid" "" $scope) $workspace.metadata.uid -}}
{{- $_ := set $privateNamespaces $scope.metadata.name $scope -}}
{{- range (lookup "apps/v1" "Deployment" $scope.metadata.name "").items -}}
{{- $id := printf "Deployment/%s" .metadata.name -}}
{{- if ne $scope.metadata.name $.Release.Namespace -}}{{- $id = printf "%s/%s" $scope.metadata.name $id -}}{{- end -}}
{{- $_ := set $privateConsumers $id . -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (eq (dig "metadata" "annotations" "kars.azure.com/private-state" "" $workspace) "Qualified")
  (or (eq (toJson .Values.controller.replicas) "0") (ne (.Values.inferenceBudget.caBundle | default "") ($sealedIntent.budget.caBundle | default ""))) -}}
{{- $proof := dig "metadata" "annotations" "kars.azure.com/private-root-retirement" "" $workspace | mustFromJson -}}
{{- range $scope := $proof.activation.namespaces -}}
{{- if or (not (kindIs "string" $scope.namespace.name)) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $scope.namespace.name)) (gt (len $scope.namespace.name) 63) -}}
{{- fail "Private Core continuity namespace name is invalid" -}}
{{- end -}}
{{- $_ := set $privateNamespaces $scope.namespace.name (lookup "v1" "Namespace" "" $scope.namespace.name | default dict) -}}
{{- range $consumer := $scope.consumers -}}
{{- $api := include "kars.sre.privateConsumerApi" $consumer.kind -}}
{{- if or (not (kindIs "string" $consumer.object.name)) (not (regexMatch "^[a-z0-9][a-z0-9.-]*$" $consumer.object.name)) (gt (len $consumer.object.name) 253) -}}
{{- fail "Private Core continuity consumer name is invalid" -}}
{{- end -}}
{{- $id := printf "%s/%s" $consumer.kind $consumer.object.name -}}
{{- if ne $scope.namespace.name $.Release.Namespace -}}{{- $id = printf "%s/%s" $scope.namespace.name $id -}}{{- end -}}
{{- $_ := set $privateConsumers $id (lookup $api $consumer.kind $scope.namespace.name $consumer.object.name | default dict) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $metricsNodes := dict -}}
{{- if hasKey (.Values.metricsServer | default dict) "hostAliasesBaseline" -}}
{{- range (lookup "v1" "Node" "" "").items -}}
{{- $_ := set $metricsNodes .metadata.name . -}}
{{- end -}}
{{- end -}}
{{- include "kars.sre.firstInstallTransition" (dict "root" . "intentMap" $prior "registration" $registration "source" $source "resources" $custom "metricsNodes" $metricsNodes
  "receipt" $receipt "privateConsumers" $privateConsumers "privateNamespaces" $privateNamespaces "adoptionMap" (lookup "v1" "ConfigMap" .Release.Namespace $adoptionName | default dict)
  "catalog" (lookup "v1" "ConfigMap" .Release.Namespace "kars-inference-budget-contracts" | default dict)
  "budgetTls" $budgetTls "privateControllers" (.Files.Get "files/private-consumption.json" | fromJson).controllers
  "privateDefinition" (pick (.Files.Get "files/private-consumption.json" | fromJson) "controllers" "secrets" "tokenAudiences")
  "grafanaDefaults" (.Files.Get "files/monitoring/grafana-defaults.json" | fromJson)
  "runtime" (lookup "v1" "Namespace" "" "kars-sre" | default dict)
  "workspace" $workspace
  "controller" (lookup "apps/v1" "Deployment" .Release.Namespace "kars-controller" | default dict)) -}}
{{- $managed := list -}}
{{- range $custom -}}
{{- if ne .kind "KarsSandbox" -}}{{- $managed = append $managed . -}}{{- end -}}
{{- end -}}
{{- $custom = $managed -}}
{{- $saved := deepCopy $prior -}}
{{- $_ := unset $saved.metadata "managedFields" -}}
{{ toYaml $saved }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $adoptionName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
immutable: true
data:
  {{- toYaml $receipt | nindent 2 }}
---
{{- end -}}
{{- range concat $ordinary (ternary list $custom $cold) }}
{{ toYaml . }}
---
{{- end }}
