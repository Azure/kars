apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-rebind-authority
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kars.azure.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["karstasks"]
  variables:
    - name: prior
      expression: "oldObject == null ? '' : oldObject.metadata.?annotations.orValue({})[?'kars.azure.com/credential-rebind-pending'].orValue('')"
    - name: next
      expression: "object.metadata.?annotations.orValue({})[?'kars.azure.com/credential-rebind-pending'].orValue('')"
    - name: projector
      expression: >-
        authorizer.group('kars.azure.com').resource('karscredentialgrants')
          .namespace(request.namespace).name('workspace').check('project-credentials').allowed()
  validations:
    - expression: "variables.prior == variables.next || (variables.projector && variables.next in ['', 'true'])"
      message: "The controller owns the non-destructive credential pause protocol"
      reason: Forbidden
    - expression: >-
        variables.prior != 'true' || variables.next == 'true' ||
        !has(object.spec.execution) || !object.spec.execution.launch ||
        (has(oldObject.status) && oldObject.status.?executionPhase.orValue('') == 'CredentialsPaused' &&
         oldObject.status.?observedGeneration.orValue(0) == oldObject.metadata.generation &&
         (!has(oldObject.status.envelopeDigest) || dyn(oldObject.status.envelopeDigest) == null) &&
         oldObject.status.?conditions.orValue([]).exists(c, c.type == 'Ready' && c.status == 'False'))
      message: "Resuming a credential rebind requires current paused authority, not unlaunch/teardown"
    - expression: >-
        variables.prior != 'true' ||
        (((has(object.spec.blueprint) && has(object.spec.blueprint.credentialBindings)) ==
            (has(oldObject.spec.blueprint) && has(oldObject.spec.blueprint.credentialBindings))) &&
          (!has(object.spec.blueprint) || !has(object.spec.blueprint.credentialBindings) ||
            object.spec.blueprint.credentialBindings == oldObject.spec.blueprint.credentialBindings) &&
          ((has(object.spec.blueprint) && has(object.spec.blueprint.githubBinding)) ==
            (has(oldObject.spec.blueprint) && has(oldObject.spec.blueprint.githubBinding))) &&
          (!has(object.spec.blueprint) || !has(object.spec.blueprint.githubBinding) ||
            object.spec.blueprint.githubBinding == oldObject.spec.blueprint.githubBinding)) ||
        (variables.projector && variables.next == '' &&
          has(oldObject.status) && oldObject.status.?executionPhase.orValue('') == 'CredentialsPaused')
      message: "Credential authority cannot change before the owned runtime pause is acknowledged"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-rebind-authority
spec:
  policyName: kars-credential-rebind-authority
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kars-credential-runtime-hold
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kars.azure.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["karssandboxes", "karssandboxes/status"]
  matchConditions:
    - name: owned-credential-hold-change
      expression: >-
        (oldObject == null ? '' : oldObject.metadata.?annotations.orValue({})[?'kars.azure.com/credential-rebind-task-uid'].orValue('')) !=
          object.metadata.?annotations.orValue({})[?'kars.azure.com/credential-rebind-task-uid'].orValue('')
  validations:
    - expression: >-
        authorizer.group('kars.azure.com').resource('karscredentialgrants')
          .namespace(request.namespace).name('workspace').check('project-credentials').allowed()
      message: "Only the controller may manage a state-preserving credential runtime hold"
      reason: Forbidden
    - expression: >-
        !('kars.azure.com/credential-rebind-task-uid' in object.metadata.?annotations.orValue({})) ||
        object.metadata.?ownerReferences.orValue([]).exists(owner,
          owner.apiVersion == 'kars.azure.com/v1alpha1' && owner.kind == 'KarsTask' &&
          owner.?controller.orValue(false) &&
          owner.uid == object.metadata.annotations['kars.azure.com/credential-rebind-task-uid'])
      message: "A credential runtime hold must bind its real owning Task UID"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kars-credential-runtime-hold
spec:
  policyName: kars-credential-runtime-hold
  validationActions: [Deny, Audit]
