{{- include "kars.inferenceCredentials.validate" . -}}
{{- $credentials := .Values.inferenceRouter.azure.openai.credentials | default dict -}}
{{- if $credentials.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: kars-inference-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: inference-bootstrap
type: Opaque
data:
  {{ $credentials.key | default "api-key" | quote }}: {{ $credentials.apiKey | b64enc | quote }}
{{- end }}
