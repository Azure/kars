---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karsskills.kars.azure.com
spec:
  group: kars.azure.com
  names:
    categories: []
    kind: KarsSkill
    plural: karsskills
    shortNames:
    - cskill
    singular: karsskill
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.versionDigest
      name: Digest
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KarsSkillSpec via `CustomResource`
        properties:
          spec:
            description: '`KarsSkill.spec` — a governed, versioned capability bundle.'
            properties:
              attestationDigest:
                description: |-
                  Optional content digest the attestation vouches for. When present it is
                  verified to equal the controller-computed `version_digest`, so the
                  signed bundle provably matches what runs (binds supply-chain provenance
                  to the exact content). Format: `sha256:<hex>`.
                nullable: true
                type: string
              attestationRef:
                description: |-
                  Optional cosign attestation reference (an OCI ref / digest of the signed
                  skill bundle). When present, surfaced on the status as the attestation
                  the skill was published with (full verification is a V1 supply-chain
                  concern; recording the claim is honest provenance now).
                nullable: true
                type: string
              boundingPolicy:
                description: |-
                  The **bounding tool policy** — the name of a same-namespace `ToolPolicy`
                  that is the authority ceiling on every tool the skill calls. **Required**:
                  a skill that calls tools without a bound is rejected at admission.
                type: string
              displayName:
                description: Human-readable display name (e.g. "Repo triage", "Hotel itemization").
                nullable: true
                type: string
              knowledgePack:
                description: |-
                  Optional knowledge-pack reference (the name of a team knowledge commons
                  or a packaged knowledge set the skill ships with).
                nullable: true
                type: string
              mcpServers:
                description: The MCP servers (same-namespace `MCPServer` names) this skill connects.
                items:
                  type: string
                type: array
              recipe:
                description: |-
                  The **recipe** — standing instructions for using the capability well,
                  merged into the instructions of a member that acquires this skill.
                nullable: true
                type: string
              scripts:
                description: |-
                  Optional **scripts** the skill package ships — a skill can bundle helper
                  scripts (a shell/python helper, a lint config, a template), not just a
                  recipe. Each is delivered to a member that acquires the skill as a
                  clearly-delimited file block in its instructions, so the agent can
                  materialize and run it. They are part of the content `versionDigest`, so
                  the signed bundle covers the scripts too.
                items:
                  description: One file a skill package ships (a helper script, config, or template).
                  properties:
                    content:
                      description: The file's text content.
                      type: string
                    executable:
                      default: false
                      description: Whether it's meant to be executed (a hint for the agent; `chmod +x`).
                      type: boolean
                    path:
                      description: Relative path the agent should save it at (e.g. `scripts/triage.sh`).
                      type: string
                  required:
                  - content
                  - path
                  type: object
                type: array
              summary:
                description: What the skill does, in one or two plain-language sentences.
                type: string
              version:
                description: |-
                  Author-declared semantic version (e.g. "1.2.0"). Surfaced verbatim; the
                  controller also computes a content `versionDigest` that pins the bundle.
                type: string
            required:
            - boundingPolicy
            - summary
            - version
            type: object
          status:
            description: '`KarsSkill.status` — controller-owned.'
            nullable: true
            properties:
              attestationRef:
                description: The attestation reference the skill was published with, when declared.
                nullable: true
                type: string
              attestationVerified:
                description: |-
                  Whether the cosign attestation verified (ref well-formed + digest binds
                  content). False when none declared or a mismatch was detected.
                nullable: true
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                nullable: true
                type: array
              detail:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                description: '`Ready` (validated, grantable) | `Degraded` (invalid — not grantable).'
                nullable: true
                type: string
              versionDigest:
                description: '`sha256:` digest pinning the validated skill content.'
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: KarsSkill
        type: object
    served: true
    storage: true
    subresources:
      status: {}

