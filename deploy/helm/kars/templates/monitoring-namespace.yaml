{{- if .Values.monitoring.enabled }}
{{- $owner := printf "%s/%s" .Release.Namespace .Release.Name }}
{{- $existing := lookup "v1" "Namespace" "" "monitoring" }}
{{- if $existing }}
{{- $annotations := $existing.metadata.annotations | default dict }}
{{- if or (ne (get $annotations "kars.azure.com/monitoring-owner") $owner) (ne (get $annotations "meta.helm.sh/release-name") .Release.Name) (ne (get $annotations "meta.helm.sh/release-namespace") .Release.Namespace) }}
{{- fail "Monitoring namespace exists outside this Core installation; set monitoring.enabled=false to retain external monitoring instead of adopting it" }}
{{- end }}
{{- else }}
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: kars
    app.kubernetes.io/component: system
    app.kubernetes.io/managed-by: Helm
  annotations:
    kars.azure.com/monitoring-owner: {{ $owner | quote }}
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    helm.sh/resource-policy: keep
    # The admission certificate Job is a pre-install/pre-upgrade hook.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: hook-failed
{{- end }}
{{- end }}
