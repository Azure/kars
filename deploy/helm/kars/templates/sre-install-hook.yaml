{{- if and .Values.schemaHook.enabled .Values.sre.enabled -}}
{{- $rendered := include "kars.schemaHook.resources" . -}}
{{- $before := printf "%s-schema-%s" (.Release.Name | trunc 32 | trimSuffix "-") .Release.karsSchemaHookId -}}
{{- $after := printf "%s-sre-install-%s" (.Release.Name | trunc 27 | trimSuffix "-") .Release.karsSchemaHookId -}}
{{- range splitList "\n---" (replace $before $after $rendered) -}}
{{- $object := fromYaml . -}}
{{- if $object.kind -}}
{{- $_ := set $object.metadata.annotations "helm.sh/hook" "post-install" -}}
{{- if eq $object.kind "ClusterRole" -}}
{{- $_ := set $object "rules" (list
  (dict "apiGroups" (list "apiextensions.k8s.io") "resources" (list "customresourcedefinitions") "resourceNames" (list "karssreregistrations.kars.azure.com") "verbs" (list "get"))
  (dict "apiGroups" (list "authorization.k8s.io") "resources" (list "selfsubjectaccessreviews") "verbs" (list "create"))
  (dict "apiGroups" (list "kars.azure.com") "resources" (list "karssreregistrations") "verbs" (list "create"))
  (dict "apiGroups" (list "kars.azure.com") "resources" (list "karssreregistrations") "resourceNames" (list "canonical") "verbs" (list "get" "use"))
  (dict "apiGroups" (list "") "resources" (list "namespaces") "resourceNames" (list $.Release.Namespace "kube-system" "kars-sre") "verbs" (list "get"))
  (dict "apiGroups" (list "rbac.authorization.k8s.io") "resources" (list "roles" "clusterroles" "rolebindings" "clusterrolebindings") "verbs" (list "get" "list"))
  (dict "nonResourceURLs" (list "/version" "/api" "/api/*" "/apis" "/apis/*" "/openapi/v3" "/openapi/v3/*") "verbs" (list "get"))) -}}
{{- else if eq $object.kind "Role" -}}
{{- $_ := set $object "rules" (concat $object.rules (list
  (dict "apiGroups" (list "") "resources" (list "configmaps") "resourceNames" (list "kars-sre-first-install" "kars-inference-budget-contracts") "verbs" (list "get"))
  (dict "apiGroups" (list "kars.azure.com") "resources" (list "karssandboxes" "inferencepolicies" "toolpolicies") "verbs" (list "create"))
  (dict "apiGroups" (list "kars.azure.com") "resources" (list "karssandboxes" "inferencepolicies" "toolpolicies") "resourceNames" (list "sre" "sre-inference" "sre-tools") "verbs" (list "get"))
  (dict "apiGroups" (list "kars.azure.com") "resources" (list "karsbudgetaccounts") "verbs" (list "get")))) -}}
{{- if $.Values.sre.firstInstallFunding.unboundedTokens -}}
{{- $_ := set $object "rules" (concat $object.rules (list
  (dict "apiGroups" (list "") "resources" (list "configmaps") "resourceNames" (list "kars-inference-budget-contracts") "verbs" (list "patch"))
  (dict "apiGroups" (list "kars.azure.com") "resources" (list "karsbudgetaccounts") "verbs" (list "fund")))) -}}
{{- end -}}
{{- else if eq $object.kind "Job" -}}
{{- $_ := set $object.spec "activeDeadlineSeconds" 660 -}}
{{- $container := first $object.spec.template.spec.containers -}}
{{- $_ := set $container "name" "sre-enrollment" -}}
{{- $_ := set $container "args" (concat (slice $container.args 0 10) (list "--timeout-ms" "600000" "--phase" "sre")) -}}
{{- end }}
{{ toYaml $object }}
---
{{- end -}}
{{- end }}
# Namespace creation remains exclusively controller-owned. Consumer inspection
# is read-only and cannot be namespaced before that namespace exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $after }}-consumer-read
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [sre]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $after }}-consumer-read
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $after }}-consumer-read
subjects:
  - kind: ServiceAccount
    name: {{ $after }}
    namespace: {{ .Release.Namespace }}
{{- end }}
