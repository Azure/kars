# AGT upstream relay + registry — standalone compatibility deployment.
#
# This manifest deploys the upstream Microsoft Agent Governance Toolkit
# (AGT) Python relay+registry from the source pin in vendor/agt/pin.json.
# Product beta installations use the Core Helm release's agentMesh resources.
#
# Image source: build from the Kars repository root using
#   sandbox-images/agentmesh/Dockerfile
# and validated AGT core/server + native ACS wheels in runtimes/wheels/.
# The final image is Azure Linux 3 distroless Python, not the deprecated
# upstream agentmesh-platform Dockerfile/package extra.
# with --build-arg COMPONENT=registry|relay, then tag and push as:
#   karsacr.azurecr.io/agentmesh-registry-agt:latest
#   karsacr.azurecr.io/agentmesh-relay-agt:latest
#
# Registry HTTP port: 8082 (upstream default). Relay WebSocket port: 8083.
# We re-map these to the same Service ports our router/router-helpers expect
# (registry 8080, relay 8765) so no router-side change is needed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentmesh
  labels:
    kars.azure.com/managed: "true"
    kars.azure.com/mesh-provider: "agt"
---
# AGT upstream registry (Python FastAPI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: agentmesh
  labels:
    kars.azure.com/mesh-provider: agt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentmesh-registry
  template:
    metadata:
      labels:
        app: agentmesh-registry
        kars.azure.com/mesh-provider: agt
    spec:
      containers:
        - name: registry
          # Both servers and runtime SDKs must use the same vendor/agt/pin.json
          # source revision; the image records that pin without replacing
          # upstream registry identity, PoP, KNOCK or encrypted relay behavior.
          image: karsacr.azurecr.io/agentmesh-registry-agt:latest
          ports:
            - containerPort: 8082
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8082"
            - name: LOG_LEVEL
              value: "info"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agentmesh-registry
  namespace: agentmesh
spec:
  selector:
    app: agentmesh-registry
  ports:
    # Keep the external port at 8080 so router/router-helpers and existing
    # ConfigMaps don't need to change. The container actually listens on 8082.
    - port: 8080
      targetPort: 8082
---
# AGT upstream relay (Python FastAPI WebSocket)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: agentmesh
  labels:
    kars.azure.com/mesh-provider: agt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentmesh-relay
  template:
    metadata:
      labels:
        app: agentmesh-relay
        kars.azure.com/mesh-provider: agt
    spec:
      containers:
        - name: relay
          # Same kars-built image bundle as the registry above — see
          # `vendor/agt/pin.json` for the AGT SHA both are built from
          # and the transition path to published images.
          image: karsacr.azurecr.io/agentmesh-relay-agt:latest
          ports:
            - containerPort: 8083
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8083"
            - name: LOG_LEVEL
              value: "info"
            - name: REGISTRY_URL
              value: "http://agentmesh-registry.agentmesh.svc.cluster.local:8080"
            - name: REQUIRE_REGISTRATION
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agentmesh-relay
  namespace: agentmesh
spec:
  selector:
    app: agentmesh-relay
  ports:
    # Keep external port 8765 (matches existing router config) → container 8083.
    - port: 8765
      targetPort: 8083
