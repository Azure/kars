name: Public Release (GHCR + GitHub Release)

# ─────────────────────────────────────────────────────────────────────────
# Public release — lets anyone run kars from pre-built, signed artefacts
# WITHOUT cloning AGT or compiling anything.
#
# What this produces (all PUBLIC):
#   1. Container images → ghcr.io/azure/kars-*:<version> (stable only: :latest)
#      (cosign keyless signed, SPDX SBOM + SLSA build-provenance attached)
#   2. Core + Bridge Helm charts with locked dependencies and image digests
#   3. @kars-runtime/cli packed as a .tgz attached to a PUBLIC GitHub Release
#      (build-provenance attested; customers install via
#      `npm i -g <release-url>`). Direct crates.io / npmjs / MCR publishing
#      is in progress — see docs/PUBLISHING.md.
#
# Triggers:
#   - Clean version tags `vMAJOR.MINOR.PATCH` (e.g. v0.1.0)
#   - Pre-release tags `vMAJOR.MINOR.PATCH-<suffix>` (e.g. v0.1.0-interim.1)
#   - Manual via workflow_dispatch (version input)
#
# ONE-TIME SETUP (first run only): GHCR org packages default to private.
# After the first push, set each `kars-*` package to Public in
# https://github.com/orgs/Azure/packages → package → Settings → visibility
# (GitHub has no API for container-package visibility; this is UI-only).
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      # prepare admits only canonical SemVer, including prerelease/build metadata.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g. v0.1.0 or v0.1.0-interim.1).'
        required: true
      recovery_run_id:
        description: 'Packaging-only recovery: reuse the successful producers of this failed release run; leave empty for a full release.'
        required: false
        type: string
        default: ''

concurrency:
  group: public-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/azure

jobs:
  prepare:
    name: Validate release version and source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      recovery: ${{ steps.recovery.outputs.recovery || 'false' }}
      recoveryManifest: ${{ steps.recovery.outputs.manifest }}
      producerSource: ${{ steps.recovery.outputs.source_sha || github.sha }}
      producerRunId: ${{ steps.recovery.outputs.run_id || github.run_id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      imageTag: ${{ steps.version.outputs.imageTag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npmTag: ${{ steps.version.outputs.npmTag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate explicit SemVer and release source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node cli/scripts/release-artifacts.mjs version "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          TAG=$(node cli/scripts/release-artifacts.mjs version "$REQUESTED_VERSION" | sed -n 's/^tag=//p')
          git merge-base --is-ancestor "$GITHUB_SHA" origin/kars-bridge
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo '::error::Release tags must use the canonical v-prefixed SemVer'; exit 1
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          fi
          gh api "repos/$GITHUB_REPOSITORY" --silent
          if response=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>release-lookup-error.log); then
            echo '::error::An existing release must not be overwritten; select a fresh version'; exit 1
          elif ! printf '%s\n' "$response" | grep -Eq '^HTTP/[0-9.]+ 404'; then
            cat release-lookup-error.log
            echo '::error::Could not establish whether this release already exists'; exit 1
          fi
      - name: Validate immutable producer artifacts for packaging-only recovery
        id: recovery
        if: ${{ inputs.recovery_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: python3 ci/release_recovery.py prepare --run-id "$RECOVERY_RUN_ID" --version "$RELEASE_VERSION"

  # ─── Stage 1: multi-arch Rust binaries ─────────────────────────
  build-binaries:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    needs: prepare
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
    name: Build Rust binaries (amd64 + arm64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: rust-glibc-release-multiarch
          save-if: false
      - name: Install aarch64 cross toolchain + libc headers
        run: |
          sudo apt-get update
          # gcc-aarch64-linux-gnu alone is not enough to compile aws-lc-sys
          # (BoringSSL C) for arm64: --no-install-recommends drops the cross
          # libc dev headers, so the build fails with "sys/types.h: No such
          # file or directory". Pull them in explicitly:
          #   libc6-dev-arm64-cross    → sys/types.h, bits/libc-header-start.h
          #   linux-libc-dev-arm64-cross → asm/types.h, linux/types.h
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross
      - name: cargo build --release (amd64 + arm64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --workspace --target x86_64-unknown-linux-gnu
          cargo build --release --workspace --target aarch64-unknown-linux-gnu
      - name: Stage binaries per-arch
        run: |
          mkdir -p ./bin/amd64 ./bin/arm64
          for bin in kars-controller kars-inference-router kars-a2a-gateway kars-conformance-runner; do
            cp "target/x86_64-unknown-linux-gnu/release/$bin"  "./bin/amd64/$bin"
            cp "target/aarch64-unknown-linux-gnu/release/$bin" "./bin/arm64/$bin"
          done
      - name: Verify + checksum
        run: |
          chmod +x ./bin/*/kars-*
          ( cd ./bin && find . -type f -name 'kars-*' -exec sha256sum {} \; | tee SHA256SUMS )
          file ./bin/*/kars-*
      - name: Attest build provenance (binaries, GitHub-signed)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'bin/*/kars-*'

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-binaries-${{ env.VERSION }}
          path: ./bin/
          retention-days: 90

  # ─── Stage 2: build + push container images to PUBLIC GHCR ─────
  build-images:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    name: Build + push ${{ matrix.image.name }} ${{ matrix.image.arch }} (PUBLIC GHCR)
    needs: [prepare, build-binaries]
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      ARCH_SUFFIX: ${{ matrix.image.arch && format('-{0}', matrix.image.arch) || '' }}
    runs-on: ${{ matrix.image.runner || 'ubuntu-22.04' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: controller
            dockerfile: controller/Dockerfile
            ghcr: kars-controller
            platforms: linux/amd64,linux/arm64
          - name: metrics-server
            dockerfile: sandbox-images/metrics-server/Dockerfile
            ghcr: kars-metrics-server
            platforms: linux/amd64,linux/arm64
          - name: headlamp
            dockerfile: sandbox-images/headlamp/Dockerfile
            ghcr: kars-headlamp
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: inference-router
            dockerfile: inference-router/Dockerfile
            ghcr: kars-inference-router
            platforms: linux/amd64,linux/arm64
          - name: a2a-gateway
            dockerfile: a2a-gateway/Dockerfile
            ghcr: kars-a2a-gateway
            platforms: linux/amd64,linux/arm64
          - name: conformance-runner
            dockerfile: sandbox-images/conformance-runner/Dockerfile
            ghcr: kars-conformance-runner
            platforms: linux/amd64,linux/arm64
          # Source-heavy builds use the same native runners as the sandbox images.
          - name: bridge-bff
            dockerfile: bridge/bff/Dockerfile
            ghcr: kars-bridge-bff
            context: .
            no_binaries: true
            platforms: linux/amd64
            arch: amd64
          - name: bridge-bff
            dockerfile: bridge/bff/Dockerfile
            ghcr: kars-bridge-bff
            context: .
            no_binaries: true
            platforms: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: bridge-web
            dockerfile: bridge/web/Dockerfile
            ghcr: kars-bridge-web
            context: bridge/web
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: bridge-teams-gateway
            dockerfile: bridge/teams-gateway/Dockerfile
            ghcr: kars-bridge-teams-gateway
            context: bridge/teams-gateway
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: bridge-idp
            dockerfile: bridge/idp/Dockerfile
            ghcr: kars-bridge-idp
            context: bridge/idp
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: schema-hook
            dockerfile: cli/schema-hook/Dockerfile
            ghcr: kars-schema-hook
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: mission-dispatcher
            dockerfile: mesh-plugin/Dockerfile.dispatcher
            ghcr: kars-mission-dispatcher
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: datapath-witness
            dockerfile: deploy/ebpf-witness/aggregator/Dockerfile
            ghcr: kars-datapath-witness
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: prometheus-operator
            dockerfile: sandbox-images/prometheus-operator/Dockerfile
            ghcr: kars-prometheus-operator
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
            target: operator
          - name: prometheus-config-reloader
            dockerfile: sandbox-images/prometheus-operator/Dockerfile
            ghcr: kars-prometheus-config-reloader
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
            target: config-reloader
          - name: prometheus
            dockerfile: sandbox-images/prometheus/Dockerfile
            ghcr: kars-prometheus
            context: .
            no_binaries: true
            platforms: linux/amd64
            arch: amd64
          - name: prometheus
            dockerfile: sandbox-images/prometheus/Dockerfile
            ghcr: kars-prometheus
            context: .
            no_binaries: true
            platforms: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: webhook-certgen
            dockerfile: sandbox-images/webhook-certgen/Dockerfile
            ghcr: kars-webhook-certgen
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: kube-state-metrics
            dockerfile: sandbox-images/kube-state-metrics/Dockerfile
            ghcr: kars-kube-state-metrics
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: node-exporter
            dockerfile: sandbox-images/node-exporter/Dockerfile
            ghcr: kars-node-exporter
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: json-exporter
            dockerfile: sandbox-images/json-exporter/Dockerfile
            ghcr: kars-json-exporter
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          - name: grafana
            dockerfile: sandbox-images/grafana/Dockerfile
            ghcr: kars-grafana
            context: .
            no_binaries: true
            platforms: linux/amd64
            arch: amd64
          - name: grafana
            dockerfile: sandbox-images/grafana/Dockerfile
            ghcr: kars-grafana
            context: .
            no_binaries: true
            platforms: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: k8s-sidecar
            dockerfile: sandbox-images/k8s-sidecar/Dockerfile
            ghcr: kars-k8s-sidecar
            context: .
            no_binaries: true
            platforms: linux/amd64,linux/arm64
          # Playwright's arm64 browser installer crashes with SIGILL under QEMU.
          # Use the same native build and signed-manifest path as source builds.
          - name: mcp-playwright
            dockerfile: sandbox-images/mcp-playwright/Dockerfile
            ghcr: kars-mcp-playwright
            context: sandbox-images/mcp-playwright
            no_binaries: true
            platforms: linux/amd64
            arch: amd64
          - name: mcp-playwright
            dockerfile: sandbox-images/mcp-playwright/Dockerfile
            ghcr: kars-mcp-playwright
            context: sandbox-images/mcp-playwright
            no_binaries: true
            platforms: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: mcp-everything
            dockerfile: sandbox-images/mcp-everything/Dockerfile
            ghcr: kars-mcp-everything
            context: sandbox-images/mcp-everything
            no_binaries: true
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download pre-built binaries (per-arch)
        if: matrix.image.no_binaries != true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kars-binaries-${{ env.VERSION }}
          path: ./bin/
      - name: chmod binaries
        if: matrix.image.no_binaries != true
        run: find ./bin -type f -name 'kars-*' -exec chmod +x {} \;

      - name: Set up QEMU (for cross-arch buildx)
        if: matrix.image.platforms != 'linux/amd64' && !matrix.image.arch
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (PUBLIC)
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: true
          platforms: ${{ matrix.image.platforms }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image.ghcr }}:${{ env.IMAGE_VERSION }}${{ env.ARCH_SUFFIX }}
            ${{ needs.prepare.outputs.prerelease == 'false' && format('{0}/{1}:latest{2}', env.REGISTRY, matrix.image.ghcr, env.ARCH_SUFFIX) || '' }}
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE_REVISION=${{ github.sha }}
          sbom: true
          provenance: true

      - name: Attest build provenance (GitHub-signed, pushed to registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image.ghcr }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Make package public (best-effort; may need one-time manual toggle)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/azure/packages/container/${{ matrix.image.ghcr }}/visibility" \
            -f visibility=public \
          || echo "::warning::Could not set ${{ matrix.image.ghcr }} public via API; set it once manually in package settings."

      - name: Record image build receipt
        if: ${{ !matrix.image.arch }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p image-receipts
          jq -n --arg name '${{ matrix.image.ghcr }}' --arg repository '${{ env.REGISTRY }}/${{ matrix.image.ghcr }}' --arg digest "$DIGEST" \
            '{name: $name, repository: $repository, digest: $digest}' > image-receipts/${{ matrix.image.ghcr }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: ${{ !matrix.image.arch }}
        with:
          name: image-${{ matrix.image.ghcr }}-${{ env.VERSION }}
          path: image-receipts/*.json
          if-no-files-found: error

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.image.ghcr }}:${{ env.IMAGE_VERSION }}${{ env.ARCH_SUFFIX }}
          format: spdx-json
          output-file: sbom-${{ matrix.image.name }}${{ env.ARCH_SUFFIX }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sbom-${{ matrix.image.name }}-${{ env.VERSION }}${{ env.ARCH_SUFFIX }}
          path: sbom-${{ matrix.image.name }}${{ env.ARCH_SUFFIX }}.spdx.json
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign keyless sign image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ matrix.image.ghcr }}@${{ steps.push.outputs.digest }}

  # Native source builds keep per-architecture SBOMs; only signed multi-arch
  # manifests become authoritative chart image receipts.
  merge-native-images:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    name: Merge + sign ${{ matrix.image }} native manifests
    needs: [prepare, build-images]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [kars-bridge-bff, kars-prometheus, kars-grafana, kars-mcp-playwright]
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and validate both native architectures
        id: manifest
        env:
          NAME: ${{ matrix.image }}
        run: |
          repository="$REGISTRY/$NAME"
          LATEST_ARGS=()
          if [ "$PRERELEASE" = false ]; then LATEST_ARGS=(-t "$repository:latest"); fi
          docker buildx imagetools create \
            -t "$repository:$IMAGE_VERSION" "${LATEST_ARGS[@]}" \
            "$repository:$IMAGE_VERSION-amd64" "$repository:$IMAGE_VERSION-arm64"
          DIGEST=$(docker buildx imagetools inspect "$repository:$IMAGE_VERSION" --format '{{.Manifest.Digest}}')
          docker buildx imagetools inspect "$repository@$DIGEST" --raw | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest merged build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
        with:
          cosign-release: 'v2.4.1'
      - name: Cosign keyless sign manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Record signed multi-arch image receipt
        env:
          NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          mkdir -p image-receipts
          jq -n --arg name "$NAME" --arg repository "$REGISTRY/$NAME" --arg digest "$DIGEST" \
            '{name: $name, repository: $repository, digest: $digest}' > "image-receipts/$NAME.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: image-${{ matrix.image }}-${{ env.VERSION }}
          path: image-receipts/*.json
          if-no-files-found: error

  # ─── Stage 2b: build sandbox-base + openclaw-sandbox (NATIVE per-arch) ──
  # These two are heavy (Python/Go/Node), so building arm64 under QEMU is far
  # too slow. Instead build each arch on its NATIVE GitHub-hosted runner
  # (amd64 → ubuntu-22.04, arm64 → ubuntu-24.04-arm; free for public repos),
  # push per-arch tags, then merge into a multi-arch manifest. This is what
  # makes openclaw-sandbox run NATIVELY on Apple Silicon (amd64 under Rosetta
  # crashes with rt_tgsigqueueinfo). The vendored sandbox wheels ship aarch64
  # variants, so the arm64 base installs pre-built wheels (no source compile).
  build-sandbox-base:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    needs: prepare
    name: Build kars-sandbox-base (${{ matrix.arch }}, native)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push kars-sandbox-base:${{ env.VERSION }}-${{ matrix.arch }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: .
          file: sandbox-images/openclaw/Dockerfile.base
          push: true
          sbom: true
          provenance: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/kars-sandbox-base:${{ env.IMAGE_VERSION }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.VERSION }}

  build-sandbox:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    name: Build openclaw-sandbox (${{ matrix.arch }}, native)
    needs: [prepare, build-images, build-sandbox-base]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage patched AGT SDK (release-build correctness guard)
        run: |
          # The Dockerfile verifies vendor/agt/SHA256SUMS and uses the locked
          # SDK. Stage only its checked compatibility input, never a public fallback.
          (cd vendor/agt && sha256sum -c SHA256SUMS)
          TARBALL=$(find vendor/agt -maxdepth 1 -name 'microsoft-agent-governance-sdk-*.tgz' | head -1 || true)
          if [ -z "$TARBALL" ]; then
            echo "::error::No vendored patched AGT SDK tarball under vendor/agt/."
            exit 1
          fi
          mkdir -p .agt-sdk
          cp "$TARBALL" .agt-sdk/
          echo "AGT_SDK_TARBALL=$(basename "$TARBALL")" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push openclaw-sandbox:${{ env.VERSION }}-${{ matrix.arch }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: .
          file: sandbox-images/openclaw/Dockerfile
          push: true
          sbom: true
          provenance: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/openclaw-sandbox:${{ env.IMAGE_VERSION }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.VERSION }}
            SANDBOX_BASE_IMAGE=${{ env.REGISTRY }}/kars-sandbox-base:${{ env.IMAGE_VERSION }}-${{ matrix.arch }}
            INFERENCE_ROUTER_IMAGE=${{ env.REGISTRY }}/kars-inference-router:${{ env.IMAGE_VERSION }}
            MESH_PROVIDER=agt
            AGT_SDK_TARBALL=${{ env.AGT_SDK_TARBALL }}

  # Merge the per-arch tags into multi-arch manifests + sign/attest/SBOM.
  merge-sandbox:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    name: Merge + sign default harness and sandbox-base manifests
    needs: [prepare, build-sandbox-base, build-sandbox, build-runtimes]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    outputs:
      sandbox_digest: ${{ steps.digests.outputs.openclaw }}
      sandbox_base_digest: ${{ steps.digests.outputs.base }}
      hermes_digest: ${{ steps.digests.outputs.hermes }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests (:VERSION + :latest)
        id: digests
        run: |
          for name in kars-sandbox-base openclaw-sandbox kars-runtime-hermes; do
            LATEST_ARGS=()
            if [ "$PRERELEASE" = false ]; then LATEST_ARGS=(-t "${REGISTRY}/${name}:latest"); fi
            docker buildx imagetools create \
              -t "${REGISTRY}/${name}:${VERSION}" \
              "${LATEST_ARGS[@]}" \
              "${REGISTRY}/${name}:${VERSION}-amd64" \
              "${REGISTRY}/${name}:${VERSION}-arm64"
            DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${name}:${VERSION}" --format '{{.Manifest.Digest}}')
            case "$name" in
              kars-sandbox-base) echo "base=${DIGEST}" >> "$GITHUB_OUTPUT" ;;
              openclaw-sandbox)  echo "openclaw=${DIGEST}" >> "$GITHUB_OUTPUT" ;;
              kars-runtime-hermes) echo "hermes=${DIGEST}" >> "$GITHUB_OUTPUT" ;;
            esac
          done
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ env.IMAGE_VERSION }}

      - name: Record merged build receipts
        run: |
          mkdir -p image-receipts
          for pair in 'kars-sandbox-base=${{ steps.digests.outputs.base }}' 'openclaw-sandbox=${{ steps.digests.outputs.openclaw }}' 'kars-runtime-hermes=${{ steps.digests.outputs.hermes }}'; do
            name="${pair%%=*}"; digest="${pair#*=}"
            jq -n --arg name "$name" --arg repository "$REGISTRY/$name" --arg digest "$digest" \
              '{name: $name, repository: $repository, digest: $digest}' > "image-receipts/$name.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: image-sandboxes-${{ env.VERSION }}
          path: image-receipts/*.json
          if-no-files-found: error

      - name: Make packages public (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in kars-sandbox-base openclaw-sandbox kars-runtime-hermes; do
            gh api -X PATCH -H "Accept: application/vnd.github+json" \
              "/orgs/azure/packages/container/${name}/visibility" -f visibility=public \
            || echo "::warning::Could not set ${name} public via API."
          done

      - name: Attest build provenance (both manifests)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/openclaw-sandbox
          subject-digest: ${{ steps.digests.outputs.openclaw }}
          push-to-registry: true

      - name: Generate SBOM (openclaw-sandbox)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/openclaw-sandbox:${{ env.IMAGE_VERSION }}
          format: spdx-json
          output-file: sbom-openclaw-sandbox.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sbom-openclaw-sandbox-${{ env.VERSION }}
          path: sbom-openclaw-sandbox.spdx.json
          retention-days: 90

      - name: Attest sandbox base manifest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/kars-sandbox-base
          subject-digest: ${{ steps.digests.outputs.base }}
          push-to-registry: true
      - name: Generate sandbox base SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/kars-sandbox-base:${{ env.IMAGE_VERSION }}
          format: spdx-json
          output-file: sbom-kars-sandbox-base.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sbom-kars-sandbox-base-${{ env.VERSION }}
          path: sbom-kars-sandbox-base.spdx.json

      - name: Attest Hermes manifest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/kars-runtime-hermes
          subject-digest: ${{ steps.digests.outputs.hermes }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
        with:
          cosign-release: 'v2.4.1'
      - name: Cosign keyless sign manifests
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/kars-sandbox-base@${{ steps.digests.outputs.base }}
          cosign sign --yes ${{ env.REGISTRY }}/openclaw-sandbox@${{ steps.digests.outputs.openclaw }}
          cosign sign --yes ${{ env.REGISTRY }}/kars-runtime-hermes@${{ steps.digests.outputs.hermes }}

  # ─── Stage 2c: build AGT Python wheels (upstream governance pkgs) ──
  # The Python runtime images COPY runtimes/wheels/*.whl (upstream AGT
  # governance packages) AND runtimes/agt-mesh-python/ (kars's own
  # spec-compliant Python MeshClient — in-repo source, bundled hermetically
  # from the checkout). Only the upstream wheels need building here; they
  # come from the pinned AGT checkout (vendor/agt/pin.json).
  build-agt-wheels:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    needs: prepare
    name: Build AGT Python wheels (from pinned AGT)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Clone pinned AGT + build wheels
        run: |
          URL=$(jq -r .url vendor/agt/pin.json)
          SHA=$(jq -r .sha vendor/agt/pin.json)
          echo "::notice::Cloning $URL @ $SHA for AGT-Python wheels"
          git clone --filter=blob:none "$URL" .release-agt
          git -C .release-agt checkout "$SHA"
          AGT_PYTHON_DIR="$GITHUB_WORKSPACE/.release-agt/agent-governance-python" ./runtimes/build-agt-wheels.sh
          echo "Built wheels:" && ls -la runtimes/wheels/
      - name: Guard — wheels present
        run: |
          python3 - <<'PY'
          import pathlib, runpy
          select = runpy.run_path("runtimes/install-agt-wheels.py")["select_wheels"]
          for machine in ("x86_64", "aarch64"):
              select(pathlib.Path("runtimes/wheels"), machine)
          print("Verified AGT 5 owners and both native ACS wheel receipts")
          PY
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: agt-wheels-${{ env.VERSION }}
          path: runtimes/wheels/
          retention-days: 90

  # ─── Stage 2d: build the Python runtime adapter images ─────────
  # Each bundles the upstream AGT wheels + kars-agt-mesh (in-repo) + the
  # runtime adapter. Hermes uses native runners for both default Kind arches;
  # other adapters retain their existing amd64 builds.
  build-runtimes:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    name: Build + push ${{ matrix.runtime.ghcr }} (${{ matrix.runtime.arch || 'amd64' }}, PUBLIC GHCR)
    needs: [prepare, build-agt-wheels]
    runs-on: ${{ matrix.runtime.runner || 'ubuntu-22.04' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - { name: langgraph,     ghcr: kars-runtime-langgraph }
          # NOTE: langgraph-ts is intentionally NOT published yet — its image
          # fails to compile (src/otel.ts uses removed OpenTelemetry APIs:
          # `Resource` / `addSpanProcessor`). The CLI lists it as an OPTIONAL
          # import (required:false) so its absence never breaks a deploy. Re-add
          # this matrix entry once the runtime builds again. Tracked in #474.
          - { name: hermes, ghcr: kars-runtime-hermes, arch: amd64, runner: ubuntu-22.04, suffix: "-amd64" }
          - { name: hermes, ghcr: kars-runtime-hermes, arch: arm64, runner: ubuntu-24.04-arm, suffix: "-arm64" }
          - { name: maf-python,    ghcr: kars-runtime-maf-python }
          - { name: anthropic,     ghcr: kars-runtime-anthropic }
          - { name: openai-agents, ghcr: kars-runtime-openai-agents }
          - { name: pydantic-ai,   ghcr: kars-runtime-pydantic-ai }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download AGT wheels into build context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agt-wheels-${{ env.VERSION }}
          path: runtimes/wheels/

      - name: Guard — wheels staged + kars-agt-mesh present
        run: |
          python3 - <<'PY'
          import pathlib, platform, runpy
          select = runpy.run_path("runtimes/install-agt-wheels.py")["select_wheels"]
          select(pathlib.Path("runtimes/wheels"), platform.machine())
          PY
          test -f runtimes/agt-mesh-python/pyproject.toml \
            || { echo "::error::kars-agt-mesh source missing from checkout"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.runtime.ghcr }} (PUBLIC)
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: .
          file: sandbox-images/${{ matrix.runtime.name }}/Dockerfile
          push: true
          platforms: linux/${{ matrix.runtime.arch || 'amd64' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.runtime.ghcr }}:${{ env.IMAGE_VERSION }}${{ matrix.runtime.suffix }}
            ${{ needs.prepare.outputs.prerelease == 'false' && format('{0}/{1}:latest{2}', env.REGISTRY, matrix.runtime.ghcr, matrix.runtime.suffix) || '' }}
          build-args: |
            VERSION=${{ env.VERSION }}
          sbom: true
          provenance: true

      - name: Attest build provenance (GitHub-signed, pushed to registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.runtime.ghcr }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record image build receipt
        if: matrix.runtime.name != 'hermes'
        run: |
          mkdir -p image-receipts
          jq -n --arg name '${{ matrix.runtime.ghcr }}' --arg repository '${{ env.REGISTRY }}/${{ matrix.runtime.ghcr }}' --arg digest '${{ steps.push.outputs.digest }}' \
            '{name: $name, repository: $repository, digest: $digest}' > image-receipts/${{ matrix.runtime.ghcr }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: matrix.runtime.name != 'hermes'
        with:
          name: image-${{ matrix.runtime.ghcr }}-${{ env.VERSION }}
          path: image-receipts/*.json
          if-no-files-found: error

      - name: Make package public (best-effort; may need one-time manual toggle)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/azure/packages/container/${{ matrix.runtime.ghcr }}/visibility" \
            -f visibility=public \
          || echo "::warning::Could not set ${{ matrix.runtime.ghcr }} public via API; set it once manually."

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.runtime.ghcr }}:${{ env.IMAGE_VERSION }}${{ matrix.runtime.suffix }}
          format: spdx-json
          output-file: sbom-${{ matrix.runtime.ghcr }}${{ matrix.runtime.suffix }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sbom-${{ matrix.runtime.ghcr }}-${{ env.VERSION }}${{ matrix.runtime.suffix }}
          path: sbom-${{ matrix.runtime.ghcr }}${{ matrix.runtime.suffix }}.spdx.json
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign keyless sign image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ matrix.runtime.ghcr }}@${{ steps.push.outputs.digest }}

  # ─── Stage 2e: build the AGT mesh relay + registry images ──────
  # kars dev / up run the AGT relay + registry for the mesh. They are built
  # from the pinned AGT owner wheels on the shared AL3 distroless recipe.
  # Publishing them lets `kars dev --release` pull everything — no AGT clone.
  # AGT relay + registry — built on NATIVE per-arch runners so they run
  # natively on arm64 kind nodes (Apple Silicon). The AGT Python image is
  # multi-arch-capable; amd64-only would ImagePullBackOff / "exec format
  # error" on an arm64 kind cluster, blocking `kars dev --release
  # --target local-k8s` on a Mac. merge-mesh fuses the per-arch tags below.
  build-mesh:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    name: Build agentmesh-${{ matrix.component }} (${{ matrix.arch }}, native)
    needs: [prepare, build-agt-wheels]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        component: [relay, registry]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download pinned AGT owner and native ACS wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agt-wheels-${{ env.VERSION }}
          path: runtimes/wheels/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push agentmesh-${{ matrix.component }}:${{ env.VERSION }}-${{ matrix.arch }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: .
          file: sandbox-images/agentmesh/Dockerfile
          push: true
          sbom: true
          provenance: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/kars-agentmesh-${{ matrix.component }}:${{ env.IMAGE_VERSION }}-${{ matrix.arch }}
          build-args: |
            COMPONENT=${{ matrix.component }}

  # Merge the per-arch relay/registry tags into multi-arch manifests + sign.
  merge-mesh:
    if: ${{ needs.prepare.outputs.recovery != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    name: Merge + sign agentmesh manifests
    needs: [prepare, build-mesh]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [relay, registry]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (:VERSION + :latest)
        id: manifest
        run: |
          NAME="kars-agentmesh-${{ matrix.component }}"
          LATEST_ARGS=()
          if [ "$PRERELEASE" = false ]; then LATEST_ARGS=(-t "${REGISTRY}/${NAME}:latest"); fi
          docker buildx imagetools create \
            -t "${REGISTRY}/${NAME}:${VERSION}" \
            "${LATEST_ARGS[@]}" \
            "${REGISTRY}/${NAME}:${VERSION}-amd64" \
            "${REGISTRY}/${NAME}:${VERSION}-arm64"
          DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${NAME}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ env.IMAGE_VERSION }}

      - name: Record image build receipt
        run: |
          mkdir -p image-receipts
          jq -n --arg name 'kars-agentmesh-${{ matrix.component }}' --arg repository '${{ env.REGISTRY }}/kars-agentmesh-${{ matrix.component }}' --arg digest '${{ steps.manifest.outputs.digest }}' \
            '{name: $name, repository: $repository, digest: $digest}' > image-receipts/kars-agentmesh-${{ matrix.component }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: image-kars-agentmesh-${{ matrix.component }}-${{ env.VERSION }}
          path: image-receipts/*.json
          if-no-files-found: error

      - name: Make package public (best-effort; may need one-time manual toggle)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/azure/packages/container/kars-agentmesh-${{ matrix.component }}/visibility" \
            -f visibility=public \
          || echo "::warning::Could not set kars-agentmesh-${{ matrix.component }} public via API; set it once manually."

      - name: Attest build provenance (GitHub-signed, pushed to registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/kars-agentmesh-${{ matrix.component }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/kars-agentmesh-${{ matrix.component }}:${{ env.IMAGE_VERSION }}
          format: spdx-json
          output-file: sbom-kars-agentmesh-${{ matrix.component }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sbom-kars-agentmesh-${{ matrix.component }}-${{ env.VERSION }}
          path: sbom-kars-agentmesh-${{ matrix.component }}.spdx.json
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign keyless sign manifest
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/kars-agentmesh-${{ matrix.component }}@${{ steps.manifest.outputs.digest }}

  # ─── Stage 3: pack @kars/cli for GitHub Release distribution ───
  cli-pack:
    name: Package release-bound charts and CLI; attempt npm OIDC publication
    needs: [prepare, build-images, merge-native-images, merge-sandbox, build-runtimes, merge-mesh]
    if: ${{ !cancelled() && !failure() && needs.prepare.result == 'success' && (needs.prepare.outputs.recovery == 'true' || !contains(needs.*.result, 'skipped')) }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      NPM_CHANNEL: ${{ needs.prepare.outputs.npmTag }}
      RELEASE_RECOVERY_MANIFEST: ${{ needs.prepare.outputs.recoveryManifest }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    timeout-minutes: 25
    outputs:
      npm_outcome: ${{ steps.npm.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.prepare.outputs.recovery != 'true' }}
        with:
          pattern: image-*-${{ env.VERSION }}
          path: image-receipts
          merge-multiple: true
      - name: Recover original image receipts by verified artifact IDs and archive digests
        if: ${{ needs.prepare.outputs.recovery == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/release_recovery.py download --kind images --destination image-receipts
      - name: Verify anonymous image access and resolve external seccomp prerequisite
        run: |
          # No registry login in this job: private packages must block public packaging.
          for receipt in image-receipts/*.json; do
            repository=$(jq -r .repository "$receipt")
            expected=$(jq -r .digest "$receipt")
            actual=$(docker buildx imagetools inspect "$repository:$IMAGE_VERSION" --format '{{.Manifest.Digest}}')
            test "$actual" = "$expected"
          done
          digest=$(docker buildx imagetools inspect mcr.microsoft.com/azurelinux/base/core:3.0 --format '{{.Manifest.Digest}}')
          jq -n --arg digest "$digest" \
            '{name: "seccomp-installer", repository: "mcr.microsoft.com/azurelinux/base/core", digest: $digest, origin: "external Microsoft base; not built or signed by this release"}' \
            > image-receipts/seccomp-installer.json
      - name: Install locked CLI dependencies
        working-directory: cli
        run: npm ci --no-audit --no-fund
      - name: Bind clean checkout charts to exact published image receipts
        run: node cli/scripts/release-artifacts.mjs prepare . release-packages "$VERSION" image-receipts
      - name: Restore exact locked chart dependencies before CLI bundling
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build deploy/helm/kars
          git diff --exit-code -- deploy/helm/kars/Chart.lock
          helm dependency build bridge/deploy/helm/kars-bridge
      - name: Test release packaging contracts offline
        run: node --test cli/scripts/release-artifacts.test.mjs
      - name: Build and pack requested CLI version
        working-directory: cli
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # npm version strips SemVer build metadata; preserve the exact selected version.
          node scripts/release-artifacts.mjs cli-version . "$PACKAGE_VERSION"
          npm run build
          npm pack --pack-destination ../release-packages
          node -e 'const p=require("./package.json"); if(p.version!==process.env.PACKAGE_VERSION) throw Error("Wrong CLI version")'
      - name: Package both self-contained Helm charts
        run: |
          helm package deploy/helm/kars --destination release-packages
          helm package bridge/deploy/helm/kars-bridge --destination release-packages
          cp deploy/helm/kars/values-generic.yaml release-packages/core-values-generic.yaml
          cp deploy/helm/kars/values-kind-beta.yaml release-packages/core-values-kind-beta.yaml
          cp bridge/deploy/helm/kars-bridge/values-kind-beta.yaml release-packages/bridge-values-kind-beta.yaml
      - name: Attest charts and authoritative downloadable CLI tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-packages/*.tgz'
      # Configure the npm trusted publisher for Azure/kars and this workflow once.
      # The signed GitHub tarball is authoritative even when npm rejects publication.
      - name: Upgrade npm for OIDC publishing
        id: npm_setup
        continue-on-error: true
        run: npm install -g npm@11.6.2
      - name: Publish the exact attested tarball using the explicit npm channel
        id: npm
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          NPM_SETUP: ${{ steps.npm_setup.outcome }}
        run: |
          outcome=not-published
          tarball="release-packages/kars-runtime-cli-${PACKAGE_VERSION}.tgz"
          test -s "$tarball"
          if [[ "$PACKAGE_VERSION" == *+* ]]; then
            outcome=unsupported-build-metadata
          elif [ "$NPM_SETUP" != success ]; then
            outcome=tooling-unavailable
          elif npm view "@kars-runtime/cli@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            outcome=already-exists-unverified
          elif npm publish "$tarball" --provenance --access public --tag "$NPM_CHANNEL"; then
            outcome=published
          else
            outcome=publish-failed
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          jq -n --arg version "$PACKAGE_VERSION" --arg channel "$NPM_CHANNEL" --arg outcome "$outcome" \
            '{package: "@kars-runtime/cli", version: $version, channel: $channel, outcome: $outcome, authoritative: "GitHub Release CLI tarball"}' > release-packages/npm-publication.json
          echo "npm channel: $NPM_CHANNEL; outcome: $outcome. Use the signed release tarball." >> "$GITHUB_STEP_SUMMARY"
          if [ "$outcome" != published ]; then echo "::warning::npm $outcome; no npm publication success is claimed"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: packages-${{ env.VERSION }}
          path: release-packages/
          if-no-files-found: error
          retention-days: 90

  # ─── Stage 4: assemble + publish the PUBLIC GitHub Release ─────
  release:
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.imageTag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PRODUCER_SOURCE: ${{ needs.prepare.outputs.producerSource }}
      PRODUCER_RUN_ID: ${{ needs.prepare.outputs.producerRunId }}
      RELEASE_RECOVERY_MANIFEST: ${{ needs.prepare.outputs.recoveryManifest }}
    name: Create PUBLIC GitHub Release
    needs: [prepare, build-binaries, build-images, build-sandbox-base, build-sandbox, merge-sandbox, build-runtimes, build-mesh, merge-mesh, cli-pack]
    if: ${{ !cancelled() && !failure() && needs.prepare.result == 'success' && needs.cli-pack.result == 'success' && (needs.prepare.outputs.recovery == 'true' || !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write       # create the GitHub Release + upload assets
      id-token: write        # cosign keyless sign-blob + provenance OIDC
      attestations: write    # actions/attest-build-provenance for assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Rust binaries
        if: ${{ needs.prepare.outputs.recovery != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kars-binaries-${{ env.VERSION }}
          path: ./release-binaries

      - name: Recover original binaries by verified artifact IDs and archive digests
        if: ${{ needs.prepare.outputs.recovery == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/release_recovery.py download --kind binaries --destination release-binaries

      - name: Package per-architecture binary archives
        run: |
          mkdir -p release-artefacts
          for arch in amd64 arm64; do
            tar -czf "release-artefacts/kars-binaries-${VERSION}-linux-${arch}.tar.gz" -C "release-binaries/$arch" .
          done

      - name: Download charts, CLI and release profiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-${{ env.VERSION }}
          path: ./release-artefacts
          merge-multiple: true

      - name: Download SBOMs
        if: ${{ needs.prepare.outputs.recovery != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*-${{ env.VERSION }}
          path: ./release-artefacts
          merge-multiple: true

      - name: Download per-architecture runtime SBOMs
        if: ${{ needs.prepare.outputs.recovery != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*-${{ env.VERSION }}-*
          path: ./release-artefacts
          merge-multiple: true

      - name: Recover original SBOMs by verified artifact IDs and archive digests
        if: ${{ needs.prepare.outputs.recovery == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/release_recovery.py download --kind sboms --destination release-artefacts

      - name: List artefacts
        run: find ./release-artefacts -type f | sort

      - name: Resolve CLI tarball name
        id: cli
        run: |
          NAME=$(find ./release-artefacts -maxdepth 2 -name 'kars-runtime-cli-*.tgz' -printf '%f\n' | head -1)
          if [ -z "$NAME" ]; then
            echo "::error::No CLI tarball found under release-artefacts."
            exit 1
          fi
          echo "tarball=$NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::CLI tarball: $NAME"

      - name: Build release manifest from verified receipts and npm outcome
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CLI_TARBALL: ${{ steps.cli.outputs.tarball }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = './release-artefacts/';
          const images = JSON.parse(readFileSync(root + 'release-images.json'));
          const npm = JSON.parse(readFileSync(root + 'npm-publication.json'));
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.VERSION}`;
          const version = process.env.RELEASE_VERSION;
          const recovery = process.env.RELEASE_RECOVERY_MANIFEST ? JSON.parse(process.env.RELEASE_RECOVERY_MANIFEST) : null;
          const packaging = { commit: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT };
          const manifest = {
            schema_version: '2', version: process.env.VERSION,
            commit: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF,
            packaging,
            producer: recovery?.producer ?? { repository: process.env.GITHUB_REPOSITORY, source_sha: process.env.PRODUCER_SOURCE, run_id: process.env.PRODUCER_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT },
            recovery: recovery ? { binding: 'release-recovery.json', rebuilt_producers: false } : null,
            build_time: new Date().toISOString(), prerelease: process.env.PRERELEASE === 'true',
            containers: images, npm,
            cli_install: `npm i -g ${base}/${process.env.CLI_TARBALL}`,
            charts: ['kars', 'kars-bridge'].map(name => ({ name, version, url: `${base}/${name}-${version}.tgz` })),
            qualification: 'Artifact publication only; operator prerequisites and installed customer acceptance are separate.',
            excluded: ['langgraph-ts (not published; requires a separately qualified operator image)', 'optional external Entra sidecar and standalone Inspektor Gadget (operator-qualified)'],
          };
          writeFileSync(root + 'release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          if (recovery) writeFileSync(root + 'release-recovery.json', JSON.stringify(recovery, null, 2) + '\n');
          JS

      # ── Sign the release ASSETS (Scorecard: Signed-Releases) ─────────
      # Images are already cosign-signed + SBOM'd + provenance-attested.
      # Here we do the same for the downloadable GitHub Release assets:
      #   1. a SHA256SUMS manifest over every asset,
      #   2. a cosign keyless signature of that manifest (downloadable
      #      bundle → `cosign verify-blob`), and
      #   3. a GitHub build-provenance (SLSA) attestation of the manifest
      #      (`gh attestation verify SHA256SUMS --repo <repo>`).
      # Signing the checksums manifest transitively covers every listed
      # asset by hash.
      - name: Generate SHA256SUMS over release assets
        working-directory: ./release-artefacts
        run: |
          # Hash every regular file except the manifest itself (and any
          # pre-existing signature) so the list is stable + self-consistent.
          find . -type f \
            ! -name 'SHA256SUMS' \
            ! -name 'SHA256SUMS.*' \
            -printf '%P\n' | sort | while read -r f; do
              sha256sum "$f"
            done > SHA256SUMS
          echo "::notice::SHA256SUMS:"; cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign keyless sign the checksums manifest
        working-directory: ./release-artefacts
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS
          echo "::notice::Wrote SHA256SUMS.cosign.bundle (verify: cosign verify-blob --bundle SHA256SUMS.cosign.bundle --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS)"

      - name: Attest build provenance for the checksums manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./release-artefacts/SHA256SUMS

      - name: Create PUBLIC GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          files: ./release-artefacts/**/*
          body: |
            ## Kars + Bridge ${{ env.VERSION }}

            These are release artifacts, not a claim of installed beta acceptance.
            Prepare the private Core/Bridge operator values described in the
            [Helm guide](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/bridge/docs/public-beta-helm.md#release-artifacts-and-the-two-helm-commands).
            Genuine HTTPS OIDC, DNS/TLS, RBAC, provider credentials, supported Kubernetes/CNI/storage,
            schema API destinations and reviewed isolation prerequisites must already exist.
            Install fresh Core, then optional Bridge; do not use this cold path to upgrade existing Core:

            ```bash
            RELEASE=https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}
            helm install kars "$RELEASE/kars-${{ needs.prepare.outputs.version }}.tgz" --namespace kars-system --create-namespace --values "$RELEASE/core-values-generic.yaml" --values core.yaml --values "$RELEASE/core-release-images.yaml" --wait --timeout 20m
            helm install kars-bridge "$RELEASE/kars-bridge-${{ needs.prepare.outputs.version }}.tgz" --namespace kars-system --values bridge.yaml --values "$RELEASE/bridge-release-images.yaml" --wait --timeout 20m
            ```

            Charts include locked dependencies and bind images to the verified producer's immutable digests.
            Producer source: `${{ needs.prepare.outputs.producerSource }}`;
            producer run: https://github.com/${{ github.repository }}/actions/runs/${{ needs.prepare.outputs.producerRunId }}.
            Packaging-only recovery: `${{ needs.prepare.outputs.recovery }}`. When recovered,
            `release-recovery.json` retains the original artifact IDs, archive hashes and build attribution;
            chart/CLI and checksum attestations identify this packaging workflow, not a new image/binary build.
            Downloadable generic/Kind overlays preserve the maintained profile checks;
            configure the reviewed values before either install. No automatic rollback for the cold lifecycle.
            Existing independently installed Core needs only the separately reviewed Bridge command.

            Authoritative matching CLI (no source checkout or compilation):
            ```bash
            npm i -g https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ steps.cli.outputs.tarball }}
            ```
            npm channel: `${{ needs.prepare.outputs.npmTag }}`;
            actual outcome: `${{ needs.cli-pack.outputs.npm_outcome }}`.
            An existing npm version is not asserted to match this build. Prereleases do not advance stable latest.

            `release-manifest.json` records every image digest, chart URL and npm outcome.
            Kars-built images are cosign keyless-signed; build jobs attach SBOM/provenance.
            The external seccomp base and separately pinned OCI gadget artifacts retain their own upstream custody.
            `SHA256SUMS` covers the charts, CLI, profiles, manifest and SBOM assets:
            ```bash
            sha256sum -c SHA256SUMS
            cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
            gh attestation verify SHA256SUMS --repo ${{ github.repository }}
            ```
