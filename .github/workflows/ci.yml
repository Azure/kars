name: CI

on:
  push:
    branches: [main, dev, kars-bridge]
  pull_request:
    branches: [main, dev, kars-bridge, 'public/pr*']
  workflow_call:      # allow reuse from release.yml
    inputs:
      benchmark_base_sha:
        description: Established ancestor commit for manually triggered benchmark comparisons
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      benchmark_base_sha:
        description: Full ancestor commit SHA to compare against (must differ from candidate)
        type: string
        required: true

permissions:
  contents: read

# Cancel superseded runs on the same ref. PRs that push rapid-fire commits
# (or rebases) immediately kill prior in-flight runs instead of letting them
# burn CI minutes to completion. We still gate on the *final* push, so the
# merge check is unaffected. Push events on dev/main do NOT cancel — the
# group includes the workflow name + event name to keep branch protection
# runs intact.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Change classifier ─────────────────────────────────────────────
  # Emits `code=true` when anything other than docs/assets is touched.
  # Root documentation-only PRs skip the
  # ~19min Rust build, E2E, chaos and bench rows. Required jobs still
  # RUN (so their status reports) but short-circuit their expensive
  # steps. Shipped skills and unknown source paths remain in scope.
  # Non-PR events (push/dispatch/call) always run the full set.
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: |
          python3 ci/bridge_contracts.py --output code \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

  # ── ONE Rust compile per CI run ───────────────────────────────────
  # This job is the SINGLE source of compiled Rust artefacts for the
  # entire workflow. Every other job that needs a Rust binary
  # (rust-test, bench-regression, e2e, image builds) downloads the
  # artifact uploaded here instead of compiling again.
  #
  # Output target: x86_64-unknown-linux-musl static-pie. Matches the
  # FROM mcr.microsoft.com/azurelinux/distroless/base:3.0 runtime
  # used by every kars Rust Dockerfile.
  build-rust:
    name: Rust Build & Test (Controller + Inference Router)
    needs: changes
    # Pinned to ubuntu-22.04 for glibc 2.35 — binaries produced here
    # run inside `mcr.microsoft.com/azurelinux/distroless/base:3.0`
    # which ships glibc 2.38. Newer runners (ubuntu-24.04, glibc 2.39)
    # could emit symbols AL3 can't resolve.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/bridge/
          sparse-checkout-cone-mode: false
      - name: Require standalone core checkout
        working-directory: .
        run: test ! -e bridge
      - name: Check multi-stage Rust image build inputs
        run: python3 -m unittest ci.test_rust_image_context
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Single shared cache key for the whole workflow. Downstream
          # jobs (chaos-tier, bench-regression, e2e-kind) restore from
          # this with save-if: false so the host target/ stays warm.
          shared-key: rust-glibc-release
      - name: Install cargo-nextest
        if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-nextest
      - name: cargo fmt
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo build --release (host glibc — single workspace compile)
        if: needs.changes.outputs.code == 'true'
        # ONE cargo invocation produces every Rust binary kars ships.
        # Targets the host glibc (ubuntu-22.04 = glibc 2.35); the
        # binaries run inside `mcr.microsoft.com/azurelinux/distroless/base:3.0`
        # which ships glibc 2.38 (newer = backward-compatible). The runtime
        # image just COPYs them in — no cargo runs inside Docker. Saves
        # ~4×8 min vs per-image builds. aws-lc-sys (pulled in via
        # transitive oci-client→reqwest) compiles natively with the
        # runner's gcc.
        run: cargo build --release --workspace
      - name: Legacy Hermes HTTPS client test dependency
        if: needs.changes.outputs.code == 'true'
        run: python3 -m pip install 'httpx==0.28.1'
      - name: cargo nextest run (release)
        if: needs.changes.outputs.code == 'true'
        # Reuses the target/release/ artefacts the previous step just
        # compiled. Only the test harnesses need to link (~30-60s).
        run: cargo nextest run --workspace --release --no-fail-fast
      - name: Stage binaries (per-arch layout matches release-internal.yml Dockerfiles)
        if: needs.changes.outputs.code == 'true'
        run: |
          # CI runner is always amd64. release-internal.yml additionally
          # builds arm64; the per-arch subdir layout matches the
          # ${TARGETARCH} buildx substitution in the Dockerfiles.
          mkdir -p ./bin/amd64
          cp target/release/kars-controller         ./bin/amd64/
          cp target/release/kars-inference-router   ./bin/amd64/
          cp target/release/kars-a2a-gateway        ./bin/amd64/
          cp target/release/kars-conformance-runner ./bin/amd64/
          file ./bin/amd64/*
          ( cd ./bin && sha256sum amd64/* | tee SHA256SUMS )
      - name: Upload binaries
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-binaries-${{ github.sha }}
          path: ./bin/
          retention-days: 1




  cargo-audit:
    name: Rust Dependency Audit (RustSec advisories)
    runs-on: ubuntu-latest
    # Non-blocking on the PR (advisories can appear overnight) but visible in CI.
    # Promote to required-check once the advisory noise is triaged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only meaningful when dependency surface changes. Doc-only PRs can't
      # introduce an advisory.
      - name: Detect dependency-affecting changes
        id: paths
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=50 origin "$base" "$head" 2>/dev/null || true
          if git diff --name-only "$base" "$head" 2>/dev/null \
             | grep -E '(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^\.github/workflows/ci\.yml$' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No dependency-affecting paths changed — skipping cargo audit"
          fi

      # Prebuilt binary (~2s) instead of `cargo install --locked` (~2-3 min).
      - name: Install cargo-audit
        if: steps.paths.outputs.run == 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-audit
      - name: Run cargo audit
        if: steps.paths.outputs.run == 'true'
        run: cargo audit --deny warnings

  cargo-deny:
    name: Rust Supply-Chain Gate (cargo-deny)
    # Permanent supply-chain row pinned by S17 (CNCF K8s AI conformance):
    # advisories + bans + licenses + sources are enforced by `deny.toml`.
    # Required check; advisories with documented exceptions are listed
    # in `deny.toml` under `[advisories.ignore]`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect dependency-affecting changes
        id: paths
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=50 origin "$base" "$head" 2>/dev/null || true
          if git diff --name-only "$base" "$head" 2>/dev/null \
             | grep -E '(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^\.github/workflows/ci\.yml$' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No dependency-affecting paths changed — skipping cargo deny"
          fi

      - name: Install cargo-deny
        if: steps.paths.outputs.run == 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-deny
      - name: Run cargo deny check
        if: steps.paths.outputs.run == 'true'
        run: cargo deny check

  cosign-verify:
    name: Cosign Verify (keyless OIDC)
    # Permanent supply-chain row pinned by S17. Verifies that the latest
    # Kars container images are signed against a known Fulcio
    # certificate-identity (the GitHub Actions OIDC issuer of this repo)
    # before downstream jobs consume them. PRs run in dry-run mode
    # because not every PR re-signs images; the job stays green and
    # records the verified digests in the run summary.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@4959ce089c160fddf62f7b42464195ba1a56d382 # v3.6.0
        with:
          cosign-release: "v2.4.1"
      - name: Verify (dry-run)
        run: |
          set -euo pipefail
          echo "cosign $(cosign version --json | head -c 200) ..."
          # Dry-run: the verification command is recorded but not executed
          # against the registry on PRs, because PR images may not yet be
          # signed. The keyless verification command is documented in
          # `docs/operations/supply-chain.md`.
          cat <<'EOF'
          cosign verify \
            --certificate-identity-regexp "^https://github.com/Azure/kars/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            <image>
          EOF

  cli-build:
    name: CLI Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/bridge/*
            /bridge/deploy/
            !/bridge/deploy/*
            /bridge/deploy/rbac.yaml
            /bridge/deploy/helm/
            !/bridge/deploy/helm/*
            /bridge/deploy/helm/kars-bridge/
          sparse-checkout-cone-mode: false
      - name: Require CLI charts without Bridge runtime sources
        working-directory: .
        run: |
          test -f deploy/helm/kars/Chart.yaml
          test -f bridge/deploy/helm/kars-bridge/Chart.yaml
          test ! -e bridge/bff
          test ! -e bridge/web
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Check committed schema bootstrap bundle
        run: npm run check:schema-hook
      - run: npm run build
      - run: npm test
      # S17.A: SCA gate — fail on `high` or `critical` advisories in
      # CLI dependencies. Lower severities don't fail the build but
      # are visible in CI logs. Matches the cargo-audit job's posture
      # of denying warnings (cargo's default warning bar is roughly
      # equivalent to RUSTSEC `high`).
      - name: npm audit (CLI dependencies)
        run: node ../ci/npm-audit-bulk.mjs package-lock.json

  runtime-openclaw-build:
    name: Runtime OpenClaw Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtimes/openclaw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: "Build mesh-plugin (file: dep of runtime)"
        working-directory: mesh-plugin
        run: |
          npm install && npm run build
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: npm audit (Runtime OpenClaw dependencies)
        run: node ../../ci/npm-audit-bulk.mjs package-lock.json
      - name: Install LangGraph TypeScript locked dependencies
        working-directory: runtimes/langgraph-ts
        run: npm ci
      - name: Typecheck LangGraph TypeScript runtime
        working-directory: runtimes/langgraph-ts
        run: npm run typecheck
      - name: Build LangGraph TypeScript runtime
        working-directory: runtimes/langgraph-ts
        run: npm run build
      - name: Test LangGraph TypeScript telemetry exports
        working-directory: runtimes/langgraph-ts
        run: npm test

  mesh-plugin-build:
    name: Mesh Plugin Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesh-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: npm audit (Mesh Plugin dependencies)
        working-directory: mesh-plugin
        run: node ../ci/npm-audit-bulk.mjs package-lock.json

  headlamp-plugin-build:
    name: Headlamp Plugin Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/headlamp-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: Exercise patched checker with real TypeScript workers
        run: node --test checker/compile.node.mjs
      - run: npm run build
      - name: Headlamp frontend preparation contracts
        run: node --test ../../sandbox-images/headlamp/build-frontend.test.mjs patch-build-tool.test.mjs
      - name: Compile patched Headlamp build-tool examples
        run: |
          set -euo pipefail
          go version
          for example in consume publish; do
            (
              cd "node_modules/@kinvolk/headlamp-plugin/official-plugins/keda/test-files/$example"
              go test -mod=readonly ./...
            )
          done
      - name: npm audit (Headlamp dependencies)
        run: node ../../ci/npm-audit-bulk.mjs package-lock.json
      - name: Build the shipping Headlamp image without publishing
        id: headlamp_image
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/headlamp-evidence"
          docker build --platform linux/amd64 --progress=plain \
            --tag kars-headlamp:latest --file sandbox-images/headlamp/Dockerfile . \
            2>&1 | tee "$RUNNER_TEMP/headlamp-evidence/build.log"
          docker image inspect kars-headlamp:latest > "$RUNNER_TEMP/headlamp-evidence/image.json"
      - name: Extract and verify Headlamp build inputs
        id: headlamp_inputs
        working-directory: .
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' kars-headlamp:latest)"
          container_id="$(docker create "$image_id")"
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/usr/share/kars/headlamp/." "$RUNNER_TEMP/headlamp-evidence/"
          python3 ci/headlamp_build_evidence.py "$RUNNER_TEMP/headlamp-evidence"
          (
            cd "$RUNNER_TEMP/headlamp-evidence/frontend-build"
            node "$GITHUB_WORKSPACE/sandbox-images/headlamp/build-frontend.mjs" verify-lock
          )
      - name: Scan shipping Headlamp image at every severity
        id: headlamp_scan
        if: ${{ !cancelled() && steps.headlamp_image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          cache: 'false'
          scan-type: image
          image-ref: kars-headlamp:latest
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          list-all-pkgs: 'true'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/headlamp-evidence/image-scan.json
      - name: Scan canonical Headlamp lock inventory and plugin at every severity
        if: ${{ !cancelled() && steps.headlamp_inputs.outcome == 'success' }}
        working-directory: .
        run: |
          set -euo pipefail
          trivy --version | tee "$RUNNER_TEMP/headlamp-evidence/trivy-version.txt"
          grep -Eq '^Version: 0[.]70[.]0([[:space:]]|$)' "$RUNNER_TEMP/headlamp-evidence/trivy-version.txt"
          failed=0
          for source in frontend-lock frontend-inventory plugin-lock; do
            case "$source" in
              frontend-lock) mode=fs; input="$RUNNER_TEMP/headlamp-evidence/frontend-build" ;;
              frontend-inventory) mode=sbom; input="$RUNNER_TEMP/headlamp-evidence/frontend.cdx.json" ;;
              plugin-lock) mode=fs; input=tools/headlamp-plugin ;;
            esac
            options=()
            if [ "$mode" = fs ]; then options+=(--include-dev-deps); fi
            trivy "$mode" "${options[@]}" --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --ignore-unfixed=false --list-all-pkgs --format json --exit-code 1 \
              --output "$RUNNER_TEMP/headlamp-evidence/$source-scan.json" "$input" || failed=1
            if [ "$mode" = fs ]; then
              python3 ci/headlamp_build_evidence.py --npm-inventory \
                "$RUNNER_TEMP/headlamp-evidence/$source-scan.json" || failed=1
            fi
          done
          exit "$failed"
      - name: Export qualified Headlamp image for same-run Kind
        working-directory: .
        run: docker save --output "$RUNNER_TEMP/headlamp-image.tar" kars-headlamp:latest
      - name: Retain qualified Headlamp image for same-run Kind
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kind-headlamp-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headlamp-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Retain Headlamp qualification evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: headlamp-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headlamp-evidence/
          if-no-files-found: warn

  managed-mcp:
    name: Managed MCP Dependencies & Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandbox-images/mcp-everything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sandbox-images/mcp-everything/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Audit managed MCP dependencies
        run: node ../../ci/npm-audit-bulk.mjs package-lock.json

  managed-playwright:
    name: Managed Playwright AL3 (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the native AL3 browser image
        run: docker build -t kars-mcp-playwright:latest sandbox-images/mcp-playwright
      - name: Verify the immutable offline browser
        run: |
          docker run --rm --pull=never --network=none --read-only \
            --user=1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=4g --memory-swap=4g --cpus=2 --pids-limit=256 \
            --tmpfs=/tmp:rw,nosuid,nodev,noexec,size=1g \
            --entrypoint=sh kars-mcp-playwright:latest \
            /app/browser-platform.sh npm test

  python-sidecar:
    name: Python Lint & Test (AGT Sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for AGT sidecar code
        id: check
        run: |
          if [ -f agt-sidecar/pyproject.toml ] || [ -f agt-sidecar/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AGT sidecar not yet present — skipping lint & test"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
      - name: Install and test
        if: steps.check.outputs.exists == 'true'
        run: |
          cd agt-sidecar
          pip install -e ".[dev]"
          python -m ruff check .
          python -m pytest

  hermes-runtime:
    name: Hermes Runtime (Python) Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install kars-agt-mesh (sibling dep) + hermes (+dev extras)
        run: |
          python -m pip install --upgrade pip
          # hermes plugin imports kars_agt_mesh at module load, so the sibling
          # in-repo package must be installed first; matches the order in
          # sandbox-images/hermes/Dockerfile.
          pip install -e runtimes/agt-mesh-python
          pip install -e "runtimes/hermes[dev]"
      - name: Install the image-pinned Hermes runtime for native tests
        env:
          HERMES_DISABLE_LAZY_INSTALLS: '1'
          HERMES_SKIP_NODE_BOOTSTRAP: '1'
        run: |
          hermes_commit=$(sed -n 's/^ARG HERMES_COMMIT=\([a-f0-9]\{40\}\)$/\1/p' sandbox-images/hermes/Dockerfile)
          test "${#hermes_commit}" -eq 40
          hermes_source="$RUNNER_TEMP/kars-hermes-source"
          git init -q "$hermes_source"
          git -C "$hermes_source" fetch --depth=1 https://github.com/NousResearch/hermes-agent.git "$hermes_commit"
          git -C "$hermes_source" checkout --detach -q FETCH_HEAD
          test "$(git -C "$hermes_source" rev-parse HEAD)" = "$hermes_commit"
          (cd sandbox-images/hermes && sha256sum --strict --check hermes-source-SHA256SUMS)
          git -C "$hermes_source" apply "$GITHUB_WORKSPACE/sandbox-images/hermes/hermes-dependency-fixes.patch"
          cp sandbox-images/hermes/hermes-uv.lock "$hermes_source/uv.lock"
          git -C "$hermes_source" apply "$GITHUB_WORKSPACE/sandbox-images/hermes/hermes-foundry-bounds.patch"
          git -C "$hermes_source" apply "$GITHUB_WORKSPACE/sandbox-images/hermes/hermes-foundry-responses.patch"
          cp sandbox-images/hermes/azure-foundry-provider.py "$hermes_source/plugins/model-providers/azure-foundry/__init__.py"
          python -m pip install --constraint sandbox-images/hermes/hermes-core-constraints.txt --editable "$hermes_source"
          python -c "import importlib.metadata as m, importlib.util; assert m.version('hermes-agent') == '0.21.5'; assert importlib.util.find_spec('run_agent') is not None"
      - name: Run hermes ruff lint
        run: |
          cd runtimes/hermes
          python -m ruff check .
      - name: Run hermes pytest
        run: |
          cd runtimes/hermes
          python -m pytest -v

  kars-agt-mesh-python:
    name: kars-agt-mesh (Python AGT mesh transport) Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install kars-agt-mesh (+test extras)
        run: |
          cd runtimes/agt-mesh-python
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run kars_agt_mesh ruff lint
        run: |
          cd runtimes/agt-mesh-python
          python -m ruff check .
      - name: Run kars_agt_mesh pytest
        run: |
          cd runtimes/agt-mesh-python
          python -m pytest -v

  bicep-validate:
    name: Bicep Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: az bicep build --file deploy/bicep/main.bicep
      # Regression gate: every role assignment must be idempotent (principalId in
      # the name GUID) so identity rotation can't trigger RoleAssignmentUpdateNotPermitted.
      - name: RBAC idempotency gate
        run: python3 ci/bicep-rbac-idempotency.py

  sre-crd-schema:
    name: SRE CRD API Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFIG: ${{ github.workspace }}/.e2e-sre-schema-kubeconfig
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pinned tools and unmodified node configuration as e2e-kind.
      # Kind v0.24.0 defaults to the observed kindest/node:v1.31.0 image.
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          version: v0.24.0
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v4
        with:
          version: v1.30.5
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build same-source CLI for schema request parity
        working-directory: cli
        run: npm ci && npm run build
      - name: Require the compiled production schema request helper
        run: node tests/e2e/sre_authority/task_schema_payload.mjs check
      - name: Check public-schema diagnostic privacy
        run: PYTHONPATH=tests/e2e python3 -m unittest sre_authority.registration_schema_test sre_authority.bootstrap_probe_test sre_authority.binding_probe_test sre_authority.legacy_crds_test sre_authority.connection_proxy_test sre_authority.stage_diagnostics_test credential_schema_test credential_policy_schema_test sandbox_condition_schema_test eval_pod_admission_test private_consumption_test receipt_log_rotation_test governed_services_test cr_status_test
      - name: Create the same disposable API server as the real harness
        run: kind create cluster --name kars-e2e --config tests/e2e/kind-config.yaml --kubeconfig "$KUBECONFIG"
      - name: Prove native Sandbox condition generation pruning, retention and type validation
        run: PYTHONPATH=tests/e2e python3 -m sandbox_condition_schema
      - name: Prove native historical Helm wait orders CRDs before hooks and permits schema upgrades
        run: PYTHONPATH=tests/e2e python3 -m sre_authority.legacy_crd_probe
      - name: Reset disposable cluster after historical Helm proof
        run: |
          kind delete cluster --name kars-e2e
          kind create cluster --name kars-e2e --config tests/e2e/kind-config.yaml --kubeconfig "$KUBECONFIG"
      - name: Validate the SRE CRD against the actual API server
        id: sre_schema
        run: python3 tests/e2e/sre_authority/registration_schema.py --exercise
      - name: Prove shipped credential CEL with matching and mismatched native namespace UIDs
        id: credential_schema
        run: PYTHONPATH=tests/e2e python3 -m credential_schema
      - name: Prove shipped credential store, rebind and exposure policies against native types
        id: credential_policy_schema
        run: PYTHONPATH=tests/e2e python3 -m credential_policy_schema
      - name: Prove controller Pod admission with all chart policies and no image execution
        if: ${{ !cancelled() && steps.sre_schema.outcome == 'success' }}
        id: sre_bootstrap
        run: PYTHONPATH=tests/e2e python3 -m sre_authority.bootstrap_probe --retirement-bind-proof
      - name: Collect namespace-accessor candidate evidence without relaxing the failing production gate
        if: failure() && steps.sre_schema.outcome == 'failure'
        run: python3 tests/e2e/sre_authority/registration_schema.py --namespace-accessor-candidate --exercise
      - name: Upload only public CRD schema evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sre-crd-schema-${{ github.run_id }}
          path: |
            e2e-sre-schema-diag/versions.json
            e2e-sre-schema-diag/legacy-helm-readiness.json
            e2e-sre-schema-diag/migration-seed-*.json
            e2e-sre-schema-diag/validation.json
            e2e-sre-schema-diag/validation-instances.json
            e2e-sre-schema-diag/credential-namespace-uid.json
            e2e-sre-schema-diag/credential-policy-typechecking.json
            e2e-sre-schema-diag/sandbox-condition-generation.json
            e2e-sre-schema-diag/namespace-accessor-candidate.json
            e2e-sre-schema-diag/namespace-accessor-candidate-instances.json
            e2e-sre-schema-diag/bootstrap-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable schema cluster
        if: always()
        run: kind delete cluster --name kars-e2e

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/kars
      - name: Optional witness runtime, package and ownership contracts (no cluster)
        run: |
          python3 -m pip install -r deploy/ebpf-witness/tests/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/ebpf-witness/aggregator
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/ebpf-witness/tests -p test_chart.py
      - run: python3 tools/private-consumption-bundle.py --check
      - name: Preserve task admission defaults with reused legacy values
        run: python3 ci/helm-task-floor-compat.py
      - name: Render installation profiles
        run: |
          helm template kars deploy/helm/kars --namespace kars-system >/dev/null
          helm template kars deploy/helm/kars --namespace kars-system \
            --values deploy/helm/kars/values-local-dev.yaml >/dev/null
          helm template kars deploy/helm/kars --namespace kars-system \
            --values deploy/helm/kars/values-generic.yaml >/tmp/kars-generic.yaml
          grep -q 'name: agentmesh-relay' /tmp/kars-generic.yaml
          grep -q 'name: agentmesh-registry' /tmp/kars-generic.yaml
          helm template kars deploy/helm/kars --namespace kars-system \
            --values deploy/helm/kars/values-existing-aks.yaml >/tmp/kars-existing-aks.yaml
          grep -q 'ghcr.io/azure/kars-controller:latest' /tmp/kars-existing-aks.yaml
          grep -q 'name: agentmesh-relay' /tmp/kars-existing-aks.yaml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Restore existing chart-test runner
        run: npm ci --prefix cli
      - name: Local inference legacy-values regression
        run: |
          node cli/node_modules/vitest/vitest.mjs run \
            --config "$GITHUB_WORKSPACE/cli/vitest.config.ts" \
            --root deploy/helm/kars/tests

  inference-budget-api:
    name: Governed inference API and CEL (Kind v1.31)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v4
        with:
          version: v1.30.5
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          version: v0.24.0
      - name: Restore existing YAML and test dependencies
        run: npm ci --prefix cli
      - name: Verify public schema diagnostic and credential redaction boundaries
        run: node --test tests/e2e/budget-api-kubectl.test.mjs
      - name: Create disposable supported apiserver before any Rust image build
        run: kind create cluster --name kars-budget-api --image kindest/node:v1.31.0 --config tests/e2e/kind-config.yaml
      - name: Validate real CRD/CEL and Pod audience identity
        run: node tests/e2e/inference-budget-api.mjs
      - name: Remove only the disposable API fixture cluster
        if: always()
        run: kind delete cluster --name kars-budget-api

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trivy vulnerability scanner
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The previous incarnation of this job rebuilt the full sandbox image
      # (heavy npm install + multi-stage Dockerfile, ~25-50min) just to feed
      # it to a Trivy image scan. The build step intermittently hung on
      # GitHub-hosted runners with no log output, repeatedly cancelling the
      # whole CI run.
      #
      # Trivy filesystem mode scans the source tree directly: lockfiles
      # (package-lock.json, Cargo.lock), Dockerfiles, and IaC. It catches
      # the same CVE-in-dependency findings as image-mode without paying
      # for a docker build. Image-level OS-package CVEs are still caught
      # by the Dockerfile Lint job (hadolint) and by the upstream sandbox
      # base image's own publish-time scan.
      - name: Scan repository with Trivy (filesystem mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "container-results.sarif"
          # Skip vendored upstream code — we don't ship it as-is, and false
          # positives in upstream lockfiles drown out our own findings.
          skip-dirs: "vendor,node_modules,target,dist,build,.turbo"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        if: always() && hashFiles('container-results.sarif') != ''
        with:
          sarif_file: "container-results.sarif"

  dockerfile-lint:
    name: "Dockerfile Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install hadolint
        run: |
          wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
      - name: Lint Dockerfiles
        run: |
          IGNORE="--ignore DL3008 --ignore DL3013 --ignore DL3018 --ignore DL3006 --ignore DL4006 --ignore DL3003 --ignore DL3016 --ignore DL3059 --ignore DL3062 --ignore SC2015 --ignore SC2028"
          hadolint $IGNORE controller/Dockerfile
          hadolint $IGNORE inference-router/Dockerfile
          hadolint $IGNORE a2a-gateway/Dockerfile
          hadolint $IGNORE sandbox-images/conformance-runner/Dockerfile
          hadolint $IGNORE sandbox-images/openclaw/Dockerfile.base
          hadolint $IGNORE sandbox-images/openclaw/Dockerfile
          hadolint $IGNORE sandbox-images/mcp-playwright/Dockerfile

  chaos-tier:
    name: Chaos Tier (fault injection)
    needs: [changes, build-rust]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Phase 2 S16. Default `cargo test --all` does NOT run these tests; this
    # job runs them in parallel so PR signal stays fast. See
    # `docs/operations/chaos-tier.md`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: rust-glibc-release
          save-if: false
      # Scope to the chaos crate only. `--workspace --features chaos` would
      # re-execute the full ~1800-test suite already run by `rust-build` and
      # only add 22 chaos tests on top — wasting ~95% of the job's runtime.
      # The fault-injection tests live exclusively in `tests/chaos/`.
      - run: cargo test --package kars-chaos-tests --features chaos --tests --no-fail-fast

  kind-addon-images:
    name: AL3 add-on images for Kind
    needs: [changes, headlamp-plugin-build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Build locked CLI image catalog
        working-directory: cli
        run: npm ci && npm run build
      - name: Install Helm for pinned chart contracts
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Test candidate image preparation and actual chart contracts
        run: node --test tests/e2e/addon-images.test.mjs tests/e2e/addon-chart.test.mjs tests/e2e/addon-kubelet-trust.test.mjs
      - name: Download qualified same-run Headlamp image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kind-headlamp-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kind-headlamp
      - name: Import qualified Headlamp image
        run: docker load --input "$RUNNER_TEMP/kind-headlamp/headlamp-image.tar"
      - name: Build enabled add-ons using maintained AL3 recipes
        env:
          KARS_E2E_PREBUILT_HEADLAMP: '1'
        run: |
          set -euo pipefail
          node tests/e2e/addon-images.mjs build
          node tests/e2e/addon-images.mjs export
      - name: Retain same-source Kind images and identity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kind-addons-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .e2e-addon-images.tar
            .e2e-addon-images.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  e2e-kind:
    name: E2E (Kind)
    needs: [changes, build-rust, kind-addon-images]
    # Phase 3 S4: closes the audit gap "make test-e2e is not in CI".
    # Runs on every push to dev/main, manual dispatch, and PRs that
    # touch the runtime surface area (controller, router, helm chart,
    # sandbox image, e2e harness itself). Doc-only PRs skip this row
    # to keep PR signal fast — the path filter is the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Required by docker/build-push-action GHA cache backend
      # (cache-to: type=gha) used by the image pre-build steps below.
      actions: write
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/bridge/*
            /bridge/deploy/
            !/bridge/deploy/*
            /bridge/deploy/rbac.yaml
            /bridge/deploy/helm/
            !/bridge/deploy/helm/*
            /bridge/deploy/helm/kars-bridge/
          sparse-checkout-cone-mode: false
      - name: Require CLI charts without Bridge runtime sources
        working-directory: .
        run: |
          test -f deploy/helm/kars/Chart.yaml
          test -f bridge/deploy/helm/kars-bridge/Chart.yaml
          test ! -e bridge/bff
          test ! -e bridge/web

      - name: Detect runtime-affecting changes
        id: paths
        run: |
          python3 ci/bridge_contracts.py --output run --core-only \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        if: steps.paths.outputs.run == 'true'

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.paths.outputs.run == 'true'
        with:
          shared-key: rust-glibc-release
          # E2E builds via Docker (cargo runs inside the image, not on host),
          # so host target/ isn't hit. Keep the cache restore for the
          # occasional cargo invocation in the harness but don't pay the
          # save cost.
          save-if: false

      - name: Test bounded CI dependency acquisition
        run: python3 -m unittest discover -s ci/tests -p acquisition_test.py

      - name: Install kind
        if: steps.paths.outputs.run == 'true'
        # Official v0.24.0 checksum; bounded HTTPS acquisition, no tool-cache
        # fallback or implicit kubectl install. Cluster lifecycle is unchanged.
        run: python3 ci/acquire_test_tools.py kind

      - name: Install kubectl
        if: steps.paths.outputs.run == 'true'
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v4
        with:
          version: v1.30.5

      - name: Install Helm
        if: steps.paths.outputs.run == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Free disk before Docker builds
        if: steps.paths.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h

      - name: Set up Node for real SRE authority CLI acceptance
        if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Build locked CLI for Kind acceptance
        if: steps.paths.outputs.run == 'true'
        working-directory: cli
        run: npm ci && npm run build
      - name: SRE Kind unchanged Hermes HTTPS client dependency
        if: steps.paths.outputs.run == 'true'
        run: python3 -m pip install 'httpx==0.28.1'

      # Pre-built binaries from build-rust are COPY'd into the
      # distroless runtime images; no `cargo build` runs inside Docker.
      # Result: each image build is ~30s instead of ~8min.
      - name: Download pre-built kars binaries
        if: steps.paths.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kars-binaries-${{ github.sha }}
          path: ./bin/
      - name: chmod binaries
        if: steps.paths.outputs.run == 'true'
        # Per-arch layout (./bin/amd64/) matches release-internal.yml's
        # multi-arch Dockerfile expectations (${BIN_PATH_PREFIX}/${TARGETARCH}/...)
        run: find ./bin -type f -name 'kars-*' -exec chmod +x {} \;

      - name: Set up Docker Buildx
        if: steps.paths.outputs.run == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build controller image (distroless COPY)
        if: steps.paths.outputs.run == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: .
          file: controller/Dockerfile
          tags: kars-controller:e2e
          load: true
          # No cargo cache needed — the Dockerfile is a 5-line COPY now.

      - name: Build inference-router image (distroless COPY)
        if: steps.paths.outputs.run == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v6
        with:
          context: .
          file: inference-router/Dockerfile
          tags: kars-inference-router:e2e
          load: true
          # No cargo cache needed — the Dockerfile is a 5-line COPY now.

      - name: Download same-source enabled add-on images
        if: steps.paths.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kind-addons-${{ github.sha }}-${{ github.run_attempt }}
      - name: Import add-on images for fresh Kind
        if: steps.paths.outputs.run == 'true'
        run: docker load --input .e2e-addon-images.tar

      - name: Run e2e
        if: steps.paths.outputs.run == 'true'
        env:
          # The harness honours this to default to OpenClaw if unset;
          # the variable is plumbed through for future runtime matrix
          # expansion (Phase 3 S4 follow-up).
          KARS_E2E_RUNTIME: ${{ vars.KARS_E2E_RUNTIME || 'all' }}
          # E2E runs a single-node Kind cluster — multi-replica leader
          # election adds nothing but flake. Force single-replica + no
          # leader lease so the test environment is deterministic.
          KARS_E2E_CONTROLLER_REPLICAS: "1"
          KARS_E2E_DISABLE_LEADER_ELECTION: "1"
          # Both images were pre-built with buildx GHA cache above —
          # tell the harness to skip its in-process `docker build` and
          # just `kind load` the existing tags.
          KARS_E2E_SKIP_IMAGE_BUILD: "1"
          KARS_E2E_PREBUILT_ADDONS: "1"
        run: |
          set -euo pipefail
          make test-e2e

      - name: Upload diagnostics
        if: failure() && steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: |
            e2e-sre-schema-diag/versions.json
            e2e-sre-schema-diag/validation.json
            e2e-sre-schema-diag/registration-create.json
            e2e-sre-schema-diag/bootstrap-*.json
          retention-days: 7

  bench-regression:
    name: Bench Regression (criterion)
    needs: [changes, build-rust]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Compare both revisions on this runner, not against historical machine timings.
    # Normalize the bench profile explicitly; release package overrides otherwise
    # leak into benches and made the old measurements incomparable.
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      RUSTFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
      RUSTC_WRAPPER: ''
      CARGO_PROFILE_BENCH_OPT_LEVEL: '3'
      CARGO_PROFILE_BENCH_LTO: thin
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: '1'
      CARGO_PROFILE_BENCH_DEBUG: '0'
      CARGO_PROFILE_BENCH_DEBUG_ASSERTIONS: 'false'
      CARGO_PROFILE_BENCH_OVERFLOW_CHECKS: 'false'
      CARGO_PROFILE_BENCH_INCREMENTAL: 'false'
      CARGO_PROFILE_BENCH_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test benchmark gate
        run: python3 -m unittest ci.test_bench_regression
      - name: Resolve trusted event baseline
        id: baseline
        env:
          BENCHMARK_BASE_SHA: ${{ inputs.benchmark_base_sha }}
        run: |
          set -euo pipefail
          mkdir -p bench-evidence
          python3 ci/bench_regression.py --resolve-base | tee bench-evidence/base-output.txt >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > bench-evidence/candidate.sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.base_sha }}
          path: .bench-baseline
          persist-credentials: false
      - name: Verify comparable Criterion harnesses
        env:
          BENCH_BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: python3 ci/bench_regression.py --check-harness .bench-baseline "$BENCH_BASE_SHA"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: rust-glibc-release
          save-if: false
      - name: Measure baseline and candidate
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          rustc --version --verbose > bench-evidence/compiler.txt
          cargo --version > bench-evidence/cargo.txt
          lscpu > bench-evidence/cpu.txt
          env | sort | grep '^CARGO_PROFILE_BENCH_' > bench-evidence/profile.txt
          echo 'profile.bench.package.kars-controller.codegen-units=16' >> bench-evidence/profile.txt
          for revision in baseline candidate; do
            source="$GITHUB_WORKSPACE"
            if [[ "$revision" == baseline ]]; then source="$GITHUB_WORKSPACE/.bench-baseline"; fi
            for component in controller router; do
              package=kars-controller
              bench=reconciler_bench
              crate=controller
              if [[ "$component" == router ]]; then
                package=kars-inference-router
                bench=proxy_bench
                crate=inference-router
              fi
              cp "$source/$crate/benches/baselines.json" "bench-evidence/$revision-$component-policy.json"
              export CRITERION_HOME="$GITHUB_WORKSPACE/bench-evidence/$revision-$component-criterion"
              mkdir "$CRITERION_HOME"
              (cd "$source" && cargo bench --locked --package "$package" --bench "$bench" \
                --config 'profile.bench.package.kars-controller.codegen-units=16' \
                -- --save-baseline "$revision" --output-format bencher) 2>&1 \
                | tee "bench-evidence/$revision-$component.txt"
            done
          done
      - name: Compare controller on the same runner
        if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/bench_regression.py bench-evidence/baseline-controller-policy.json \
            bench-evidence/baseline-controller-criterion bench-evidence/candidate-controller-criterion \
            2>&1 | tee bench-evidence/comparison-controller.txt
      - name: Compare router on the same runner
        if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/bench_regression.py bench-evidence/baseline-router-policy.json \
            bench-evidence/baseline-router-criterion bench-evidence/candidate-router-criterion \
            2>&1 | tee bench-evidence/comparison-router.txt
      - name: Retain benchmark evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: bench-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench-evidence/
          if-no-files-found: warn
          retention-days: 7
