name: Image Build, Sign & SBOM

on:
  # ACR-based signing path for karsacr.azurecr.io. It requires ACR_USERNAME
  # /ACR_PASSWORD secrets that do NOT exist until the MCR namespace is
  # onboarded, so auto-firing on v* tags only produces a guaranteed
  # "Input required: username" failure on azure/docker-login. Public
  # releases are signed via release-public-interim.yml (keyless cosign on
  # GHCR). Keep this dispatch-only until ACR creds are provisioned.
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag"
        required: true
        default: "0.1.0"

permissions:
  contents: read

env:
  REGISTRY: karsacr.azurecr.io
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-binaries:
    name: Build Rust binaries (host glibc)
    # Pinned to ubuntu-22.04 (glibc 2.35) so the binary runs on
    # AL3 distroless (glibc 2.38). Newer runners could emit symbols
    # AL3 can't resolve.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: rust-glibc-release
      - name: cargo build --release
        run: cargo build --release --workspace
      - name: Stage binaries (per-arch layout)
        run: |
          mkdir -p ./bin/amd64
          cp target/release/kars-controller         ./bin/amd64/
          cp target/release/kars-inference-router   ./bin/amd64/
          cp target/release/kars-a2a-gateway        ./bin/amd64/
          cp target/release/kars-conformance-runner ./bin/amd64/
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-binaries-${{ github.sha }}
          path: ./bin/
          retention-days: 1

  build-sign-sbom:
    name: Build, Sign & SBOM
    needs: build-binaries
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for Notation signing with OIDC
    strategy:
      matrix:
        component:
          - name: controller
            dockerfile: controller/Dockerfile
            image: kars-controller
          - name: inference-router
            dockerfile: inference-router/Dockerfile
            image: kars-inference-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download pre-built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kars-binaries-${{ github.sha }}
          path: ./bin/
      - name: chmod binaries
        run: find ./bin -type f -name 'kars-*' -exec chmod +x {} \;

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ACR
        uses: azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c # v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.component.image }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ matrix.component.image }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
          # Enable BuildKit SBOM attestation
          sbom: true
          provenance: true

      # ─── SBOM Generation ─────────────────────────────────────────────
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.component.image }}:${{ env.VERSION }}
          format: spdx-json
          output-file: sbom-${{ matrix.component.name }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.component.name }}
          path: sbom-${{ matrix.component.name }}.spdx.json

      # ─── Image Signing with Notation ──────────────────────────────────
      - name: Install Notation
        uses: notaryproject/notation-action/setup@b6fee73110795d6793253c673bd723f12bcf9bbb # v1.2.2
        with:
          version: "1.2.0"

      - name: Sign image with Notation
        uses: notaryproject/notation-action/sign@b6fee73110795d6793253c673bd723f12bcf9bbb # v1.2.2
        with:
          plugin_name: azure-kv
          plugin_url: https://github.com/Azure/notation-azure-kv/releases/download/v1.2.0/notation-azure-kv_1.2.0_linux_amd64.tar.gz
          key_id: ${{ secrets.NOTATION_KEY_ID }}
          target_artifact_reference: ${{ env.REGISTRY }}/${{ matrix.component.image }}:${{ env.VERSION }}

      - name: Verify signature
        run: |
          notation verify ${{ env.REGISTRY }}/${{ matrix.component.image }}:${{ env.VERSION }} \
            --trust-policy-file deploy/security/notation-trust-policy.json
