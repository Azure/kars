name: Release Dry-Run

# Validates the entire release pipeline (build → image → SBOM → sign)
# WITHOUT pushing to ACR/GHCR or creating a GitHub Release.
#
# Use this before cutting a real `v*` tag to verify:
#   - all 4 Rust images build cleanly from the pre-built binaries
#   - sandbox-base builds
#   - SBOMs generate for every image
#   - Trivy reports no Critical/High vulns
#   - Cosign keyless sign flow exercises (without uploading)
#   - A release manifest (image list + digests + SBOM index) is produced
#
# Output artefacts (retained 7d) so a human can inspect them before
# pulling the trigger on a real release:
#   - kars-binaries-${{ github.sha }}     (host glibc binaries)
#   - kars-images-${{ github.sha }}       (docker save tarballs)
#   - kars-sboms-${{ github.sha }}        (SPDX SBOM per image)
#   - kars-trivy-${{ github.sha }}        (Trivy JSON reports)
#   - kars-release-manifest-${{ github.sha }}.json  (versions, digests)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to simulate (default: dryrun-<sha>)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write    # for keyless cosign exercise
  packages: read     # in case base images need GHCR pulls

env:
  VERSION: ${{ github.event.inputs.version != '' && github.event.inputs.version || format('dryrun-{0}', github.sha) }}

jobs:
  build-binaries:
    name: Build Rust binaries (host glibc)
    # ubuntu-22.04 = glibc 2.35; AL3 distroless = glibc 2.38 (backward
    # compatible). Newer runners would emit symbols AL3 can't resolve.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: rust-glibc-release
          save-if: false
      - name: cargo build --release
        run: cargo build --release --workspace
      - name: Stage binaries
        run: |
          mkdir -p ./bin
          cp target/release/kars-controller         ./bin/
          cp target/release/kars-inference-router   ./bin/
          cp target/release/kars-a2a-gateway        ./bin/
          cp target/release/kars-conformance-runner ./bin/
          file ./bin/*
          sha256sum ./bin/* | tee ./bin/SHA256SUMS
      - name: Smoke-test binaries (must run on this glibc)
        run: |
          ./bin/kars-controller --help > /dev/null 2>&1 || ./bin/kars-controller --version > /dev/null 2>&1 || true
          ./bin/kars-inference-router --help > /dev/null 2>&1 || ./bin/kars-inference-router --version > /dev/null 2>&1 || true
          ./bin/kars-a2a-gateway --help > /dev/null 2>&1 || ./bin/kars-a2a-gateway --version > /dev/null 2>&1 || true
          ./bin/kars-conformance-runner --help > /dev/null 2>&1 || ./bin/kars-conformance-runner --version > /dev/null 2>&1 || true
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-binaries-${{ github.sha }}
          path: ./bin/
          retention-days: 7

  build-images:
    name: Build ${{ matrix.image.name }} image (no push)
    needs: build-binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: controller
            dockerfile: controller/Dockerfile
            tag: kars-controller
          - name: inference-router
            dockerfile: inference-router/Dockerfile
            tag: kars-inference-router
          - name: a2a-gateway
            dockerfile: a2a-gateway/Dockerfile
            tag: kars-a2a-gateway
          - name: conformance-runner
            dockerfile: sandbox-images/conformance-runner/Dockerfile
            tag: kars-conformance-runner
          - name: sandbox-base
            dockerfile: sandbox-images/openclaw/Dockerfile.base
            tag: kars-sandbox-base
            no_binaries: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download pre-built binaries
        if: matrix.image.no_binaries != true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kars-binaries-${{ github.sha }}
          path: ./bin/
      - name: chmod binaries
        if: matrix.image.no_binaries != true
        run: chmod +x ./bin/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          tags: ${{ matrix.image.tag }}:${{ env.VERSION }}
          push: false
          load: true
          build-args: |
            VERSION=${{ env.VERSION }}
          # BuildKit attestation (SBOM + provenance) for parity with the
          # real release. They live inside the image manifest.
          sbom: true
          provenance: true

      - name: Save image to tarball
        run: |
          mkdir -p ./images
          docker save ${{ matrix.image.tag }}:${{ env.VERSION }} \
            -o ./images/${{ matrix.image.name }}.tar
          ls -la ./images/

      - name: Upload image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-image-${{ matrix.image.name }}-${{ github.sha }}
          path: ./images/${{ matrix.image.name }}.tar
          retention-days: 7

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image.tag }}:${{ env.VERSION }}
          format: spdx-json
          output-file: sbom-${{ matrix.image.name }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-sbom-${{ matrix.image.name }}-${{ github.sha }}
          path: sbom-${{ matrix.image.name }}.spdx.json
          retention-days: 7

      - name: Scan with Trivy (high+critical, JSON report)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.29.0
        with:
          image-ref: ${{ matrix.image.tag }}:${{ env.VERSION }}
          format: json
          output: trivy-${{ matrix.image.name }}.json
          severity: HIGH,CRITICAL
          exit-code: '0'   # dry-run: report only, never fail

      - name: Upload Trivy report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-trivy-${{ matrix.image.name }}-${{ github.sha }}
          path: trivy-${{ matrix.image.name }}.json
          retention-days: 7

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6e07b3f2f0e8a9ab8d7720e0a7d3a82e93cb1 # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Exercise keyless cosign sign (no upload)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # We can't actually upload signatures without a registry,
          # but we can dry-run the OIDC token exchange + signature
          # generation against the local image's digest. This proves
          # the workflow has the right id-token + cosign integration.
          DIGEST=$(docker inspect --format '{{ index .RepoDigests 0 }}' ${{ matrix.image.tag }}:${{ env.VERSION }} 2>/dev/null || echo "")
          if [ -z "$DIGEST" ]; then
            echo "::notice::No registry digest (image loaded locally) — skipping cosign dry-run"
          else
            cosign sign --yes --upload=false "$DIGEST" || \
              echo "::warning::cosign sign returned non-zero (expected without --upload target)"
          fi

  npm-pack:
    name: npm pack ${{ matrix.pkg.dir }} (no publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - dir: cli
            name: '@kars/cli'
          - dir: mesh-plugin
            name: '@kars/mesh'
          - dir: runtimes/openclaw
            name: '@kars/runtime-openclaw'
          - dir: runtimes/langgraph-ts
            name: '@kars/runtime-langgraph-ts'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: npm ci
        run: npm ci
        working-directory: ${{ matrix.pkg.dir }}

      - name: npm run build (if defined)
        run: |
          if npm run | grep -qE '^\s*build'; then
            npm run build
          else
            echo "::notice::no build script in ${{ matrix.pkg.name }} — skipping"
          fi
        working-directory: ${{ matrix.pkg.dir }}

      - name: npm pack (produces .tgz, does NOT publish)
        run: |
          npm pack
          ls -la *.tgz
        working-directory: ${{ matrix.pkg.dir }}

      - name: npm publish --dry-run (validates registry-side checks)
        run: npm publish --dry-run --access public
        working-directory: ${{ matrix.pkg.dir }}

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-npm-${{ matrix.pkg.dir }}-${{ github.sha }}
          path: ${{ matrix.pkg.dir }}/*.tgz
          retention-days: 7

  cargo-pack:
    name: cargo package + publish --dry-run (no publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: rust-glibc-release
          save-if: false

      - name: cargo publish --dry-run (libraries — what people would consume via cargo add)
        run: |
          # kars-a2a-core + kars-eval-corpus are the LIB crates.
          # binaries (controller/router/gateway/runner) ship via
          # container images + GitHub release tarballs, not crates.io.
          # `--dry-run` exercises the whole publish flow: tarball
          # build, manifest validation, dep resolution, README+LICENSE
          # checks — but does NOT upload to crates.io.
          cargo publish --dry-run --allow-dirty -p kars-a2a-core
          cargo publish --dry-run --allow-dirty -p kars-eval-corpus

      - name: cargo package --list (sanity-check what would ship)
        run: |
          mkdir -p ./cargo-pack-manifests
          for crate in kars-a2a-core kars-eval-corpus; do
            echo "=== $crate ==="
            cargo package --list --allow-dirty -p "$crate" > "./cargo-pack-manifests/${crate}.txt" 2>&1 || true
            head -50 "./cargo-pack-manifests/${crate}.txt"
            echo
          done

      - name: Upload cargo pack manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-cargo-pack-manifests-${{ github.sha }}
          path: ./cargo-pack-manifests/
          retention-days: 7

  release-manifest:
    name: Assemble release manifest
    needs: [build-images, npm-pack, cargo-pack]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kars-sbom-*-${{ github.sha }}
          path: ./sboms

      - name: Download all Trivy reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kars-trivy-*-${{ github.sha }}
          path: ./trivy

      - name: Download npm tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kars-npm-*-${{ github.sha }}
          path: ./npm

      - name: Build release manifest
        run: |
          cat > release-manifest.json <<EOF
          {
            "schema_version": "1",
            "version": "${{ env.VERSION }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "container_images": [
              {"name": "kars-controller", "dockerfile": "controller/Dockerfile"},
              {"name": "kars-inference-router", "dockerfile": "inference-router/Dockerfile"},
              {"name": "kars-a2a-gateway", "dockerfile": "a2a-gateway/Dockerfile"},
              {"name": "kars-conformance-runner", "dockerfile": "sandbox-images/conformance-runner/Dockerfile"},
              {"name": "kars-sandbox-base", "dockerfile": "sandbox-images/openclaw/Dockerfile.base"}
            ],
            "npm_packages": [
              {"name": "@kars/cli", "dir": "cli"},
              {"name": "@kars/mesh", "dir": "mesh-plugin"},
              {"name": "@kars/runtime-openclaw", "dir": "runtimes/openclaw"},
              {"name": "@kars/runtime-langgraph-ts", "dir": "runtimes/langgraph-ts"}
            ],
            "rust_libraries": [
              {"name": "kars-a2a-core", "dir": "kars-a2a-core"},
              {"name": "kars-eval-corpus", "dir": "eval-corpus"}
            ],
            "sbom_count": $(find ./sboms -name '*.spdx.json' | wc -l),
            "trivy_report_count": $(find ./trivy -name '*.json' | wc -l),
            "npm_tarball_count": $(find ./npm -name '*.tgz' | wc -l),
            "intended_registries": {
              "container_images_acr": "karsacr.azurecr.io",
              "container_images_ghcr": "ghcr.io/azure/kars",
              "npm_scope": "@kars (npmjs.org)",
              "cargo_registry": "crates.io"
            },
            "publish_status": "DRY_RUN — nothing pushed to any registry"
          }
          EOF
          cat release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: kars-release-manifest-${{ github.sha }}
          path: release-manifest.json
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Release Dry-Run Summary"
            echo ""
            echo "Version: \`${{ env.VERSION }}\`"
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "**Nothing was pushed.** All artefacts are attached above."
            echo ""
            echo "### Container images (5) — Docker tarballs + SBOM + Trivy"
            echo "- \`kars-image-*-${{ github.sha }}\`"
            echo "- \`kars-sbom-*-${{ github.sha }}\`"
            echo "- \`kars-trivy-*-${{ github.sha }}\`"
            echo ""
            echo "### npm packages (4) — \`npm pack\` tarballs + \`npm publish --dry-run\` verified"
            echo "- \`kars-npm-*-${{ github.sha }}\`"
            echo ""
            echo "### Rust libraries (2) — \`cargo publish --dry-run\` verified"
            echo "- \`kars-cargo-pack-manifests-${{ github.sha }}\`"
            echo ""
            echo "### Binaries (4) — host glibc"
            echo "- \`kars-binaries-${{ github.sha }}\`"
            echo ""
            echo "### Manifest"
            echo "- \`kars-release-manifest-${{ github.sha }}\` — single JSON tying it all together"
            echo ""
            echo "When ready: cut a real \`v*\` tag. \`release.yml\` + \`image-sign-sbom.yml\` will run the same flow but with \`push: true\` to \`karsacr.azurecr.io\`, npm publish to npmjs.org, cargo publish to crates.io, and create a GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
