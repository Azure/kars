name: ci-gates

on:
  pull_request:
    branches: [main, kars-bridge, 'public/pr*']
  push:
    branches: [main, kars-bridge]

permissions:
  contents: read

concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Per internal Phase 1 plan §4.4 — all gates fail-hard, no continue-on-error.
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - loc
          - no-stubs
          - no-custom-crypto
          - no-null-provider-prod
          - security-audit-required
          - a2a-module-isolation
          - copyright-headers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so BASE_REF diffs work

      - name: Set BASE_REF
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_REF=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=HEAD~1" >> "$GITHUB_ENV"
          fi

      - name: Make scripts executable
        run: chmod +x ci/*.sh

      - name: Set up the locked source parser
        if: matrix.gate == 'no-stubs'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install locked source parser
        if: matrix.gate == 'no-stubs'
        run: npm ci --prefix cli --ignore-scripts --no-audit --no-fund

      - name: Verify source-gate regression fixtures
        if: matrix.gate == 'no-stubs'
        run: python3 -m unittest discover -s ci/tests -p '*_test.py'

      - name: Verify exact crypto-adapter boundaries
        if: matrix.gate == 'no-custom-crypto'
        run: python3 -m unittest discover -s ci/tests -p crypto_gate_test.py

      - name: Verify fresh audit-record boundaries
        if: matrix.gate == 'security-audit-required'
        run: python3 -m unittest discover -s ci/tests -p security_audit_gate_test.py

      - name: Run gate ${{ matrix.gate }}
        shell: bash
        env:
          VERBOSE: "1"
        run: |
          case "${{ matrix.gate }}" in
            loc)                       ./ci/check-loc.sh ;;
            no-stubs)                  ./ci/no-stubs.sh ;;
            no-custom-crypto)          ./ci/no-custom-crypto.sh ;;
            no-null-provider-prod)     ./ci/no-null-provider-prod.sh ;;
            security-audit-required)   ./ci/security-audit-required.sh ;;
            a2a-module-isolation)      ./ci/a2a-module-isolation.sh ;;
            copyright-headers)         ./ci/check-copyright-headers.sh ;;
          esac
