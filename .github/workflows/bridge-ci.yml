name: Bridge CI

on:
  pull_request:
    branches: [main, dev, kars-bridge]
  push:
    branches: [main, kars-bridge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bridge-required-gates:
    name: Bridge component acceptance
    needs: [addon, bff, dependencies, idp, lockfiles, rust-dependencies, secrets, security, web]
    if: always()
    runs-on: ubuntu-22.04
    env:
      COMPONENT_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/bridge_component_results.py

  bff:
    name: BFF build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge/bff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: bridge/bff
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Require trust and authorization regression registration
        run: |
          cargo test --locked -- --list > /tmp/kars-bridge-bff-tests.txt
          for name in \
            routes::receipts::anchor::tests::pins_follow_the_controller_raw_key_fingerprint_contract \
            routes::receipts::anchor::tests::copied_key_id_cannot_substitute_another_public_key \
            routes::receipts::anchor::tests::malformed_empty_mismatched_or_missing_pins_fail_closed \
            kars::receipt_log::tests::receipt_endpoint_still_requires_signed_payload_binding_and_full_overflow_inclusion \
            providers::signing::tests::sha256_matches_standard_known_answers_without_normalizing_bytes \
            kars::credential_review::digest_tests::review_digest_preserves_compact_sorted_json_and_full_hex_width \
            kars::receipt_log::digest_tests::chain_hash_keeps_decimal_sequence_and_exact_pipe_framing \
            routes::artifacts::digest_tests::artifact_addresses_keep_the_existing_sixteen_byte_short_form \
            routes::operator::audit::datapath::tests::witness_missing_is_unknown_not_not_installed_and_intent_is_separate \
            routes::operator::audit::datapath::tests::witness_fresh_and_empty_samples_never_claim_complete_coverage \
            routes::operator::audit::datapath::tests::witness_malformed_stale_future_and_identity_fail_closed \
            routes::operator::audit::datapath::tests::witness_empty_configmaps_legacy_and_failed_capture_are_distinct \
            routes::operator::audit::datapath::tests::witness_route_only_gets_two_fixed_configmaps_and_preserves_api_errors \
            routes::github::tests::connection_names_keep_the_original_raw_subject_and_eight_byte_digest \
            providers::receipt::tests::rfc8032_known_answer_and_malformed_signatures_keep_exact_verification_semantics \
            providers::credential_review::tests::legacy_v1_key_preserves_domain_null_byte_and_raw_secret_encoding \
            providers::credential_review::tests::tag_comparison_requires_equal_length_and_every_byte_without_normalization \
            auth::admin_tests::admin_route_and_role_matrix_does_not_promote_operators_or_gate_reads \
            auth::admin_tests::direct_bff_admin_mutations_deny_missing_forged_expired_and_non_admin_principals \
            auth::admin_tests::budget_and_retention_handlers_require_admin_even_without_route_middleware \
            auth::admin_tests::signed_admins_can_set_and_clear_each_budget_scope_and_retention \
            auth::admin_tests::operator_reads_stay_available_while_user_and_auditor_console_reads_stay_denied \
            routes::operator::copilot_login::tests::device_login_wire_contract_and_cumulative_slowdown_use_real_http_client \
            routes::operator::copilot_login::tests::missing_or_unready_grant_and_replaced_store_prevent_all_oauth_requests \
            routes::operator::copilot_login::tests::invalid_and_non_success_upstream_responses_are_never_pending_or_echoed \
            routes::operator::copilot_login::tests::start_response_validation_blocks_empty_codes_and_untrusted_verification_urls \
            routes::operator::copilot_login::tests::expiry_and_denial_are_terminal_not_pending \
            routes::operator::copilot_login::tests::granted_token_is_stored_before_authorized_and_late_failures_never_claim_success \
            routes::operator::copilot_login::tests::production_handlers_reject_malformed_inputs_and_missing_grants_without_oauth \
            routes::operator::copilot_login::tests::failed_or_malformed_seat_verification_never_stores_credentials \
            routes::operator::copilot_login::tests::device_login_redirects_never_replay_codes_or_mutate_credentials \
            routes::operator::copilot_transport::tests::github_endpoints_use_fixed_https_urls_and_methods \
            routes::operator::copilot_transport::tests::github_transport_rejects_http_before_connecting \
            routes::operator::copilot_transport::tests::loopback_fixture_rejects_non_loopback_addresses \
            routes::operator::copilot_transport::tests::loopback_fixture_uses_fixed_urls_and_pinned_socket_routing \
            routes::operator::copilot_transport::tests::github_tls_transport_preserves_oauth_and_copilot_requests \
            routes::operator::copilot_transport::tests::github_tls_transport_does_not_follow_redirects \
            routes::operator::copilot_transport::tests::github_transport_rejects_untrusted_certificates_and_hostnames \
            routes::tasks::artifacts::tests::active_and_unknown_artifacts_download_unchanged_from_live_or_retained_tasks \
            routes::tasks::artifacts::tests::passive_artifact_previews_keep_inline_viewing_without_mime_sniffing_or_byte_changes \
            routes::tasks::artifacts::tests::artifact_head_has_the_same_protection_and_filename_is_header_safe \
            routes::tasks::artifacts::tests::artifact_response_hardening_preserves_ownership_and_missing_file_denials \
            routes::engineering::remediation::renewal_tests::current_producer_new_advisory_after_done_gets_followup_not_lost_or_replayed \
            routes::engineering::remediation::renewal_tests::completed_source_ignores_poll_time_titles_and_pr_candidates_but_not_changed_fix_facts \
            routes::engineering::remediation::renewal_tests::current_producer_pending_source_refreshes_without_spending_capacity_or_changing_identity \
            routes::engineering::remediation::renewal_tests::active_approved_and_nonce_bound_pending_inputs_are_frozen_with_dependent_followups \
            routes::engineering::remediation::renewal_tests::current_producer_aggregation_is_order_independent_and_removes_only_closed_pending_findings \
            routes::engineering::remediation::renewal_tests::full_empty_snapshot_retires_unassigned_source_without_claiming_delivery_or_erasing_runs \
            routes::engineering::remediation::renewal_tests::refreshed_followup_preserves_original_history_and_withdrawn_findings_are_not_reintroduced \
            routes::engineering::remediation::renewal_tests::proven_legacy_history_remains_immutable_when_current_producer_finds_a_new_alert \
            routes::engineering::remediation::renewal_tests::final_merge_rechecks_assignment_and_completion_after_admission \
            routes::engineering::remediation::renewal_tests::direct_final_merge_aggregates_current_producer_and_preserves_completed_pr_evidence \
            routes::engineering::remediation::renewal_tests::remediation_queue_cap_retries_new_followups_but_allows_unassigned_refreshes \
            routes::engineering::remediation::renewal_tests::missing_v2_original_metadata_cannot_authorize_overwriting_a_completed_row \
            routes::engineering::remediation::renewal_tests::legacy_retirement_cannot_rewrite_a_concurrently_assigned_pending_task \
            routes::engineering::remediation::renewal_tests::duplicated_alert_pages_keep_latest_facts_and_all_pr_candidate_links_in_either_order \
            routes::engineering::remediation::renewal_tests::partial_poll_refreshes_seen_alerts_without_discarding_unseen_pending_findings \
            routes::engineering::remediation::renewal_tests::source_withdrawal_final_merge_does_not_change_a_newly_assigned_v2_task
          do
            grep -Fx "$name: test" /tmp/kars-bridge-bff-tests.txt
          done
      - run: cargo test --locked
      - name: Check explicit credential review orchestration
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=../tests/native-credentials python3 -m unittest discover -s ../tests/native-credentials -p test_credential_review.py
      - name: Check witness producer and BFF matching agreement
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s src/routes/operator -p datapath_matching_contract_test.py
      - name: Check shipping image contract regressions
        working-directory: .
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s ci -p test_bridge_image_contract.py
      - name: Build and exercise the shipping BFF image without publishing
        run: |
          docker build --tag kars-bridge-bff-qualification:latest .
          python3 ../../ci/bridge_image_contract.py kars-bridge-bff-qualification:latest --kind bff
      - name: Scan the actual BFF runtime including unfixed findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: kars-bridge-bff-qualification:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/bridge-bff-image-scan.json
      - name: Retain BFF runtime scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: bridge-bff-image-scan-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-bff-image-scan.json
          if-no-files-found: warn

  web:
    name: Web build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx --no-install tsc --noEmit
      - name: Check all web authorization, form, proxy and evidence contracts
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Build the production web image without publishing
        run: docker build --tag kars-bridge-web-qualification:latest .
      - name: Inspect the actual web runtime distribution, tools and CA trust
        run: python3 ../../ci/bridge_image_contract.py kars-bridge-web-qualification:latest --kind web
      - name: Start web with an immutable root filesystem
        run: |
          container=$(docker run --detach --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=134217728,uid=10001,gid=10001 \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,size=268435456,uid=10001,gid=10001 \
            --publish 127.0.0.1:3000:3000 --env HOSTNAME=0.0.0.0 \
            kars-bridge-web-qualification:latest)
          echo "WEB_CONTAINER_ID=$container" >> "$GITHUB_ENV"
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 \
            --max-time 10 http://127.0.0.1:3000/api/health
          docker exec "$container" node -e '
            const fs = require("node:fs");
            const assert = require("node:assert/strict");
            fs.writeFileSync("/app/.next/cache/qualification", "cache works");
            fs.writeFileSync("/tmp/qualification", "temporary writes work");
            assert.throws(() => fs.writeFileSync("/app/qualification", "denied"),
              error => error.code === "EROFS" || error.code === "EACCES");
          '
          docker exec "$container" node --input-type=module -e '
            import assert from "node:assert/strict";
            import sharp from "sharp";
            const image = await sharp(Buffer.from([255, 0, 0, 255]),
              { raw: { width: 1, height: 1, channels: 4 } }).resize(2, 2).png().toBuffer();
            const metadata = await sharp(image).metadata();
            assert.equal(metadata.width, 2);
            assert.equal(metadata.height, 2);
            assert.equal(metadata.format, "png");
          '
      - name: Scan the actual web runtime including unfixed findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: kars-bridge-web-qualification:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/bridge-web-image-scan.json
      - name: Retain web runtime scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: bridge-web-image-scan-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-web-image-scan.json
          if-no-files-found: warn
      - name: Remove the qualification container
        if: always()
        run: |
          if [ -n "${WEB_CONTAINER_ID:-}" ]; then
            docker logs "$WEB_CONTAINER_ID"
            docker rm --force "$WEB_CONTAINER_ID"
          fi

  idp:
    name: Dex IdP runtime qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize native Dex qualification evidence
        run: |
          set -euo pipefail
          export IDP_EVIDENCE_DIR="$RUNNER_TEMP/bridge-idp-evidence"
          printf 'IDP_EVIDENCE_DIR=%s\n' "$IDP_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$IDP_EVIDENCE_DIR"
          printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$IDP_EVIDENCE_DIR/provenance.txt"
          test "$(uname -m)" = x86_64
          docker info --format '{{.OSType}}/{{.Architecture}}' \
            | tee "$IDP_EVIDENCE_DIR/docker-platform.txt"
          df -h "$RUNNER_TEMP" | tee "$IDP_EVIDENCE_DIR/disk-before.txt"
      - name: Check Dex source contracts and actual reviewed module locks
        id: idp_source
        run: |
          set -euo pipefail
          KARS_DEX_PATCH_NETWORK=1 python3 -m unittest discover \
            -s bridge/idp/tests -p 'test_*.py' \
            2>&1 | tee "$IDP_EVIDENCE_DIR/source-contracts.log"
          PYTHONPATH=bridge/idp/tests python3 -c \
            'from contracts import check_modules; check_modules("bridge/idp"); print("Reviewed Go module locks verified")' \
            2>&1 | tee "$IDP_EVIDENCE_DIR/module-locks.log"
          PYTHONPATH=ci/tests python3 -m unittest bridge_contracts_test.ContractAggregateTests \
            2>&1 | tee "$IDP_EVIDENCE_DIR/component-aggregate-contracts.log"
          git diff --exit-code -- bridge/idp/locks
      - name: Build and run upstream Dex root and API race suites
        id: idp_upstream
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress=plain \
            --target upstream-tests --tag kars-bridge-idp-upstream-tests:latest \
            --file bridge/idp/Dockerfile bridge/idp \
            2>&1 | tee "$IDP_EVIDENCE_DIR/upstream-build.log"
      - name: Collect actual upstream JSON reports and disclose skips
        id: idp_reports
        run: |
          set -euo pipefail
          container=$(docker create kars-bridge-idp-upstream-tests:latest)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/out/doc/upstream-tests.json" "$IDP_EVIDENCE_DIR/upstream-tests.json"
          docker cp "$container:/out/doc/api-tests.json" "$IDP_EVIDENCE_DIR/api-tests.json"
          docker image inspect kars-bridge-idp-upstream-tests:latest \
            > "$IDP_EVIDENCE_DIR/upstream-image.json"
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["IDP_EVIDENCE_DIR"])
          summary = {}
          for label, filename in (("root", "upstream-tests.json"), ("api", "api-tests.json")):
              tests = collections.Counter()
              packages = collections.Counter()
              started, finished = set(), set()
              skips = []
              for number, line in enumerate((evidence / filename).read_text().splitlines(), 1):
                  event = json.loads(line)
                  if not isinstance(event, dict) or not isinstance(event.get("Action"), str):
                      raise SystemExit(f"Invalid Go event in {filename}:{number}")
                  action = event["Action"]
                  if action in ("fail", "build-fail"):
                      raise SystemExit(f"Upstream failure recorded in {filename}:{number}")
                  package = event.get("Package")
                  if package and not event.get("Test"):
                      if action == "start":
                          started.add(package)
                      elif action in ("pass", "skip"):
                          finished.add(package)
                          packages[action] += 1
                  if event.get("Test") and action in ("pass", "skip"):
                      tests[action] += 1
                  if action == "skip":
                      skips.append({"package": package, "test": event.get("Test")})
              if not started or started != finished:
                  raise SystemExit(f"Incomplete package results in {filename}")
              if label == "root" and not tests["pass"]:
                  raise SystemExit("The root report contains no passing upstream tests")
              summary[label] = {
                  "testActions": dict(tests), "packageActions": dict(packages), "skipped": skips,
              }
          summary["coverageLimit"] = (
              "Skipped service integrations and unconfigured LDAP/cloud connectors are not "
              "runtime-qualified. Memory, SQLite and static OIDC require the separate runtime harness."
          )
          (evidence / "upstream-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Dex upstream reports (not final runtime qualification)\n")
              for label in ("root", "api"):
                  counts = summary[label]
                  output.write(f"- {label}: test actions {counts['testActions']}; "
                               f"package actions {counts['packageActions']}. See retained JSON for every skip.\n")
              output.write(summary["coverageLimit"] + "\n")
          PY
      - name: Build Dex tools and run signing-key continuity race regressions
        id: idp_tools
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress=plain \
            --target test-tools --tag kars-bridge-idp-tools:latest \
            --file bridge/idp/Dockerfile bridge/idp \
            2>&1 | tee "$IDP_EVIDENCE_DIR/probe-build.log"
          docker image inspect kars-bridge-idp-tools:latest > "$IDP_EVIDENCE_DIR/tools-image.json"
      - name: Build the actual Azure Linux distroless Dex runtime without publishing
        id: idp_runtime
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress=plain \
            --target runtime --tag kars-bridge-idp-qualification:latest \
            --file bridge/idp/Dockerfile bridge/idp \
            2>&1 | tee "$IDP_EVIDENCE_DIR/runtime-build.log"
      - name: Install pinned Trivy and scan the actual Dex runtime
        id: idp_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          cache: 'false'
          scan-type: image
          image-ref: kars-bridge-idp-qualification:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          list-all-pkgs: 'true'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/bridge-idp-evidence/initial-image-scan.json
      - name: Require real memory SQLite OIDC linkage inventory and fresh-cache scans
        id: idp_qualification
        if: ${{ !cancelled() && steps.idp_runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          {
            trivy_path="$(command -v trivy)"
            test -x "$trivy_path"
            printf '%s\n' "$trivy_path" > "$IDP_EVIDENCE_DIR/trivy-cli-path.txt"
            "$trivy_path" --version | tee "$IDP_EVIDENCE_DIR/trivy-cli-version.txt"
            grep -Eq '^Version: 0[.]70[.]0([[:space:]]|$)' "$IDP_EVIDENCE_DIR/trivy-cli-version.txt"
            python3 bridge/idp/tests/qualify.py \
              --image kars-bridge-idp-qualification:latest \
              --tools-image kars-bridge-idp-tools:latest \
              --trivy "$trivy_path" --evidence "$IDP_EVIDENCE_DIR/runtime"
          } 2>&1 | tee "$IDP_EVIDENCE_DIR/runtime-qualification.log"
      - name: Record Dex step outcomes without overriding failures
        if: always()
        env:
          IDP_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p "$IDP_EVIDENCE_DIR"
          printf '%s\n' "$IDP_STEP_RESULTS" > "$IDP_EVIDENCE_DIR/step-outcomes.json"
      - name: Retain actual Dex qualification evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: bridge-idp-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bridge-idp-evidence/
          if-no-files-found: error

  addon:
    name: Add-on install and uninstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/teams-gateway/package-lock.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: npm ci
        working-directory: bridge/teams-gateway
      - run: npm run lint && npm run typecheck && npm run build && npm test
        working-directory: bridge/teams-gateway
      - name: Check Node runtime packaging contracts
        run: node --test bridge/tests/node-runtime-image.test.mjs
      - name: Build and inspect the shipping Teams gateway image
        run: |
          docker build --tag kars-bridge-gateway-qualification:latest bridge/teams-gateway
          python3 ci/bridge_image_contract.py kars-bridge-gateway-qualification:latest --kind gateway
      - name: Scan the actual gateway runtime including unfixed findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: kars-bridge-gateway-qualification:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/bridge-gateway-image-scan.json
      - name: Retain gateway runtime scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: bridge-gateway-image-scan-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-gateway-image-scan.json
          if-no-files-found: warn
      - run: helm lint bridge/deploy/helm/kars-bridge
      - name: Optional witness runtime and server-side ownership contracts
        run: |
          python3 -m pip install -r deploy/ebpf-witness/tests/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/ebpf-witness/aggregator
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/ebpf-witness/tests -p test_chart.py
      - name: Build the public witness image without publishing
        run: |
          docker build --platform linux/amd64 \
            --build-arg PYTHON_BASE=python:3.12-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322 \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --file deploy/ebpf-witness/aggregator/Dockerfile \
            --tag kars-witness-qualification:latest .
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint python3 \
            kars-witness-qualification:latest -c '
          import json, pathlib, subprocess
          metadata = json.loads(pathlib.Path("/opt/witness/build.json").read_text())
          assert metadata["ig_version"] == "v0.53.2"
          assert metadata["architecture"] == "amd64"
          assert len(metadata["source_revision"]) == 40
          subprocess.run(["kubectl-gadget", "version", "--help"], check=True, capture_output=True)
          print(json.dumps(metadata))
          ' > "$RUNNER_TEMP/witness-image-build.json"
      - name: Retain witness image build provenance (not kernel qualification)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: witness-image-build-${{ github.sha }}
          path: ${{ runner.temp }}/witness-image-build.json
          if-no-files-found: error
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: bridge-addon-lifecycle
          kubeconfig: ${{ runner.temp }}/bridge-addon-kubeconfig
      - name: Exercise real Helm removal in a disposable cluster
        working-directory: bridge/teams-gateway
        env:
          BRIDGE_TEST_KIND_LIFECYCLE: '1'
          BRIDGE_TEST_KUBECONFIG: ${{ runner.temp }}/bridge-addon-kubeconfig
        run: npm test -- tests/chart-lifecycle.test.ts
      - name: Exercise guarded witness enable/off/removal without claiming kernel coverage
        env:
          WITNESS_TEST_KIND_LIFECYCLE: '1'
          WITNESS_TEST_KUBECONFIG: ${{ runner.temp }}/bridge-addon-kubeconfig
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/ebpf-witness/tests -p test_kind_lifecycle.py

  dependencies:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [web, teams-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node ci/npm-audit-bulk.mjs bridge/${{ matrix.project }}/package-lock.json

  rust-dependencies:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-audit
      - run: cargo audit --file bridge/bff/Cargo.lock

  lockfiles:
    name: Lockfile consistency (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [web, teams-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Resolve without installing packages or running dependency scripts
        working-directory: bridge/${{ matrix.project }}
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Require the resolved lockfile to be committed
        run: git diff --exit-code -- bridge/${{ matrix.project }}/package-lock.json
      - name: Retain the generated lockfile for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: proposed-lockfile-${{ matrix.project }}
          path: bridge/${{ matrix.project }}/package-lock.json
          if-no-files-found: error
          retention-days: 7

  security:
    name: Source and configuration security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: bridge
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --only-verified
